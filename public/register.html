<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2E4739">
<title>Register</title>
<script>
// Ask for the form at once, while the styles and fonts are still downloading.
window.__infoP = (function () {
  var qs = new URLSearchParams(location.search), id = qs.get('campaign_id'), prev = qs.get('preview');
  if (!id || !window.fetch) return null;
  var ctl = window.AbortController ? new AbortController() : null;
  if (ctl) setTimeout(function () { ctl.abort(); }, 25000);
  return fetch('/api/public_registration_info', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(prev ? { campaign_id: id, preview: prev } : { campaign_id: id }), signal: ctl ? ctl.signal : undefined })
    .then(function (r) { return r.json().catch(function () { return {}; }).then(function (d) { return { ok: r.ok, d: d }; }); })
    .catch(function () { return null; });
})();
</script>
<link rel="stylesheet" href="/theme.css">
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { scroll-behavior:smooth; }
  body { margin:0; }
  button { font-family:inherit; cursor:pointer; }
  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
  /* the page scrolls as a whole (never inside a box); the bar at the bottom always says what to do next */
  .shell { min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; }
  .top { position:relative; flex:none; color:#F3F1E7; padding:10px 14px 11px;
    background:radial-gradient(120% 140% at 15% 0%, #4F7A62 0%, transparent 55%), radial-gradient(90% 120% at 100% 100%, rgba(169,130,47,.5) 0%, transparent 60%), linear-gradient(160deg,var(--pine),var(--pine-deep)); }
  .top .row { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:1px; }
  .top .church { font-family:var(--font-caps); font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--brass-bright); }
  .top h1 { margin:0; font-size:24px; line-height:1.15; }
  .detailsBtn { flex:none; background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.32); color:#F3F1E7; border-radius:20px; padding:6px 12px; font-size:14px; font-weight:600; }
  .body { flex:1 1 auto; width:100%; max-width:560px; margin:0 auto; padding:10px 12px 16px; display:flex; flex-direction:column; gap:10px; }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:14px; box-shadow:0 1px 0 rgba(0,0,0,.02), 0 8px 24px -14px rgba(34,53,42,.35); }
  .card h2 { margin:0 0 10px; font-family:var(--font-caps); font-weight:400; font-size:13px; letter-spacing:.16em; color:var(--brass-strong); text-transform:uppercase; }
  .intro { white-space:pre-wrap; font-size:15.5px; line-height:1.5; color:var(--ink); margin:0; }
  .q { margin-bottom:14px; }
  .q:last-child { margin-bottom:0; }
  .q > label, .q > .lbl { display:block; font-weight:700; font-size:15.5px; color:var(--ink); margin-bottom:5px; }
  .q > label .req, .q > .lbl .req { color:var(--wine); }
  .q .help { font-size:13.5px; color:var(--slate); margin:-2px 0 6px; line-height:1.4; }
  .q input[type=text], .q input[type=tel], .q input[type=email], .q input[type=number], .q input[type=date], .q textarea, .q select { width:100%; padding:11px 12px; font-size:16.5px; border:1.5px solid var(--line); border-radius:12px; background:#fff; color:var(--ink); font-family:inherit; }
  .q textarea { min-height:90px; resize:vertical; }
  .q input:focus, .q textarea:focus, .q select:focus { outline:none; border-color:var(--wine2); box-shadow:0 0 0 3px #a8432f22; }
  .q.bad input, .q.bad textarea, .q.bad select, .q.bad .seg, .q.bad .filebox { border-color:var(--bad); }
  .q .why { display:none; color:var(--bad); font-size:13.5px; margin-top:4px; }
  .q.bad .why { display:block; }
  .addr { display:grid; gap:8px; grid-template-columns:1fr 1fr; }
  .addr input:nth-child(1), .addr input:nth-child(2) { grid-column:1 / -1; }
  .seg { display:flex; background:var(--pine-dim); border-radius:14px; padding:3px; border:1.5px solid transparent; }
  .seg button { flex:1; border:none; background:none; padding:10px 4px; border-radius:11px; font-size:16px; font-weight:700; color:var(--slate); }
  .seg button.on { background:#fff; color:var(--wine); box-shadow:0 2px 8px rgba(0,0,0,.1); }
  .filebox { border:1.5px dashed var(--stone); border-radius:12px; padding:12px; background:#fff; }
  .filebox .name { font-size:14.5px; color:var(--ink); word-break:break-all; }
  .filebox button { margin-top:8px; }
  .smallbtn { border:1.5px solid var(--line); background:#fff; color:var(--wine); border-radius:11px; padding:8px 12px; font-size:14.5px; font-weight:700; }
  .agree { display:flex; gap:10px; align-items:flex-start; margin-bottom:12px; }
  .agree:last-child { margin-bottom:0; }
  .agree input { width:22px; height:22px; margin-top:2px; flex:none; accent-color:var(--pine); }
  .agree label { font-size:15px; line-height:1.45; color:var(--ink); }
  .agree.bad label { color:var(--bad); }
  .trap { position:absolute; left:-9999px; top:auto; width:1px; height:1px; overflow:hidden; }
  .amt { display:flex; align-items:center; gap:8px; }
  .amt span { font-family:var(--font-head); font-size:26px; font-weight:600; }
  .amt input { max-width:160px; }
  .fine { margin:0; padding:0 6px; text-align:center; color:var(--slate); font-size:12.5px; line-height:1.35; }
  .linkbtn { background:none; border:none; color:var(--wine); text-decoration:underline; text-underline-offset:3px; font-size:inherit; font-weight:600; padding:3px 2px; }
  .sheetbox { position:fixed; left:0; right:0; bottom:0; z-index:25; max-width:520px; margin:0 auto; max-height:82vh; max-height:82dvh; overflow-y:auto; background:var(--surface); border-radius:20px 20px 0 0; padding:18px 16px calc(18px + env(safe-area-inset-bottom)); box-shadow:0 -14px 40px rgba(0,0,0,.4); }
  .sheetbox h2 { margin:0 28px 10px 0; font-family:var(--font-caps); font-weight:400; font-size:15px; letter-spacing:.16em; color:var(--brass-strong); text-transform:uppercase; }
  .sheetbox .close { position:absolute; top:10px; right:12px; width:36px; height:36px; border:none; background:var(--pine-dim); color:var(--pine); border-radius:50%; font-size:16px; font-weight:700; }
  .note { margin:0 0 8px; font-size:15px; color:var(--slate); line-height:1.45; }
  .dtext { white-space:pre-wrap; font-size:16px; line-height:1.55; color:var(--ink); }
  .bar { flex:none; position:sticky; bottom:0; z-index:20; padding:8px 12px calc(8px + env(safe-area-inset-bottom)); background:var(--surface); border-top:1px solid var(--line); box-shadow:0 -8px 24px -14px rgba(0,0,0,.3); }
  .bar .in { max-width:560px; margin:0 auto; }
  .go { width:100%; padding:13px; border:none; border-radius:14px; font-size:18px; font-weight:800; color:#fff; background:linear-gradient(180deg,#3E5E4C,#2E4739); box-shadow:0 4px 0 #1A2A20; }
  .go:active { transform:translateY(2px); box-shadow:0 2px 0 #1A2A20; }
  .go:disabled { opacity:.7; }
  .err { background:var(--bad-dim); color:var(--bad); padding:10px 12px; border-radius:12px; font-size:14px; margin-bottom:8px; }
  .ok { background:#E3EEE5; color:#24593A; padding:11px 13px; border-radius:12px; font-size:15px; line-height:1.4; margin-top:8px; }
  .gold { background:var(--gold-dim); border:1px solid #DCCB98; border-radius:12px; padding:9px 12px; font-size:14px; color:var(--ink); }
  .preview { background:#FFF3CD; color:#5C4400; border:1px solid #E6C65C; border-radius:10px; padding:8px 12px; margin-bottom:8px; font-size:14px; }
  .fatal { max-width:480px; margin:40px auto; padding:0 16px; }
  .shuf { width:100%; border:none; padding:12px 8px; border-radius:13px; font-size:16.5px; font-weight:800; color:var(--ink); background:linear-gradient(180deg,#DDBA66,#B8913A); box-shadow:0 4px 0 #8B6A22; }
  .veil { position:fixed; inset:0; z-index:60; display:none; align-items:center; justify-content:center; background:rgba(46,71,57,.92); color:#fff; font-size:20px; font-weight:700; text-align:center; padding:20px; }
  .veil.on { display:flex; }
</style>
</head>
<body>
<div id="app"><div class="fatal"><div class="card">Loading…</div></div></div>
<div class="veil" id="veil">Taking you to the payment page…</div>
<script>
const $ = (id) => document.getElementById(id);
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
async function call(action, body) {
  const ctl = new AbortController(); const timer = setTimeout(() => ctl.abort(), 40000);
  let res, data;
  try {
    res = await fetch('/api/' + action, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}), signal: ctl.signal });
    data = await res.json().catch(() => ({}));
  } catch (e) {
    const err = new Error(e && e.name === 'AbortError' ? 'No reply from the server — the signal may be weak.' : "Can't reach the server — check your signal.");
    err.network = true; throw err;
  } finally { clearTimeout(timer); }
  if (!res.ok) throw new Error(data.error || 'Something went wrong');
  return data;
}
function newClientRef() { return (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 12); }
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function dayText(iso) { const [y, m, d] = String(iso).split('-').map(Number); return `${d} ${MONTHS[m - 1]} ${y}`; }
function money(n) { return '£' + Number(n).toFixed(2); }

const campaignId = new URLSearchParams(location.search).get('campaign_id');
const previewToken = new URLSearchParams(location.search).get('preview') || undefined;
let info = null, busy = false, attempt = null, files = {};

// ---- small print behind links, so the form stays clear
function privacyLine() { return `<button type="button" class="linkbtn" data-sheet="privacyCard">Privacy &amp; your data</button>`; }
function sheets() {
  const o = info.org;
  return `${info.campaign.details_text ? `<div class="sheetbox" id="details" hidden><button type="button" class="close" data-close="details" aria-label="Close">✕</button><h2>Details</h2><div class="dtext">${esc(info.campaign.details_text)}</div>${o.address ? `<p class="note" style="margin-top:12px">${esc(o.name)} · ${esc(o.address)}</p>` : ''}</div>` : ''}
  <div class="sheetbox" id="privacyCard" hidden>
    <button type="button" class="close" data-close="privacyCard" aria-label="Close">✕</button>
    <h2>Privacy &amp; your data</h2>
    <p class="note">${info.form.intro ? esc(info.form.intro) : 'The Parish keeps the details you give here only for the purpose of this form.'}</p>
    ${info.form.payment ? '<p class="note">Card payments are processed by SumUp.</p>' : ''}
    <p class="note">Your details are removed automatically some time after this has finished.</p>
    ${o.privacy_url ? `<p class="note">How we process your data, and your rights: <a href="${esc(o.privacy_url)}" target="_blank" rel="noopener">Privacy Notice</a>.</p>` : ''}
    ${o.contact_email ? `<p class="note">Questions about your details: <a href="mailto:${esc(o.contact_email)}">${esc(o.contact_email)}</a>.</p>` : ''}
  </div>`;
}
function wireSheets() {
  document.querySelectorAll('[data-sheet]').forEach(b => { b.onclick = () => { $(b.dataset.sheet).hidden = false; }; });
  document.querySelectorAll('[data-close]').forEach(b => { b.onclick = () => { $(b.dataset.close).hidden = true; }; });
}
function header(extra) {
  return `<header class="top">
    ${info.preview ? '<div class="preview"><b>Preview</b> — only you can see this. Nothing can be submitted from here.</div>' : ''}
    ${info.org.name ? `<div class="church">${esc(info.org.name)}</div>` : ''}
    <div class="row"><h1>${esc(info.campaign.name)}</h1>${info.campaign.details_text ? '<button class="detailsBtn" type="button" data-sheet="details">ℹ️ Details</button>' : ''}</div>
    ${extra || ''}
  </header>`;
}

// ---- full-page messages (closed, not open yet, fully booked, waiting list)
function findBlock() {
  return `<div style="margin-top:18px;padding-top:14px;border-top:1px solid var(--line)">
      <b>Already registered? Find your registration</b>
      <p class="note" style="margin:4px 0 8px">Type the mobile number or email you used.</p>
      <input id="fContact" placeholder="Mobile or email" autocomplete="email" inputmode="email" style="width:100%;padding:11px 12px;font-size:16.5px;border:1.5px solid var(--line);border-radius:12px">
      <button type="button" class="shuf" id="findBtn" style="margin-top:10px">🔎 Find my registration</button>
      <div id="findOut" role="status" aria-live="polite"></div>
    </div>`;
}
function statusPage(inner) {
  return `<div class="fatal"><div class="card">
    <h1 style="font-size:24px;margin:0 0 4px">${esc(info.campaign.name)}</h1>
    <p class="note">${esc(info.org.name)}</p>
    ${inner}
    ${findBlock()}
    <p class="fine" style="margin-top:14px">${privacyLine()}</p>
  </div></div>${sheets()}`;
}
async function findRegistration() {
  const out = $('findOut'), btn = $('findBtn'), v = $('fContact').value.trim();
  if (!v) { out.innerHTML = '<div class="err" style="margin-top:10px">Please type the mobile number or email you used.</div>'; return; }
  btn.disabled = true; out.innerHTML = '<p class="note" style="margin-top:10px">Looking…</p>';
  try {
    const { registrations } = await call('public_find_registrations', { campaign_id: campaignId, contact_value: v });
    if (!registrations.length) out.innerHTML = `<div class="err" style="margin-top:10px">We couldn't find a registration for that number or email. Check it's spelt exactly as you entered it.</div>`;
    else out.innerHTML = '<p class="note" style="margin:12px 0 6px">Found — tap to open:</p>' + registrations.map(r => `<a href="/registration.html?id=${encodeURIComponent(r.id)}" style="display:flex;justify-content:space-between;gap:10px;padding:12px;margin-top:8px;border-radius:12px;background:var(--gold-dim);border:1px solid #DCCB98;color:var(--ink);text-decoration:none"><b>${esc(r.display_number)}</b><span>${registrations.length > 1 ? esc(r.name || '') : esc(r.status.replace('_', ' '))}</span></a>`).join('');
  } catch (e) { out.innerHTML = `<div class="err" style="margin-top:10px">${esc(e.message)}</div>`; }
  finally { btn.disabled = false; }
}
async function joinWaitingList() {
  const out = $('wlOut'), btn = $('wlBtn'), email = $('wlEmail').value.trim();
  if (!email) { out.innerHTML = '<div class="err" style="margin-top:10px">Please type your email address.</div>'; return; }
  btn.disabled = true; btn.textContent = 'Joining…'; out.innerHTML = '';
  try {
    const r = await call('public_join_waiting_list', { campaign_id: campaignId, email });
    $('wlForm').hidden = true;
    out.innerHTML = r.available
      ? `<div class="ok"><b>Good news — places are open.</b><br>You can register now.</div><button type="button" class="shuf" style="margin-top:10px" onclick="location.reload()">Register now</button>`
      : `<div class="ok"><b>✓ ${r.already ? "You're already on the waiting list." : "You're on the waiting list."}</b><br>We'll email ${esc(email.toLowerCase())} if places open up. When we do, register straight away — places go to whoever registers first.</div>`;
  } catch (e) { out.innerHTML = `<div class="err" style="margin-top:10px">${esc(e.message)}</div>`; btn.disabled = false; btn.textContent = '🔔 Join the waiting list'; }
}

// ---- the form
function fieldHtml(f) {
  const id = 'f_' + f.id, req = f.required ? ' <span class="req">*</span>' : '';
  const label = `<label for="${id}">${esc(f.label)}${req}</label>`;
  const help = f.help ? `<div class="help">${esc(f.help)}</div>` : '';
  const why = '<div class="why"></div>';
  let input = '';
  switch (f.type) {
    case 'text': input = `<input type="text" id="${id}" maxlength="300" autocomplete="off">`; break;
    case 'longtext': input = `<textarea id="${id}" maxlength="4000"></textarea>`; break;
    case 'number': input = `<input type="number" id="${id}" inputmode="decimal">`; break;
    case 'date': input = `<input type="date" id="${id}">`; break;
    case 'phone': input = `<input type="tel" id="${id}" inputmode="tel" autocomplete="tel">`; break;
    case 'email': input = `<input type="email" id="${id}" inputmode="email" autocomplete="email">`; break;
    case 'dropdown': input = `<select id="${id}"><option value="">Choose…</option>${f.options.map(o => `<option>${esc(o)}</option>`).join('')}</select>`; break;
    case 'yesno': return `<div class="q" id="q_${f.id}" data-type="yesno"><div class="lbl">${esc(f.label)}${req}</div>${help}<div class="seg" id="${id}"><button type="button" data-v="yes">Yes</button><button type="button" data-v="no">No</button></div>${why}</div>`;
    case 'address': return `<div class="q" id="q_${f.id}" data-type="address"><div class="lbl">${esc(f.label)}${req}</div>${help}<div class="addr" id="${id}"><input type="text" placeholder="Street address" data-a="line1" autocomplete="address-line1"><input type="text" placeholder="Address line 2 (optional)" data-a="line2" autocomplete="address-line2"><input type="text" placeholder="Town or city" data-a="city" autocomplete="address-level2"><input type="text" placeholder="Postcode" data-a="postcode" autocomplete="postal-code" style="text-transform:uppercase"></div>${why}</div>`;
    case 'file': return `<div class="q" id="q_${f.id}" data-type="file"><div class="lbl">${esc(f.label)}${req}</div>${help}<div class="filebox" id="${id}"><div class="name" id="fn_${f.id}">No file chosen</div><label class="smallbtn" style="display:inline-block;margin-top:8px">Choose a file or take a photo<input type="file" accept="image/*,application/pdf" id="fi_${f.id}" style="display:none"></label> <button type="button" class="smallbtn" id="fr_${f.id}" hidden>Remove</button></div><div class="help" style="margin-top:6px">A PDF or a photo, under 3 MB.</div>${why}</div>`;
  }
  return `<div class="q" id="q_${f.id}" data-type="${f.type}">${label}${help}${input}${why}</div>`;
}
function agreementHtml(a) {
  return `<div class="agree" id="ag_${a.id}"><input type="checkbox" id="ab_${a.id}"><label for="ab_${a.id}">${esc(a.text)}${a.kind === 'required' ? ' <span style="color:var(--wine)">*</span>' : ' <span style="color:var(--slate);font-size:13px">(optional)</span>'}</label></div>`;
}
function buildForm() {
  const F = info.form, both = F.contact_mode === 'both';
  const pay = F.payment;
  document.title = info.campaign.name + (info.org.name ? ' — ' + info.org.name : '');
  $('app').innerHTML = `<div class="shell">
    ${header()}
    <div class="body">
      ${F.intro ? `<div class="card"><p class="intro">${esc(F.intro)}</p></div>` : ''}
      <div class="card"><h2>Your details</h2>
        <div class="q" id="q_name"><label for="f_name">Your name <span class="req">*</span></label><input type="text" id="f_name" maxlength="80" autocomplete="name"><div class="why"></div></div>
        <div class="q" id="q_phone"><label for="f_phone">Mobile number${both ? ' <span class="req">*</span>' : ''}</label><input type="tel" id="f_phone" inputmode="tel" autocomplete="tel"><div class="why"></div></div>
        <div class="q" id="q_email"><label for="f_email">Email address${both ? ' <span class="req">*</span>' : ''}</label><input type="email" id="f_email" inputmode="email" autocomplete="email"><div class="help" style="margin-top:6px">${both ? '' : 'Give a mobile number or an email — either one. '}You use it to find your registration again.</div><div class="why"></div></div>
      </div>
      ${F.fields.length ? `<div class="card"><h2>Questions</h2>${F.fields.map(fieldHtml).join('')}</div>` : ''}
      ${F.agreements.length ? `<div class="card"><h2>Agreements</h2>${F.agreements.map(agreementHtml).join('')}</div>` : ''}
      ${pay ? `<div class="card"><h2>${esc(pay.label || 'Your contribution')}</h2>
        <div class="q" id="q_amount"><div class="amt"><span>£</span><input type="number" id="f_amount" inputmode="decimal" step="0.01" min="${pay.min}" max="${pay.max}" value="${pay.min}"></div>
        <div class="help" style="margin-top:6px">The minimum is ${money(pay.min)}; you may give more (up to ${money(pay.max)}). You pay on the next page, by card.</div><div class="why"></div></div></div>` : ''}
      <div class="trap" aria-hidden="true"><label>Leave this empty<input type="text" id="f_website" tabindex="-1" autocomplete="off"></label></div>
      ${info.form.approval ? '<div class="gold">Your application is checked by the parish before it is accepted — you will see its status on your registration page.</div>' : ''}
      <p class="fine">${privacyLine()}${info.places_left != null ? ` · ${info.places_left} place${info.places_left === 1 ? '' : 's'} left` : ''}</p>
    </div>
    <div class="bar"><div class="in"><div id="barErr"></div><button type="button" class="go" id="goBtn">${pay ? 'Submit and pay' : 'Submit registration'}</button></div></div>
  </div>${sheets()}`;
  wireSheets();
  document.querySelectorAll('.seg[id^=f_] button').forEach(b => { b.onclick = () => { const seg = b.parentNode; seg.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); seg.dataset.v = b.dataset.v; clearBad(seg.closest('.q')); }; });
  F.fields.filter(f => f.type === 'file').forEach(f => wireFile(f));
  document.querySelectorAll('.q input, .q textarea, .q select').forEach(el => { el.addEventListener('input', () => clearBad(el.closest('.q'))); });
  document.querySelectorAll('.agree input').forEach(el => { el.addEventListener('change', () => el.closest('.agree').classList.remove('bad')); });
  $('goBtn').onclick = submit;
}
function clearBad(q) { if (q) q.classList.remove('bad'); }
function mark(q, text) { q.classList.add('bad'); const w = q.querySelector('.why'); if (w) w.textContent = text; }

// ---- files: photos are shrunk before sending; PDFs go as they are
function wireFile(f) {
  const input = $('fi_' + f.id), name = $('fn_' + f.id), rm = $('fr_' + f.id);
  rm.onclick = () => { delete files[f.id]; name.textContent = 'No file chosen'; rm.hidden = true; input.value = ''; };
  input.onchange = async () => {
    const file = input.files && input.files[0]; if (!file) return;
    try {
      const out = await prepareFile(file);
      files[f.id] = out; name.textContent = out.filename + ' (' + Math.max(1, Math.round(out.bytes / 1024)) + ' KB)'; rm.hidden = false; clearBad($('q_' + f.id));
    } catch (e) { mark($('q_' + f.id), e.message); input.value = ''; }
  };
}
function readAsDataURL(file) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(new Error('Could not read that file.')); r.readAsDataURL(file); }); }
async function prepareFile(file) {
  if (file.type === 'application/pdf') {
    if (file.size > 3 * 1024 * 1024) throw new Error('That PDF is over 3 MB.');
    const url = await readAsDataURL(file);
    return { filename: file.name, mime: 'application/pdf', data: url.split(',')[1], bytes: file.size };
  }
  if (!/^image\//.test(file.type)) throw new Error('Please choose a PDF or a photo.');
  const url = await readAsDataURL(file);
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('That photo could not be opened.')); i.src = url; });
  const scale = Math.min(1, 1600 / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  const jpeg = c.toDataURL('image/jpeg', 0.82);
  const bytes = Math.round((jpeg.length - 23) * 3 / 4);
  if (bytes > 3 * 1024 * 1024) throw new Error('That photo is too large.');
  return { filename: file.name.replace(/\.[^.]+$/, '') + '.jpg', mime: 'image/jpeg', data: jpeg.split(',')[1], bytes };
}

// ---- checking and sending
function val(id) { const e = $(id); return e ? e.value.trim() : ''; }
function collect() {
  const answers = {};
  for (const f of info.form.fields) {
    const id = 'f_' + f.id;
    if (f.type === 'yesno') answers[f.id] = $(id).dataset.v || '';
    else if (f.type === 'address') { const a = {}; $(id).querySelectorAll('input').forEach(i => { a[i.dataset.a] = i.value.trim(); }); answers[f.id] = a; }
    else if (f.type === 'file') answers[f.id] = files[f.id] ? files[f.id].filename : '';
    else answers[f.id] = val(id);
  }
  const agreements = {}; info.form.agreements.forEach(a => { agreements[a.id] = $('ab_' + a.id).checked; });
  return { answers, agreements };
}
function validate() {
  const problems = [];
  const need = (qid, text) => { problems.push([qid, text]); };
  if (!val('f_name')) need('q_name', 'Please enter your name.');
  const both = info.form.contact_mode === 'both', ph = val('f_phone'), em = val('f_email');
  if (both && !ph) need('q_phone', 'Please enter your mobile number.');
  if (both && !em) need('q_email', 'Please enter your email address.');
  if (!both && !ph && !em) need('q_email', 'Please give a mobile number or an email address.');
  if (em && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)) need('q_email', "That email address doesn't look right.");
  if (ph && ph.replace(/[^\d]/g, '').length < 10) need('q_phone', 'That mobile number looks too short.');
  const { answers, agreements } = collect();
  for (const f of info.form.fields) {
    const v = answers[f.id], empty = f.type === 'address' ? !(v.line1 || v.city || v.postcode) : !v;
    if (f.required && empty) { need('q_' + f.id, f.type === 'file' ? 'Please choose a file.' : 'Please answer this.'); continue; }
    if (empty) continue;
    if (f.type === 'address' && (!v.line1 || !v.city || !v.postcode)) need('q_' + f.id, 'Please give the street, town or city and postcode.');
    if (f.type === 'email' && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) need('q_' + f.id, "That email address doesn't look right.");
    if (f.type === 'phone' && v.replace(/[^\d]/g, '').length < 10) need('q_' + f.id, 'That number looks too short.');
    if (f.type === 'number' && !Number.isFinite(Number(v))) need('q_' + f.id, 'Please type a number.');
  }
  const pay = info.form.payment;
  if (pay) { const a = Number(val('f_amount')); if (!Number.isFinite(a) || a < pay.min || a > pay.max) need('q_amount', `Please enter an amount from ${money(pay.min)} to ${money(pay.max)}.`); }
  const badAg = info.form.agreements.filter(a => a.kind === 'required' && !agreements[a.id]);
  badAg.forEach(a => problems.push(['ag_' + a.id, null]));
  return problems;
}
async function submit() {
  if (busy) return;
  if (info.preview) { $('barErr').innerHTML = '<div class="err">This is a preview — nothing can be submitted.</div>'; return; }
  document.querySelectorAll('.q.bad, .agree.bad').forEach(q => q.classList.remove('bad'));
  $('barErr').innerHTML = '';
  const problems = validate();
  if (problems.length) {
    problems.forEach(([qid, text]) => { const el = $(qid); if (!el) return; if (qid.startsWith('ag_')) el.classList.add('bad'); else mark(el, text); });
    const first = $(problems[0][0]); if (first) first.scrollIntoView({ block: 'center' });
    $('barErr').innerHTML = `<div class="err">Please complete the ${problems.length === 1 ? 'question' : problems.length + ' questions'} marked in red.</div>`;
    return;
  }
  const { answers, agreements } = collect();
  const sig = JSON.stringify([val('f_name'), val('f_phone'), val('f_email'), answers, agreements, val('f_amount')]);
  if (!attempt || attempt.sig !== sig) attempt = { sig, ref: newClientRef() };
  busy = true; $('goBtn').disabled = true; $('goBtn').textContent = 'Sending…';
  try {
    const body = { campaign_id: campaignId, name: val('f_name'), phone: val('f_phone'), email: val('f_email'), answers, agreements, client_ref: attempt.ref, website: val('f_website') };
    const fl = {}; for (const f of info.form.fields) if (f.type === 'file' && files[f.id]) fl[f.id] = { filename: files[f.id].filename, mime: files[f.id].mime, data: files[f.id].data };
    if (Object.keys(fl).length) body.files = fl;
    if (info.form.payment) body.amount = Number(val('f_amount'));
    const r = await call('public_register', body);
    if (r.pay_url) { $('veil').classList.add('on'); location.href = r.pay_url; return; }
    if (!r.registration_id) { $('app').innerHTML = `<div class="fatal"><div class="card"><div class="ok"><b>✓ Thank you — your registration has been received.</b></div></div></div>`; return; }   // (only a spam-trap answer comes back without an id)
    location.href = '/registration.html?id=' + encodeURIComponent(r.registration_id) + '&new=1';
  } catch (e) {
    busy = false; $('goBtn').disabled = false; $('goBtn').textContent = info.form.payment ? 'Submit and pay' : 'Submit registration';
    if (!e.network) attempt = null;
    $('barErr').innerHTML = `<div class="err">${esc(e.message)}${e.network ? ' Nothing is lost — tap again to retry; you will not register twice.' : ''}</div>`;
  }
}

async function boot() {
  const app = $('app');
  if (!campaignId) { app.innerHTML = '<div class="fatal"><div class="card"><div class="err">This link is missing its form — ask the parish for the right link.</div></div></div>'; return; }
  try {
    const early = window.__infoP ? await window.__infoP : null;
    if (early && early.ok) info = early.d;
    else if (early) throw new Error(early.d.error || 'Something went wrong');
    else info = await call('public_registration_info', { campaign_id: campaignId, preview: previewToken });
  } catch (e) { app.innerHTML = `<div class="fatal"><div class="card"><div class="err">${esc(e.message)}</div></div></div>`; return; }
  document.title = info.campaign.name;
  if (info.state === 'not_open' || info.state === 'closed') {
    app.innerHTML = statusPage(`<p class="note" style="font-size:18px;margin-top:14px"><b>${info.state === 'not_open' ? 'Opens on ' + esc(dayText(info.opens_on)) : 'Closed on ' + esc(dayText(info.closes_on))}.</b></p>${info.state === 'closed' ? '<p class="note">Thank you to everyone who took part.</p>' : ''}`);
    wireSheets(); $('findBtn').onclick = findRegistration; return;
  }
  if (!info.preview && info.queue_open) {
    app.innerHTML = statusPage(`<p class="note" style="font-size:18px;margin-top:14px"><b>All places are taken.</b></p>
      <p class="note">Join the waiting list and we'll email you if places open up. Nothing to pay. When places open, we send one email to everyone on the list, and places go to whoever registers first. We keep your email only until then.</p>
      <div id="wlForm"><input id="wlEmail" type="email" placeholder="Your email" autocomplete="email" inputmode="email" style="width:100%;padding:11px 12px;font-size:16.5px;border:1.5px solid var(--line);border-radius:12px"><button type="button" class="shuf" id="wlBtn" style="margin-top:10px">🔔 Join the waiting list</button></div><div id="wlOut" role="status" aria-live="polite"></div>`);
    wireSheets(); $('wlBtn').onclick = joinWaitingList; $('wlEmail').onkeydown = (e) => { if (e.key === 'Enter') joinWaitingList(); }; $('findBtn').onclick = findRegistration; return;
  }
  if (!info.preview && info.sold_out) {
    app.innerHTML = statusPage('<p class="note" style="font-size:18px;margin-top:14px"><b>This is fully booked.</b></p><p class="note">Thank you for your interest.</p>');
    wireSheets(); $('findBtn').onclick = findRegistration; return;
  }
  buildForm();
}
boot();
</script>
