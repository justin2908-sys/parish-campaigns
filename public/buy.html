<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2E4739">
<title>Buy tickets</title>
<link rel="stylesheet" href="/theme.css">
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { scroll-behavior:smooth; }
  html, body { height:100%; }
  body { margin:0; }
  button { font-family:inherit; cursor:pointer; }
  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

  /* ---- one-screen shell: nothing scrolls except the number list when it is long ---- */
  .shell { height:100vh; height:100dvh; display:flex; flex-direction:column; }
  @media (max-height:470px) { .shell { height:auto; min-height:100dvh; } }   /* landscape / very short: allow normal scrolling */
  .top { position:relative; flex:none; color:#F3F1E7; padding:9px 14px 10px;
    background:radial-gradient(120% 140% at 15% 0%, #4F7A62 0%, transparent 55%), radial-gradient(90% 120% at 100% 100%, rgba(169,130,47,.5) 0%, transparent 60%), linear-gradient(160deg,var(--pine),var(--pine-deep)); }
  .top .row { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:1px; }
  .top .titles { min-width:0; }
  .top .church { font-family:var(--font-caps); font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--brass-bright); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .top h1 { margin:0; font-size:24px; line-height:1.1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-shadow:0 2px 10px rgba(0,0,0,.25); }
  .detailsBtn { flex:none; background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.32); color:#F3F1E7; border-radius:20px; padding:6px 12px; font-size:14px; font-weight:600; }
  .thanks { margin:5px 0 0; font-size:12.5px; line-height:1.3; }
  .body { flex:1 1 auto; width:100%; max-width:480px; margin:0 auto; padding:8px 12px 6px; display:flex; flex-direction:column; gap:6px; }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:10px; box-shadow:0 1px 0 rgba(0,0,0,.02), 0 8px 24px -14px rgba(34,53,42,.35); }
  .card.tickets { flex:1 1 auto; display:flex; flex-direction:column; }
  .mid { flex:1 1 0; min-height:64px; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  .mid.picking { min-height:150px; }
  .fine { flex:none; margin:0; padding:0 6px; text-align:center; color:var(--slate); font-size:12.5px; line-height:1.35; }
  .fine b { color:var(--pine); font-weight:600; }
  .fine .linkbtn { display:block; margin:1px auto 0; padding:4px 8px; }
  .sheetbox { position:fixed; left:0; right:0; bottom:0; z-index:25; max-width:520px; margin:0 auto; max-height:82vh; max-height:82dvh; overflow-y:auto; background:var(--surface); border-radius:20px 20px 0 0; padding:18px 16px calc(18px + env(safe-area-inset-bottom)); box-shadow:0 -14px 40px rgba(0,0,0,.4); }
  .sheetbox h2 { margin:0 28px 10px 0; font-family:var(--font-caps); font-weight:400; font-size:15px; letter-spacing:.16em; color:var(--brass-strong); text-transform:uppercase; }
  .sheetbox .close { position:absolute; top:10px; right:12px; width:36px; height:36px; border:none; background:var(--pine-dim); color:var(--pine); border-radius:50%; font-size:16px; font-weight:700; }
  .dtext { white-space:pre-wrap; font-size:16px; line-height:1.55; color:var(--ink); }
  .daddr { margin-top:12px; font-size:14px; color:var(--slate); }

  /* ---- quantity ---- */
  .qty-row { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:5px; }
  .qty-label { font-family:var(--font-head); font-size:20px; font-weight:500; line-height:1.15; }
  .qty-label small { display:block; font-family:var(--font-body); font-weight:500; color:var(--slate); font-size:14px; }
  .stepper { display:flex; align-items:center; background:var(--pine-dim); border-radius:14px; overflow:hidden; border:1px solid var(--stone); }
  .stepper button { width:50px; height:44px; border:none; background:none; color:var(--pine); font-size:27px; font-weight:600; line-height:1; }
  .stepper button:active { background:var(--stone); }
  .stepper input { width:54px; height:44px; text-align:center; border:none; background:#fff; font-family:var(--font-head); font-size:23px; font-weight:600; color:var(--ink); padding:0; -moz-appearance:textfield; }
  .stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }
  .bundleHead { margin:8px 0 8px; font-size:15px; font-weight:700; color:var(--pine); }
  .bundles { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px; }
  .bundle { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; padding:9px 2px 8px; border-radius:14px; border:1.5px solid #CDB673; background:linear-gradient(180deg,#FBFBF8,#F0E7CC); color:var(--pine); box-shadow:0 3px 0 #B8913A; }
  .bundle:active { transform:translateY(2px); box-shadow:0 1px 0 #B8913A; }
  .bundle b { font-family:var(--font-head); font-size:27px; font-weight:600; line-height:1.05; }
  .bundle span { font-size:13px; font-weight:600; color:var(--slate); }
  .bundle em { font-style:normal; font-size:14px; font-weight:800; color:var(--wine); margin-top:2px; }

  /* ---- mode ---- */
  .seg { display:flex; background:var(--pine-dim); border-radius:14px; padding:3px; margin:0 0 6px; }
  .seg button { flex:1; border:none; background:none; padding:9px 4px; border-radius:11px; font-size:15px; font-weight:700; color:var(--slate); transition:all .2s; white-space:nowrap; }
  .seg button.on { background:#fff; color:var(--wine); box-shadow:0 2px 8px rgba(0,0,0,.1); }
  .note { margin:0; font-size:15px; color:var(--slate); line-height:1.45; }
  select { width:100%; padding:10px 12px; font-size:16px; border:1px solid var(--stone); border-radius:12px; background:#fff; color:var(--ink); margin-top:8px; }

  /* ---- ticket chips ---- */
  .slots { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:6px; margin-bottom:8px; }
  .tk { position:relative; display:flex; align-items:center; justify-content:center; gap:4px; min-height:42px; padding:4px 50px 4px 11px; border-radius:10px; font-variant-numeric:tabular-nums; font-weight:600; font-size:18.5px; letter-spacing:.02em;
    background:linear-gradient(180deg,#FBFBF8,#F0E7CC); border:1.5px solid #CDB673; color:var(--pine); font-family:var(--font-head);
    -webkit-mask:radial-gradient(circle 6px at 0 50%,transparent 98%,#000) left/51% 100% no-repeat, radial-gradient(circle 6px at 100% 50%,transparent 98%,#000) right/51% 100% no-repeat;
            mask:radial-gradient(circle 6px at 0 50%,transparent 98%,#000) left/51% 100% no-repeat, radial-gradient(circle 6px at 100% 50%,transparent 98%,#000) right/51% 100% no-repeat; }
  .tk.empty { background:var(--surface); border:1.5px dashed var(--stone); color:var(--stone); padding:6px 10px; font-weight:700; }
  .tk.taken { background:var(--bad-dim); border-color:var(--bad); color:var(--bad); text-decoration:line-through; }
  .tk.rolling { color:var(--brass); animation:shake .18s linear infinite; }
  .tk.pop { animation:pop .45s cubic-bezier(.2,1.6,.4,1); }
  .tk { justify-content:flex-start; }
  .tk .mini { position:absolute; top:50%; transform:translateY(-50%); width:26px; height:30px; border:none; background:none; font-size:17px; font-weight:700; line-height:1; color:var(--brass); padding:0; }
  .tk .mini.re { right:26px; } .tk .mini.rm { right:1px; font-size:14px; }
  .tk .mini:active { color:var(--wine); }
  @keyframes pop { 0% { transform:scale(.4) rotate(-6deg); opacity:0; } 100% { transform:scale(1) rotate(0); opacity:1; } }
  @keyframes shake { 0% { transform:translateY(-1px); } 50% { transform:translateY(1px); } 100% { transform:translateY(-1px); } }
  .btnrow { display:flex; gap:8px; }
  .shuf { flex:1; border:none; padding:11px 8px; border-radius:13px; font-size:16.5px; font-weight:800; color:var(--ink); background:linear-gradient(180deg,#DDBA66,#B8913A); box-shadow:0 4px 0 #8B6A22; }
  .shuf:active { transform:translateY(2px); box-shadow:0 2px 0 #8B6A22; }
  .shuf.alt { flex:0 0 auto; background:#fff; color:var(--wine); box-shadow:none; border:1.5px solid var(--line); }
  .dice { display:inline-block; }
  .busy .dice { animation:spin .6s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .lucky { display:flex; gap:8px; margin-top:9px; }
  .lucky input { flex:1; min-width:0; padding:11px 12px; font-size:16.5px; border:1.5px solid var(--line); border-radius:12px; letter-spacing:.06em; background:#fff; color:var(--ink); }
  .lucky button { padding:0 18px; border:none; border-radius:12px; background:var(--wine); color:#fff; font-size:15px; font-weight:700; }
  .range { margin-bottom:8px; padding:7px 10px; border-radius:10px; background:var(--gold-dim); border:1px solid #DCCB98; font-size:13px; line-height:1.35; color:var(--slate); }
  .msg { margin-top:6px; font-size:13.5px; }
  .msg:empty { display:none; }
  .msg.bad { color:var(--bad); } .msg.good { color:var(--good); }

  /* ---- contact ---- */
  .two { display:flex; gap:8px; }
  .two input { flex:1; min-width:0; padding:10px 12px; font-size:16.5px; border:1.5px solid var(--line); border-radius:12px; background:#fff; color:var(--ink); }
  .two input:focus, .lucky input:focus, select:focus { outline:none; border-color:var(--wine2); box-shadow:0 0 0 3px #a8432f22; }
  .tiny { text-align:center; color:var(--muted); font-size:14px; line-height:1.5; margin:4px 8px 16px; }

  /* ---- pay bar: fixed to the bottom of the screen ---- */
  .paybar { flex:none; padding:7px 12px calc(7px + env(safe-area-inset-bottom)); background:var(--surface); border-top:1px solid var(--line); box-shadow:0 -8px 24px -14px rgba(0,0,0,.3); }
  .paybar .in { max-width:480px; margin:0 auto; }
  .sum { display:flex; justify-content:space-between; align-items:baseline; font-size:14px; color:var(--muted); margin-bottom:4px; }
  .sum b { font-family:var(--font-head); font-weight:500; font-size:24px; color:var(--ink); }
  .pay { width:100%; padding:12px; border:none; border-radius:14px; font-size:18px; font-weight:800; color:#fff; letter-spacing:.01em; background:linear-gradient(180deg,#3E5E4C,#2E4739); box-shadow:0 4px 0 #1A2A20; }
  .pay:active { transform:translateY(2px); box-shadow:0 2px 0 #1A2A20; }
  .pay.wait { background:#A9AE9F; box-shadow:0 4px 0 #8B9082; color:#fff; }
  .pay:disabled { opacity:.75; }
  .err { background:var(--bad-dim); color:var(--bad); padding:10px 12px; border-radius:12px; font-size:13.5px; margin-top:8px; }

  /* ---- overlay & confetti ---- */
  .veil { position:fixed; inset:0; z-index:30; display:none; align-items:center; justify-content:center; flex-direction:column; gap:12px; background:rgba(34,53,42,.94); color:#fff; font-size:18px; font-weight:700; text-align:center; padding:24px; }
  .veil.on { display:flex; }
  .veil .big { font-size:54px; animation:spin 1.2s linear infinite; }
  .bit { position:fixed; z-index:40; pointer-events:none; font-size:16px; animation:fly .9s ease-out forwards; }
  @keyframes fly { from { transform:translate(0,0) scale(1); opacity:1; } to { transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(.6); opacity:0; } }
  .linkbtn { background:none; border:none; color:var(--wine); text-decoration:underline; text-underline-offset:3px; font-size:13.5px; font-weight:600; padding:6px; }
  .found { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:12px; margin-top:8px; border-radius:12px; background:var(--gold-dim); border:1px solid #DCCB98; color:var(--ink); text-decoration:none; font-size:15px; }
  .found span { color:var(--muted); font-size:12.5px; white-space:nowrap; }
  @media (max-height:700px) { .mid.picking { min-height:120px; } .bundleHead { margin:8px 0 6px; } .bundle { padding:7px 2px 6px; } .bundle b { font-size:23px; } }
  @media (max-height:600px) { .top .church { display:none; } .top h1 { font-size:21px; } .seg button { padding:7px 4px; } .fine { font-size:11.5px; } .thanks { font-size:12px; } .card { padding:8px; } .mid.picking { min-height:100px; } }
  .fatal { max-width:480px; margin:40px auto; padding:0 16px; }
  @media (prefers-reduced-motion:reduce) { *, *::before, *::after { animation:none !important; transition:none !important; } .bit { display:none; } }
</style>
</head>
<body>
<div id="app"><div class="fatal"><div class="card"><p class="note">Loading…</p></div></div></div>
<div class="veil" id="veil"><div class="big">🎟️</div><div>Taking you to SumUp's secure payment page…</div><div style="font-size:13px;font-weight:500;opacity:.85;max-width:300px">Your numbers are held for you while you pay. <b>After paying, tap the button on SumUp's page to come back and save your ticket.</b></div></div>

<script>
const $ = (id) => document.getElementById(id);
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
// No reply within 25s gives up with a plain message instead of hanging on a weak signal.
// err.network = we don't know whether the server received it (vs. a real answer from it).
async function call(action, body) {
  const ctl = new AbortController(); const timer = setTimeout(() => ctl.abort(), 25000);
  let res, data;
  try {
    res = await fetch('/api/' + action, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body || {}), signal: ctl.signal });
    data = await res.json().catch(() => ({}));
  } catch (e) {
    const err = new Error(e && e.name === 'AbortError' ? 'No reply from the server — the signal may be weak.' : "Can't reach the server — check your signal.");
    err.network = true; throw err;
  } finally { clearTimeout(timer); }
  if (!res.ok) throw new Error(data.error || 'Something went wrong');
  return data;
}
const sleep = (ms) => new Promise(r => setTimeout(r, ms));
const REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const campaignId = new URLSearchParams(location.search).get('campaign_id');
function newClientRef() { return (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 12); }

let info = null, counts = {}, mode = 'auto', blockId = null;
let slots = [];            // one entry per ticket wanted: a number, or null for an empty slot
let rolling = new Set(), rollText = {}, popping = new Set(), taken = new Set();
let shuffling = false, busy = false, attempt = null, detailsOpen = false;

const MAX_QTY = 20; // matches the server's per-purchase cap

function totalQty() { return info.tiers.reduce((s, t) => s + (counts[t.id] || 0), 0); }
function totalPrice() { return info.tiers.reduce((s, t) => s + (counts[t.id] || 0) * Number(t.price), 0); }
function money(n) { return '£' + Number(n).toFixed(2); }
function digitBounds() {
  return { min: Math.min(...info.blocks.map(b => String(b.range_start).length)), max: Math.max(...info.blocks.map(b => String(b.range_end).length)) };
}
function fmt(n) { const b = info.blocks.find(b => n >= b.range_start && n <= b.range_end); return ((b && b.number_prefix) || '') + n; }
// Which numbers exist online, in plain words — so nobody wastes time hunting for a number that
// isn't part of the online series. Several series read "A to B, or C to D".
function sortedBlocks() { return info.blocks.slice().sort((a, b) => a.range_start - b.range_start); }
function rangeWords() { return sortedBlocks().map(b => `${b.number_prefix || ''}${b.range_start} to ${b.number_prefix || ''}${b.range_end}`).join(', or '); }
function rangeShort() { return sortedBlocks().map(b => `${b.number_prefix || ''}${b.range_start}–${b.range_end}`).join(' / '); }
function inOnlineRange(n) { return info.blocks.some(b => n >= b.range_start && n <= b.range_end); }

async function boot() {
  const app = $('app');
  if (!campaignId) { app.innerHTML = `<div class="fatal"><div class="card"><div class="err">This link is missing its campaign reference.</div></div></div>`; return; }
  try {
    info = await call('public_campaign_info', { campaign_id: campaignId });
  } catch (e) { app.innerHTML = `<div class="fatal"><div class="card"><div class="err">${esc(e.message)}</div></div></div>`; return; }
  counts = Object.fromEntries(info.tiers.map(t => [t.id, 0]));
  blockId = info.blocks[0].id;
  buildShell();
  syncSlots(); renderQty(); renderMode(); renderPay();
}

// The church's saved thank-you (says where the money goes); a plain one by name if it's ever blank.
function thankYouText() { return info.org.thank_you || (info.org.name ? 'Thank you for supporting ' + info.org.name + '.' : 'Thank you for your support!'); }
function buildShell() {
  const thank = thankYouText();
  const sparks = ['✨','🎟️','⭐','🎁','✨'].map((s, i) => `<span class="spark" style="left:${8 + i * 21}%;top:${14 + (i % 2) * 42}%;animation-delay:${i * .8}s">${s}</span>`).join('');
  const from = Math.min(...info.tiers.map(t => Number(t.price)));
  document.title = info.campaign.name + (info.org.name ? ' — ' + info.org.name : '');
  $('app').innerHTML = `
    <div class="shell">
      <header class="top">
        ${info.org.name ? `<div class="church">${esc(info.org.name)}</div>` : ''}
        <div class="row">
          <h1>${esc(info.campaign.name)}</h1>
          ${info.campaign.details_text ? `<button class="detailsBtn" id="detailsBtn" type="button">🎁 Prizes</button>` : ''}
        </div>
        <p class="thanks">💛 ${esc(thank)}</p>
      </header>
      <div class="body">
        <div class="card tickets">
          <div id="qtyArea"></div>
          <div class="seg" id="seg" role="tablist">
            <button type="button" data-mode="auto" role="tab">✨ Assign for me</button>
            <button type="button" data-mode="pick" role="tab">🎲 Pick my numbers</button>
          </div>
          <div class="mid">
            <div id="autoPane"><p class="note" id="autoNote"></p><div id="bundles"></div></div>
            <div id="pickPane" hidden>
              <div class="range">🎟️ Online numbers run from <b>${esc(rangeWords())}</b>. Others aren't part of this draw.</div>
              <div class="slots" id="slots" aria-live="polite"></div>
              <div class="btnrow">
                <button type="button" class="shuf" id="shuffleBtn"><span class="dice">🎲</span> <span id="shuffleLabel">Shuffle</span></button>
                <button type="button" class="shuf alt" id="shuffleAllBtn" title="Replace every number with new random ones">↻ All</button>
              </div>
              <div class="lucky">
                <label class="sr" for="luckyIn">A lucky number</label>
                <input id="luckyIn" inputmode="numeric" autocomplete="off" placeholder="${info.blocks.length === 1 ? `Or type your own (${esc(rangeShort())})` : 'Or type a lucky number'}">
                <button type="button" id="luckyAdd">Add</button>
              </div>
            </div>
            ${info.blocks.length > 1 ? `<label class="sr" for="seriesSel">Which series</label><select id="seriesSel">${info.blocks.map(b => `<option value="${b.id}">${esc(b.label)} (${esc(b.number_prefix||'')}${b.range_start}–${esc(b.number_prefix||'')}${b.range_end})</option>`).join('')}</select>` : ''}
            <div class="msg" id="msg" role="status"></div>
          </div>
        </div>
        <div class="card who">
          <div class="two">
            <label class="sr" for="buyerName">Your name</label><input id="buyerName" placeholder="Your name" autocomplete="name">
            <label class="sr" for="contactInput">Mobile or email</label><input id="contactInput" placeholder="Mobile or email" autocomplete="email" inputmode="email">
          </div>
        </div>
        <p class="fine">🔒 Secure payment by SumUp · link valid 30 minutes. <b>After paying, tap the button on SumUp's page to come back and save your ticket.</b> <button type="button" class="linkbtn" id="findToggle">Already paid? Find your ticket</button></p>
      </div>
      <div class="paybar"><div class="in">
        <div class="sum"><span id="sumText">Choose your tickets</span><b id="sumPrice">£0.00</b></div>
        <button type="button" class="pay wait" id="payBtn">Choose your tickets</button>
        <div id="payErr"></div>
      </div></div>
    </div>
    ${info.campaign.details_text ? `<div class="sheetbox" id="details" hidden><button type="button" class="close" id="detailsClose" aria-label="Close">✕</button><h2>Prizes &amp; details</h2><div class="dtext">${esc(info.campaign.details_text)}</div>${info.org.address ? `<div class="daddr">${esc(info.org.name)} · ${esc(info.org.address)}</div>` : ''}</div>` : ''}
    <div class="sheetbox" id="findCard" hidden>
      <button type="button" class="close" id="findClose" aria-label="Close">✕</button>
      <h2>Find your ticket</h2>
      <p class="note" style="margin:0 0 10px">Type your name and mobile or email exactly as you did when you bought.</p>
      <div class="two">
        <label class="sr" for="fName">Your name</label><input id="fName" placeholder="Your name" autocomplete="name">
        <label class="sr" for="fContact">Mobile or email</label><input id="fContact" placeholder="Mobile or email" autocomplete="email" inputmode="email">
      </div>
      <button type="button" class="shuf" id="findBtn" style="width:100%;margin-top:10px">🔎 Find my ticket</button>
      <div id="findOut" role="status" aria-live="polite"></div>
    </div>`;

  if ($('detailsBtn')) { $('detailsBtn').onclick = () => { $('details').hidden = false; }; $('detailsClose').onclick = () => { $('details').hidden = true; }; }
  $('seg').onclick = (e) => { const b = e.target.closest('button'); if (b) setMode(b.dataset.mode); };
  $('slots').onclick = onSlotClick;
  $('bundles').onclick = (e) => { const b = e.target.closest('button[data-set]'); if (b) setCount(info.tiers[0].id, b.dataset.set); };
  $('shuffleBtn').onclick = () => shuffle(false);
  $('shuffleAllBtn').onclick = () => shuffle(true);
  $('luckyAdd').onclick = addLucky;
  $('luckyIn').onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); addLucky(); } };
  $('luckyIn').oninput = (e) => { e.target.value = e.target.value.replace(/\D/g, '').slice(0, digitBounds().max); };
  if ($('seriesSel')) $('seriesSel').onchange = (e) => { blockId = e.target.value; if (mode === 'pick') { slots = slots.map(() => null); taken.clear(); renderSlots(); } renderMode(); renderPay(); };
  $('payBtn').onclick = pay;
  $('findToggle').onclick = () => { // carry over what they've already typed, then open the sheet
    if (!$('fName').value) $('fName').value = $('buyerName').value; if (!$('fContact').value) $('fContact').value = $('contactInput').value;
    $('findCard').hidden = false;
  };
  $('findClose').onclick = () => { $('findCard').hidden = true; };
  $('findBtn').onclick = findTicket;
  $('buyerName').oninput = renderPay; $('contactInput').oninput = renderPay;
}

/* ---------- quantity ---------- */
function setCount(tierId, v) {
  counts[tierId] = Math.max(0, Math.min(MAX_QTY, Number(v) || 0));
  // never let the total exceed the per-purchase cap
  let over = totalQty() - MAX_QTY; if (over > 0) counts[tierId] -= over;
  syncSlots(); renderQty(); renderMode(); renderPay();
}
function renderQty() {
  $('qtyArea').innerHTML = info.tiers.map(t => `
    <div class="qty-row"><div class="qty-label">${esc(t.name)}<small>${money(t.price)} each</small></div>
      <div class="stepper"><button type="button" data-t="${t.id}" data-d="-1" aria-label="One fewer ${esc(t.name)}">−</button>
        <input type="number" min="0" max="${MAX_QTY}" inputmode="numeric" id="q-${t.id}" data-t="${t.id}" aria-label="Number of ${esc(t.name)}" value="${counts[t.id] || 0}">
        <button type="button" data-t="${t.id}" data-d="1" aria-label="One more ${esc(t.name)}">+</button></div></div>`).join('');
  $('qtyArea').onclick = (e) => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.set) setCount(b.dataset.t, b.dataset.set);
    else if (b.dataset.d) setCount(b.dataset.t, (counts[b.dataset.t] || 0) + Number(b.dataset.d));
  };
  $('qtyArea').onchange = (e) => { if (e.target.dataset.t && !e.target.dataset.d) setCount(e.target.dataset.t, e.target.value); };
}

/* ---------- mode & basket ---------- */
function setMode(m) { mode = m; msg(''); renderMode(); renderPay(); }
function syncSlots() {
  const n = totalQty();
  if (slots.length > n) slots.length = n;
  while (slots.length < n) slots.push(null);
  renderSlots();
}
function renderMode() {
  const n = totalQty();
  for (const b of $('seg').children) b.classList.toggle('on', b.dataset.mode === mode);
  $('autoPane').hidden = mode !== 'auto';
  $('pickPane').hidden = mode !== 'pick';
  const midEl = document.querySelector('.mid'); if (midEl) midEl.classList.toggle('picking', mode === 'pick');
  $('autoNote').innerHTML = n
    ? `We'll pick <b>${n} number${n > 1 ? 's' : ''}</b> for you from the online series (${esc(rangeWords())}) the moment you pay. Prefer to choose? Tap <b>Pick my numbers</b>.`
    : `Choose how many tickets, and we'll pick the numbers for you — or choose your own.`;
  // Nothing chosen yet: offer one-tap bundles to fill the empty space (single-price campaigns only).
  const bd = $('bundles');
  if (bd) {
    const t = info.tiers[0];
    bd.innerHTML = (!n && info.tiers.length === 1)
      ? `<div class="bundleHead">👆 Buying several? Tap a bundle, or use − / +</div><div class="bundles">${[1, 5, 10, 20].filter(k => k <= MAX_QTY).map(k => `<button type="button" class="bundle" data-set="${k}" aria-label="Buy ${k} ticket${k > 1 ? 's' : ''} for ${money(t.price * k)}"><b>${k}</b><span>${k === 1 ? 'ticket' : 'tickets'}</span><em>${money(t.price * k)}</em></button>`).join('')}</div>`
      : '';
  }
  renderModeLabelsOnly();
}
function renderSlots() {
  if (!$('slots')) return;
  const n = slots.length;
  $('slots').style.display = n ? '' : 'none';
  $('slots').innerHTML = slots.map((v, i) => {
    if (rolling.has(i)) return `<div class="tk rolling" aria-label="Picking a number">${esc(rollText[i] || '…')}</div>`;
    if (v == null) return `<div class="tk empty" aria-label="Empty ticket ${i + 1}">?</div>`;
    const cls = ['tk', taken.has(v) ? 'taken' : '', popping.has(i) ? 'pop' : ''].join(' ');
    return `<div class="${cls}">${esc(fmt(v))}<button type="button" class="mini re" data-i="${i}" data-act="re" aria-label="Pick a different number instead of ${esc(fmt(v))}">↻</button><button type="button" class="mini rm" data-i="${i}" data-act="rm" aria-label="Remove ${esc(fmt(v))}">✕</button></div>`;
  }).join('');
  renderModeLabelsOnly();
}
function renderModeLabelsOnly() {
  const n = totalQty(); const empties = slots.filter(x => x == null).length;
  $('shuffleLabel').textContent = !n ? 'Shuffle' : empties === n ? `Shuffle ${n} random` : empties ? `Shuffle ${empties} more` : 'All picked!';
  $('shuffleAllBtn').style.display = slots.some(x => x != null) ? '' : 'none';
}
async function onSlotClick(e) {
  const b = e.target.closest('button'); if (!b) return;
  const i = Number(b.dataset.i);
  if (b.dataset.act === 'rm') { taken.delete(slots[i]); slots[i] = null; renderSlots(); renderPay(); }
  if (b.dataset.act === 're') reroll(i);
}
function heldNumbers() { return slots.filter(x => x != null); }

async function fetchRandom(count, exclude) {
  const { numbers } = await call('public_random_numbers', { campaign_id: campaignId, block_id: blockId, count, exclude });
  return numbers;
}
async function shuffle(all) {
  if (shuffling) return;
  const n = totalQty();
  if (!n) { msg('Choose how many tickets first.', 'bad'); return; }
  const targets = slots.map((v, i) => (all || v == null) ? i : -1).filter(i => i >= 0);
  if (!targets.length) return;
  shuffling = true; $('shuffleBtn').classList.add('busy'); msg('');
  const exclude = heldNumbers();
  targets.forEach(i => rolling.add(i));
  const { max } = digitBounds();
  const roller = setInterval(() => { targets.forEach(i => { rollText[i] = String(Math.floor(Math.random() * Math.pow(10, max))).padStart(max, '0'); }); renderSlots(); }, 70);
  try {
    // Show the tumble for at least a moment so it feels like a draw, even on a fast connection.
    const [numbers] = await Promise.all([fetchRandom(targets.length, exclude), sleep(REDUCED ? 0 : 650)]);
    clearInterval(roller);
    if (all) targets.forEach(i => { taken.delete(slots[i]); slots[i] = null; });
    rolling.clear(); popping.clear();
    numbers.forEach((num, k) => { slots[targets[k]] = num; popping.add(targets[k]); });
    renderSlots(); renderPay(); burst($('shuffleBtn'));
    if (numbers.length < targets.length) msg(`Only ${numbers.length} more number${numbers.length === 1 ? ' is' : 's are'} left to pick from.`, 'bad');
    setTimeout(() => { popping.clear(); }, 600);
  } catch (e) { clearInterval(roller); rolling.clear(); renderSlots(); msg(e.message, 'bad'); }
  finally { shuffling = false; $('shuffleBtn').classList.remove('busy'); }
}
async function reroll(i) {
  if (shuffling) return;
  shuffling = true; rolling.add(i); const { max } = digitBounds();
  const roller = setInterval(() => { rollText[i] = String(Math.floor(Math.random() * Math.pow(10, max))).padStart(max, '0'); renderSlots(); }, 70);
  try {
    const [numbers] = await Promise.all([fetchRandom(1, heldNumbers()), sleep(REDUCED ? 0 : 450)]);
    clearInterval(roller); rolling.clear();
    if (numbers.length) { taken.delete(slots[i]); slots[i] = numbers[0]; popping.add(i); }
    else msg('No other numbers are free right now.', 'bad');
    renderSlots(); renderPay(); setTimeout(() => popping.clear(), 600);
  } catch (e) { clearInterval(roller); rolling.clear(); renderSlots(); msg(e.message, 'bad'); }
  finally { shuffling = false; }
}
async function addLucky() {
  const inp = $('luckyIn'); const v = inp.value.trim(); const { min, max } = digitBounds();
  if (v.length < min) { msg(`Type a full ${min === max ? min : min + '–' + max}-digit number.`, 'bad'); return; }
  const num = Number(v);
  if (!inOnlineRange(num)) { msg(`${v} isn't an online number — online numbers run from ${rangeWords()}.`, 'bad'); return; }
  if (heldNumbers().includes(num)) { msg(`${fmt(num)} is already in your tickets.`, 'bad'); return; }
  let idx = slots.findIndex(x => x == null);
  if (idx < 0) {
    if (info.tiers.length === 1 && totalQty() < MAX_QTY) { setCount(info.tiers[0].id, totalQty() + 1); idx = slots.findIndex(x => x == null); }
    else { msg(totalQty() >= MAX_QTY ? `That's the most you can buy at once (${MAX_QTY}).` : 'All your tickets already have a number — remove one first, or add another ticket.', 'bad'); return; }
  }
  $('luckyAdd').disabled = true;
  try {
    const { results } = await call('public_check_tickets', { campaign_id: campaignId, ticket_numbers: [num] });
    if (!results[0].ok) { msg(nice(results[0].error) + ' — try another.', 'bad'); return; }
    slots[idx] = num; popping.add(idx); inp.value = ''; msg(`${fmt(num)} is yours ✓`, 'good');
    renderSlots(); renderPay(); burst($('luckyAdd')); setTimeout(() => popping.clear(), 600);
  } catch (e) { msg(e.message, 'bad'); }
  finally { $('luckyAdd').disabled = false; }
}
// Buyer-facing wording: show the prefixed number, and don't leak internal status words.
function nice(m) { return String(m).replace(/Ticket ([0-9]+) is already [a-z_]+/g, (_, n) => fmt(Number(n)) + ' has just been taken').replace(/Ticket ([0-9]+)/g, (_, n) => fmt(Number(n))); }
function msg(t, kind) { const m = $('msg'); if (m) { m.textContent = t || ''; m.className = 'msg ' + (kind || ''); } }

function burst(el) {
  if (REDUCED || !el) return;
  const r = el.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  for (let i = 0; i < 14; i++) {
    const s = document.createElement('span'); s.className = 'bit'; s.textContent = ['✨', '🎉', '⭐', '🎟️'][i % 4];
    s.style.left = cx + 'px'; s.style.top = cy + 'px';
    s.style.setProperty('--dx', (Math.random() * 220 - 110) + 'px'); s.style.setProperty('--dy', (-40 - Math.random() * 130) + 'px'); s.style.setProperty('--r', (Math.random() * 360 - 180) + 'deg');
    document.body.appendChild(s); setTimeout(() => s.remove(), 950);
  }
}

/* ---------- pay bar ---------- */
function nextStep() {
  const n = totalQty();
  if (!n) return { ok: false, label: 'Choose your tickets', focus: 'qtyArea' };
  if (mode === 'pick') {
    const left = slots.filter(x => x == null).length;
    if (left) return { ok: false, label: `Pick ${left} more number${left > 1 ? 's' : ''}`, focus: 'pickPane' };
    if (slots.some(v => taken.has(v))) return { ok: false, label: 'Replace the taken numbers', focus: 'slots' };
  }
  if (!$('buyerName').value.trim()) return { ok: false, label: 'Add your name', focus: 'buyerName' };
  if (!$('contactInput').value.trim()) return { ok: false, label: 'Add your mobile or email', focus: 'contactInput' };
  return { ok: true, label: `Pay ${money(totalPrice())} securely` };
}
function renderPay() {
  const n = totalQty(), s = nextStep();
  $('sumText').textContent = n ? `${n} ticket${n > 1 ? 's' : ''}${mode === 'pick' ? ' · your numbers' : ' · assigned for you'}` : 'Choose your tickets';
  $('sumPrice').textContent = money(totalPrice());
  const b = $('payBtn'); b.textContent = busy ? 'Please wait…' : s.label; b.classList.toggle('wait', !s.ok); b.disabled = busy;
  renderModeLabelsOnly();
}
async function pay() {
  if (busy) return;
  const s = nextStep(); const errEl = $('payErr'); errEl.innerHTML = '';
  if (!s.ok) { const el = $(s.focus); if (el) { el.scrollIntoView({ block: 'center' }); if (el.focus && el.tagName === 'INPUT') el.focus(); } return; }
  const buyer_name = $('buyerName').value.trim(), contact_value = $('contactInput').value.trim();
  const tier_counts = { ...counts };
  const sig = JSON.stringify([tier_counts, mode === 'pick' ? slots : blockId, buyer_name, contact_value]);
  if (!attempt || attempt.sig !== sig) attempt = { sig, ref: newClientRef() };
  busy = true; renderPay();
  try {
    const body = { campaign_id: campaignId, tier_counts, buyer_name, contact_value, client_ref: attempt.ref };
    if (mode === 'pick') body.ticket_numbers = slots; else body.block_id = blockId;
    const data = await call('public_purchase', body);
    $('veil').classList.add('on');
    location.href = data.pay_url;
  } catch (e) {
    busy = false;
    if (!e.network) attempt = null;
    errEl.innerHTML = `<div class="err">${esc(nice(e.message))}${e.network ? ' Nothing is lost — tap again to retry; you will not be charged twice.' : ''}</div>`;
    if (mode === 'pick' && !e.network) await flagTaken();
    renderPay();
  }
}
// After a failed purchase, find out which of the basket's numbers were snapped up meanwhile,
// mark them, and offer replacements with one tap.
async function flagTaken() {
  try {
    const held = heldNumbers(); if (!held.length) return;
    const { results } = await call('public_check_tickets', { campaign_id: campaignId, ticket_numbers: held });
    taken = new Set(results.filter(r => !r.ok).map(r => r.ticket_number));
    renderSlots();
    if (taken.size) {
      $('payErr').innerHTML = `<div class="err">${taken.size === 1 ? 'One number was' : taken.size + ' numbers were'} just taken by someone else. <button type="button" id="swapBtn" style="margin-left:6px;padding:6px 10px;border:none;border-radius:8px;background:var(--wine);color:#fff;font-weight:700">Swap ${taken.size === 1 ? 'it' : 'them'}</button></div>`;
      $('swapBtn').onclick = swapTaken;
    }
  } catch { /* the error already shown is enough */ }
}
async function swapTaken() {
  const idxs = slots.map((v, i) => taken.has(v) ? i : -1).filter(i => i >= 0);
  if (!idxs.length) return;
  try {
    const numbers = await fetchRandom(idxs.length, heldNumbers());
    idxs.forEach((i, k) => { if (numbers[k] != null) { slots[i] = numbers[k]; popping.add(i); } else slots[i] = null; });
    taken.clear(); $('payErr').innerHTML = ''; renderSlots(); renderPay(); setTimeout(() => popping.clear(), 600);
  } catch (e) { $('payErr').innerHTML = `<div class="err">${esc(e.message)}</div>`; }
}

// A buyer who paid but closed SumUp's page before coming back can get their ticket page again.
async function findTicket() {
  const out = $('findOut'), btn = $('findBtn');
  const buyer_name = $('fName').value.trim(), contact_value = $('fContact').value.trim();
  if (!buyer_name || !contact_value) { out.innerHTML = `<div class="err">Please enter both your name and your mobile or email.</div>`; return; }
  btn.disabled = true; out.innerHTML = `<p class="note" style="margin-top:10px">Looking…</p>`;
  try {
    const { purchases } = await call('public_find_tickets', { campaign_id: campaignId, buyer_name, contact_value });
    if (!purchases.length) {
      out.innerHTML = `<div class="err" style="margin-top:10px">We couldn't find a paid ticket for those details. Check the spelling is exactly as you entered it. If you paid just now, wait a minute and try again.</div>`;
    } else {
      out.innerHTML = `<p class="note" style="margin:12px 0 6px">Found — tap to open and save it:</p>` + purchases.map(p =>
        `<a class="found" href="/ticket.html?payment_id=${encodeURIComponent(p.payment_id)}">🎟️ <b>${esc(p.tickets.join(', '))}</b><span>${money(p.amount)} · ${esc(new Date(p.sold_at).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }))}</span></a>`).join('');
    }
  } catch (e) { out.innerHTML = `<div class="err" style="margin-top:10px">${esc(e.message)}</div>`; }
  finally { btn.disabled = false; }
}

boot();
</script>
</body>
</html>
