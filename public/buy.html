<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buy tickets</title>
<style>
  :root {
    --ink: #1c1c1e; --paper: #fdfcf9; --line: #e4e0d8;
    --accent: #8a3b2b; --accent-dim: #f2e4de;
    --good: #3a6b4f; --good-dim: #e2efe6;
    --bad: #a4342a; --bad-dim: #f6dedb;
    --tier-c: #4b5c7a; --tier-c-dim: #e4e8f0;
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, Segoe UI, Roboto, sans-serif; background:var(--paper); color:var(--ink); }
  header { padding: 18px 20px; border-bottom: 1px solid var(--line); text-align:center; }
  header h1 { font-size: 17px; margin:0; }
  main { max-width: 480px; margin: 0 auto; padding: 20px; }
  .card { background:white; border:1px solid var(--line); border-radius:14px; padding:20px; margin-bottom:16px; }
  label { display:block; font-size:13px; color:#555; margin: 12px 0 4px; font-weight:500; }
  label:first-child { margin-top:0; }
  input, select { width:100%; padding:13px; font-size:16px; border:1px solid var(--line); border-radius:10px; background:var(--paper); color:var(--ink); font-family:inherit; }
  .row { display:flex; gap:10px; flex-wrap:wrap; }
  .row > * { flex:1; min-width:130px; }
  .toggle { display:flex; border:1px solid var(--line); border-radius:10px; overflow:hidden; margin-top:6px; }
  .toggle button { flex:1; padding:11px; border:none; background:white; font-size:14px; font-weight:600; color:#777; cursor:pointer; }
  .toggle button.active { background:var(--accent); color:white; }
  .toggle button.active.alt { background:var(--tier-c); }
  .total { font-family:inherit; font-size:28px; font-weight:700; text-align:center; margin:16px 0; }
  button.primary { width:100%; padding:16px; font-size:17px; font-weight:600; background:var(--accent); color:white; border:none; border-radius:12px; margin-top:16px; cursor:pointer; }
  button.primary:disabled { background:var(--line); color:#888; cursor:not-allowed; }
  .muted { color:#888; font-size:13px; }
  .error { background:var(--bad-dim); color:var(--bad); padding:12px; border-radius:10px; margin:10px 0; font-size:14px; }
  .details-text { white-space:pre-wrap; font-size:14px; color:#444; line-height:1.5; }
  .ticket-row { display:flex; gap:8px; align-items:center; margin-bottom:4px; }
  .badge { display:inline-block; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:600; }
  .badge.tier0 { background:var(--accent-dim); color:var(--accent); }
  .badge.tier1 { background:var(--good-dim); color:var(--good); }
  .badge.tier2 { background:var(--tier-c-dim); color:var(--tier-c); }
  .tn-status { font-size:11px; margin:-2px 0 8px 4px; min-height:14px; }
  .tn-status.ok { color:var(--good); } .tn-status.bad { color:var(--bad); } .tn-status.checking { color:#888; }
</style>
</head>
<body>
<header><h1>⛪ Parish Campaigns</h1></header>
<main id="app"><div class="card"><p class="muted">Loading…</p></div></main>

<script>
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
// No reply within 25s gives up with a plain message instead of hanging on a weak signal.
// err.network = we don't know whether the server received it (vs. a real answer from it).
async function call(action, body) {
  const ctl = new AbortController(); const timer = setTimeout(() => ctl.abort(), 25000);
  let res, data;
  try {
    res = await fetch('/api/' + action, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body || {}), signal: ctl.signal });
    data = await res.json().catch(() => ({}));
  } catch (e) {
    const err = new Error(e && e.name === 'AbortError' ? 'No reply from the server — the signal may be weak.' : "Can't reach the server — check your signal.");
    err.network = true; throw err;
  } finally { clearTimeout(timer); }
  if (!res.ok) throw new Error(data.error || 'Something went wrong');
  return data;
}
// Same purchase details reuse the same reference, so a retry after a lost reply can't create a
// second purchase; changing anything starts a fresh one.
let purchaseAttempt = null;
function newClientRef() { return (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 12); }
const campaignId = new URLSearchParams(location.search).get('campaign_id');

let info = null, counts = {}, pickMode = 'auto', blockId = null, luckyNumbers = [];

async function boot() {
  const app = document.getElementById('app');
  if (!campaignId) { app.innerHTML = `<div class="card error">This link is missing its campaign reference.</div>`; return; }
  try {
    info = await call('public_campaign_info', { campaign_id: campaignId });
    counts = Object.fromEntries(info.tiers.map(t => [t.id, 0]));
    blockId = info.blocks.length === 1 ? info.blocks[0].id : null;
    render();
  } catch (e) {
    app.innerHTML = `<div class="card error">${esc(e.message)}</div>`;
  }
}

function currentBlock() { return info.blocks.find(b => b.id === blockId); }

function render() {
  const app = document.getElementById('app');
  const block = currentBlock();
  const total = info.tiers.reduce((s, t) => s + (counts[t.id] || 0) * Number(t.price), 0);
  const totalCount = Object.values(counts).reduce((s, c) => s + c, 0);

  app.innerHTML = `
    <div class="card">
      <h2 style="margin-top:0">${esc(info.campaign.name)}</h2>
      ${info.org.name ? `<p class="muted" style="margin-top:-8px">${esc(info.org.name)}${info.org.address?' · '+esc(info.org.address):''}</p>` : ''}
      ${info.campaign.details_text ? `<div class="details-text">${esc(info.campaign.details_text)}</div>` : ''}
    </div>
    <div class="card">
      <h3 style="margin-top:0">Choose your tickets</h3>
      ${info.blocks.length > 1 ? `
      <label>Which series</label>
      <select id="blockSelect">${info.blocks.map(b => `<option value="${b.id}" ${b.id===blockId?'selected':''}>${esc(b.label)} (${esc(b.number_prefix||'')}${b.range_start}–${esc(b.number_prefix||'')}${b.range_end})</option>`).join('')}</select>
      ` : ''}
      <div class="row">
        ${info.tiers.map(t => `<div><label>No. of ${esc(t.name)} (£${Number(t.price).toFixed(2)})</label>
          <input type="number" min="0" inputmode="numeric" value="${counts[t.id]||0}" data-tier="${t.id}" oninput="onCountChange('${t.id}', this.value)"></div>`).join('')}
      </div>

      <label>Ticket numbers</label>
      <div class="toggle">
        <button type="button" class="${pickMode==='auto'?'active':''}" onclick="setPickMode('auto')">Any available</button>
        <button type="button" class="${pickMode==='manual'?'active alt':''}" onclick="setPickMode('manual')">Pick your lucky number</button>
      </div>
      ${pickMode==='manual' ? `
      <div class="muted" style="margin-top:8px">Valid range: ${esc(block.number_prefix||'')}${block.range_start}–${esc(block.number_prefix||'')}${block.range_end}</div>
      <div id="ticketRows" style="margin-top:8px"></div>
      ` : `<div class="muted" style="margin-top:8px">We'll assign the next available number(s) for you.</div>`}

      <div class="total">£${total.toFixed(2)}</div>

      <label>Your name</label>
      <input id="buyerName" placeholder="e.g. Mary O'Brien">
      <label>Your mobile or email <span class="muted">(so we can confirm your ticket)</span></label>
      <input id="contactInput" placeholder="07… or name@example.com" autocomplete="off">

      <button class="primary" id="payBtn" onclick="doPurchase()" ${totalCount<=0?'disabled':''}>Pay by Link — £${total.toFixed(2)}</button>
      <div id="err"></div>
    </div>
  `;
  if (info.blocks.length > 1) document.getElementById('blockSelect').onchange = (e) => { blockId = e.target.value; luckyNumbers = []; render(); };
  if (pickMode === 'manual') renderTicketRows();
}

function onCountChange(tierId, v) { counts[tierId] = Number(v) || 0; regenerateRows(); render(); }
function setPickMode(m) { pickMode = m; luckyNumbers = []; render(); }

function regenerateRows() {
  const seq = [];
  info.tiers.forEach(t => { for (let i=0; i<(counts[t.id]||0); i++) seq.push(t.id); });
  luckyNumbers = seq.map((tierId, i) => ({ tierId, value: luckyNumbers[i] ? luckyNumbers[i].value : '' }));
}

function renderTicketRows() {
  regenerateRows();
  const wrap = document.getElementById('ticketRows'); if (!wrap) return;
  wrap.innerHTML = luckyNumbers.map((tn, i) => {
    const idx = info.tiers.findIndex(t => t.id === tn.tierId);
    const tier = info.tiers[idx];
    return `<div class="ticket-row"><span class="badge tier${idx%3}">${esc(tier.name)}</span>
      <input value="${esc(tn.value)}" inputmode="numeric" placeholder="e.g. ${currentBlock().range_start}" oninput="setLuckyNumber(${i}, this.value)"></div>
      <div class="tn-status" id="tnStatus-${i}"></div>`;
  }).join('');
  luckyNumbers.forEach((tn, i) => tn.value && checkLive(i, tn.value));
}
const checkTimers = {};
function setLuckyNumber(i, v) {
  luckyNumbers[i].value = v;
  const el = document.getElementById(`tnStatus-${i}`); if (el) el.textContent = '';
  clearTimeout(checkTimers[i]);
  if (String(v).trim() === '') return;
  checkTimers[i] = setTimeout(() => checkLive(i, v), 350);
}
async function checkLive(i, v) {
  const el = document.getElementById(`tnStatus-${i}`); if (!el) return;
  el.textContent = '⋯ checking'; el.className = 'tn-status checking';
  try {
    await call('public_check_ticket', { campaign_id: campaignId, ticket_number: Number(v) });
    if (String(luckyNumbers[i].value) !== String(v)) return;
    el.textContent = '✓ available'; el.className = 'tn-status ok';
  } catch (e) {
    if (String(luckyNumbers[i].value) !== String(v)) return;
    el.textContent = e.message; el.className = 'tn-status bad';
  }
}

async function doPurchase() {
  const errEl = document.getElementById('err');
  const buyer_name = document.getElementById('buyerName').value.trim();
  const contact_value = document.getElementById('contactInput').value.trim();
  if (!buyer_name) { errEl.innerHTML = `<div class="error">Please enter your name.</div>`; return; }
  if (!contact_value) { errEl.innerHTML = `<div class="error">Please enter your mobile number or email.</div>`; return; }
  if (pickMode === 'manual') {
    if (!luckyNumbers.length) { errEl.innerHTML = `<div class="error">Choose at least one ticket first.</div>`; return; }
    const statuses = luckyNumbers.map((tn,i) => document.getElementById(`tnStatus-${i}`)?.textContent || '');
    if (statuses.some(s => !s.includes('available')) || luckyNumbers.some(tn => !tn.value)) {
      errEl.innerHTML = `<div class="error">Fix the flagged ticket number(s) first.</div>`; return;
    }
  }
  errEl.innerHTML = '';
  const payBtn = document.getElementById('payBtn'); payBtn.disabled = true; payBtn.textContent = 'Please wait…';
  const tier_counts = { ...counts };
  const sig = JSON.stringify([tier_counts, pickMode === 'manual' ? luckyNumbers.map(t => t.value) : blockId, buyer_name, contact_value]);
  if (!purchaseAttempt || purchaseAttempt.sig !== sig) purchaseAttempt = { sig, ref: newClientRef() };
  try {
    const data = pickMode === 'manual'
      ? await call('public_purchase', { campaign_id: campaignId, tier_counts, ticket_numbers: luckyNumbers.map(t => t.value), buyer_name, contact_value, client_ref: purchaseAttempt.ref })
      : await call('public_purchase', { campaign_id: campaignId, tier_counts, block_id: blockId, buyer_name, contact_value, client_ref: purchaseAttempt.ref });
    location.href = data.pay_url;
  } catch (e) {
    if (!e.network) purchaseAttempt = null;
    errEl.innerHTML = `<div class="error">${esc(e.message)}${e.network ? ' Nothing is lost — tap the button again to retry; you will not be charged twice.' : ''}</div>`;
    payBtn.disabled = false; payBtn.textContent = 'Pay by Link';
  }
}

boot();
</script>
</body>
</html>
