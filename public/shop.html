<script>
// Ask for the shop (or the order's status) at once, while the styles and fonts are still downloading.
window.__shopP = (function () {
  var qs = new URLSearchParams(location.search), order = qs.get('order');
  var m = /^\/shop\/([^\/?#]+)\/?$/.exec(location.pathname), slug = m ? decodeURIComponent(m[1]).toLowerCase() : '';
  if (!window.fetch || (!order && !slug)) return { slug: slug, order: order, p: null };
  var ctl = window.AbortController ? new AbortController() : null;
  if (ctl) setTimeout(function () { ctl.abort(); }, 25000);
  var p = fetch(order ? '/api/public_shop_status' : '/api/public_shop', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(order ? { order_id: order } : { slug: slug }), signal: ctl ? ctl.signal : undefined })
    .then(function (r) { return r.json().catch(function () { return {}; }).then(function (d) { return { ok: r.ok, status: r.status, d: d }; }); })
    .catch(function () { return null; });
  return { slug: slug, order: order, p: p };
})();
</script>
<style>

  }

  var P = window.__shopP, slug = P.slug, orderId = P.order;
  var data = null, qty = {}, collect = '', who = { name: '', phone: '', email: '' }, busy = false, attemptRef = '', errMsg = '', badField = '';

  // ---- keep a half-made basket if the page is closed (never anything personal except what they typed)
  function key() { return 'shop_basket_' + slug; }
  function saveBasket() { try { localStorage.setItem(key(), JSON.stringify({ qty: qty, collect: collect, who: who })); } catch (e) { /* private window: it simply is not kept */ } }
  function loadBasket() {

  }
  function clearBasket() { try { localStorage.removeItem(key()); } catch (e) { /* fine */ } }

  function count() { var n = 0; Object.keys(qty).forEach(function (k) { n += qty[k]; }); return n; }

  var q = '', catSel = '', open = {}, byId = {}, index = [], vocab = [], searchTimer = null;
  var SYN = { rosary: ['bead'], bead: ['rosary'], candle: ['votive', 'taper'], votive: ['candle'], card: ['greeting'], bible: ['scripture', 'testament'], statue: ['figure', 'figurine'], figure: ['statue'], cross: ['crucifix'], crucifix: ['cross'],

    nativity: ['christmas', 'crib'], baptism: ['christening', 'baby'], christening: ['baptism'], gift: ['present', 'set'], present: ['gift'], angel: ['archangel', 'guardian'], easter: ['lent'], magnet: ['fridge'] };
  function norm(s) { s = String(s == null ? '' : s).toLowerCase(); try { s = s.normalize('NFD').replace(/[̀-ͯ]/g, ''); } catch (e) { /* old browser: accents stay */ } return s.replace(/[^a-z0-9 ]+/g, ' ').replace(/\s+/g, ' ').trim(); }
  function stem(w) { if (w.length > 4 && /ies$/.test(w)) return w.slice(0, -3) + 'y'; if (w.length > 3 && /s$/.test(w) && !/ss$/.test(w)) return w.slice(0, -1); return w; }
  function words(s) { return norm(s).split(' ').filter(Boolean).map(stem); }
  function lev(a, b, max) {   // edit distance, stopping early once it is more than max
    if (Math.abs(a.length - b.length) > max) return max + 1;
    var prev = [], cur, i, j;
    for (j = 0; j <= b.length; j++) prev[j] = j;
    for (i = 1; i <= a.length; i++) { cur = [i]; var best = i; for (j = 1; j <= b.length; j++) { cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); if (cur[j] < best) best = cur[j]; } if (best > max) return max + 1; prev = cur; }
    return prev[b.length];
  }
  function prep() {
    byId = {}; index = []; var seen = {}; vocab = [];
    data.items.forEach(function (i, n) {
      byId[i.id] = i;
      var nw = words(i.name), cw = words(i.category), dw = words(i.description);

  function wordScore(qw, e) {
    var best = 0, fields = [[e.name, 3], [e.cat, 2], [e.desc, 1]], syn = SYN[qw] || [];
    fields.forEach(function (f) {

    var qws = words(query); if (!qws.length) return [];
    var out = [];
    index.forEach(function (e) { var s = 0; for (var k = 0; k < qws.length; k++) { var w = wordScore(qws[k], e); if (!w) return; s += w; } out.push({ e: e, s: s }); });
    out.sort(function (a, b) { return (b.s - a.s) || (a.e.item.sold_out - b.e.item.sold_out) || (a.e.n - b.e.n); });
    return out.map(function (o) { return o.e.item; });
  }
  function suggest(query) {   // "did you mean": the closest word the shop actually uses
    var qws = words(query), out = [];
    qws.forEach(function (w) { if (w.length < 4) return; var best = null, bd = 3; vocab.forEach(function (v) { var d = lev(w, v, 2); if (d < bd) { bd = d; best = v; } }); if (best && best !== w) out.push(best); });
    return out.length ? out.join(' ') : '';
  }

  function pic(i, size, eager) {
    var src = i.img && /^https?:\/\//.test(data.img_base) ? data.img_base + i.img : '';
    return '<span class="pic' + (size > 80 ? ' big' : '') + '">' + ico(I.bag, Math.round(size / 2.6)) + (src ? '<img src="' + esc(src) + '" alt="" width="' + size + '" height="' + size + '" decoding="async"' + (eager ? '' : ' loading="lazy"') + '>' : '') + '</span>';
  }
  function tagOf(i) { return i.sold_out ? '<span class="tag out">' + esc(W.soldOut) + '</span>' : (i.left !== null ? '<span class="tag">' + esc(W.onlyLeft(i.left)) + '</span>' : ''); }
  function ctl(i) {   // nothing chosen: one round "+" ; something chosen: the stepper
    if (i.sold_out) return '';
    var n = qty[i.id] || 0, limit = i.left !== null ? Math.min(20, i.left) : 20, id = esc(i.id);
    if (!n) return '<button type="button" class="plus add" data-inc="' + id + '" aria-label="Add ' + esc(i.name) + '">' + ico(I.plus) + '</button>';
    return '<div class="qty" role="group" aria-label="Quantity of ' + esc(i.name) + '"><button type="button" data-dec="' + id + '" aria-label="One fewer ' + esc(i.name) + '">' + ico(I.minus) + '</button><output aria-live="polite">' + n + '</output><button type="button" class="plus" data-inc="' + id + '" aria-label="One more ' + esc(i.name) + '"' + (n >= limit ? ' disabled' : '') + '>' + ico(I.plus) + '</button></div>';
  }
  function row(i, showCat, eager) {
    return '<div class="item" data-item="' + esc(i.id) + '">' + pic(i, 72, eager) + '<div class="inf"><h3>' + esc(i.name) + '</h3>' + (i.description ? '<p>' + esc(i.description) + '</p>' : '') + (showCat && i.category ? '<p>' + esc(i.category) + '</p>' : '') + '<div class="meta"><span class="price">' + gbp(i.price) + '</span>' + tagOf(i) + '</div></div><div class="qs" data-slot>' + ctl(i) + '</div></div>';
  }
  function tile(i, eager) {
    return '<div class="tile" data-item="' + esc(i.id) + '">' + pic(i, 112, eager) + '<b class="tn">' + esc(i.name) + '</b><div class="meta"><span class="price">' + gbp(i.price) + '</span>' + tagOf(i) + '</div><div class="qs" data-slot>' + ctl(i) + '</div></div>';
  }
  function shelvesHtml() {
    return (data.shelves || []).map(function (s, n) {
      var tiles = s.ids.map(function (id) { return byId[id]; }).filter(Boolean);
      return tiles.length ? '<h3 class="shelfh">' + esc(s.title) + '</h3><div class="rail">' + tiles.map(function (i) { return tile(i, n === 0); }).join('') + '</div>' : '';
    }).join('');
  }
  function categoryHtml(name, limit) {
    var list = data.items.filter(function (i) { return (i.category || '') === name; }), shown = list.slice(0, limit);
    return (name ? '<p class="cat">' + esc(name) + '</p>' : '') + shown.map(function (i) { return row(i, false, false); }).join('') +
      (list.length > limit ? '<button class="btn more" type="button" data-more="' + esc(name) + '">Show all ' + list.length + (name ? ' in ' + esc(name) : '') + '</button>' : '');
  }
  function listHtml() {
    var query = q.trim();
    if (query) {
      var found = search(query), shown = found.slice(0, 60);
      if (!found.length) { var sg = suggest(query); return '<p class="count">' + esc(W.noMatch(query)) + '</p>' + (sg ? '<p class="count">Did you mean <button class="linkbtn" type="button" data-say="' + esc(sg) + '">' + esc(sg) + '</button>?</p>' : '') + '<p class="count">' + esc(W.tryCats) + '</p>'; }
      return '<p class="count" role="status">' + esc(W.matches(found.length, query)) + '</p>' + shown.map(function (i) { return row(i, true, false); }).join('') + (found.length > 60 ? '<p class="count">' + esc(W.refine) + '</p>' : '');
    }
    if (catSel) return categoryHtml(catSel, 200);
    var order = [], seen = {};
    data.items.forEach(function (i) { var c = i.category || ''; if (!seen[c]) { seen[c] = 1; order.push(c); } });
    return shelvesHtml() + order.map(function (c) { return categoryHtml(c, open[c] ? 200 : 8); }).join('');
  }
  function chipsHtml() {
    var cats = (data.categories || []).filter(function (c) { return c.name; });
    if (cats.length < 2) return '';
    return '<button type="button" class="chip" data-cat="" aria-pressed="' + (!catSel && !q.trim()) + '">' + esc(W.all) + '</button>' + cats.map(function (c) { return '<button type="button" class="chip' + (c.season ? ' hot' : '') + '" data-cat="' + esc(c.name) + '" aria-pressed="' + (catSel === c.name) + '">' + esc(c.name) + ' <span>' + c.count + '</span></button>'; }).join('');
  }
  function drawList() { var b = $('list'); if (b) b.innerHTML = listHtml(); var c = $('chips'); if (c) c.innerHTML = chipsHtml(); var x = document.querySelector('.search .clear'); if (x) x.hidden = !q; }
  function render() {
    var html = mast(data.org.name, W.title, slug) + '<main class="gutter"><div class="wrap" style="display:grid;grid-template-columns:minmax(0,1fr);gap:14px">';
    if (data.intro || data.cutoff_text) html += '<section class="panel">' + (data.intro ? '<p class="intro">' + esc(data.intro) + '</p>' : '') + (data.cutoff_text ? '<p class="cut">' + esc(data.cutoff_text) + '</p>' : '') + '</section>';
    // 1. items
    html += '<section class="panel" aria-labelledby="h1"><h2 id="h1"><span class="n">1</span>' + esc(W.step1) + '</h2>';
    if (!data.items.length) html += '<p class="intro">' + esc(W.noItems) + '</p>';
    else html += '<div class="searchwrap"><div class="search" role="search"><span class="sico" aria-hidden="true">' + ico(I.search, 22) + '</span><input id="fSearch" type="search" enterkeyhint="search" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="' + esc(W.searchHint) + '" aria-label="' + esc(W.searchLabel) + '" value="' + esc(q) + '"><button type="button" class="clear" data-clear aria-label="Clear the search"' + (q ? '' : ' hidden') + '>' + ico(I.close, 20) + '</button></div><div class="chips" id="chips" role="group" aria-label="Categories"></div></div><div id="list"></div>';
    html += '</section>';
    // 2. when
    html += '<section class="panel" aria-labelledby="h2"><h2 id="h2"><span class="n">2</span>' + esc(W.step2) + '</h2><p class="intro">' + esc(W.collectHelp) + '</p>';
    if (!data.options.length) html += '<p class="note">' + esc(W.noOptions) + '</p>';
    else { html += '<div class="opts" role="radiogroup" aria-labelledby="h2">'; data.options.forEach(function (o) { html += '<label class="opt' + (collect === o.key ? ' on' : '') + '"><input type="radio" name="collect" value="' + esc(o.key) + '"' + (collect === o.key ? ' checked' : '') + '><span>' + esc(o.label) + '</span></label>'; }); html += '</div>'; }
    html += '</section>';
    // 3. details
    html += '<section class="panel" aria-labelledby="h3"><h2 id="h3"><span class="n">3</span>' + esc(W.step3) + '</h2>' +
      '<div class="f' + (badField === 'name' ? ' bad' : '') + '"><label for="fName">' + esc(W.name) + '</label><input id="fName" type="text" autocomplete="name" maxlength="80" value="' + esc(who.name) + '"></div>' +
      '<div class="f' + (badField === 'contact' ? ' bad' : '') + '"><label for="fPhone">' + esc(W.phone) + '</label><input id="fPhone" type="tel" inputmode="tel" autocomplete="tel" maxlength="30" value="' + esc(who.phone) + '"></div>' +
      '<div class="f' + (badField === 'contact' ? ' bad' : '') + '"><label for="fEmail">' + esc(W.email) + '</label><input id="fEmail" type="email" inputmode="email" autocomplete="email" maxlength="254" value="' + esc(who.email) + '"><span class="help">' + esc(W.contactHelp) + '</span></div>' +
      '<div class="trap" aria-hidden="true"><label>Leave this empty<input id="fWebsite" type="text" tabindex="-1" autocomplete="off"></label></div></section>';
    html += '</div></main>';
    html += '<div class="bar gutter"><div class="wrap">' + (errMsg ? '<p class="err" role="alert">' + esc(errMsg) + '</p>' : '') +
      '<button class="pay" type="button" id="payBtn"' + (busy || !count() ? ' disabled' : '') + '><span id="payLabel">' + esc(busy ? W.opening : (count() ? W.pay : W.basketEmpty)) + '</span><span class="amt" id="payAmt">' + (count() && !busy ? gbp(total()) : '') + '</span></button></div></div>';
    var keepScroll = window.scrollY, ae = document.activeElement && document.activeElement.id;
    $('app').innerHTML = html;
    drawList();
    window.scrollTo(0, keepScroll);
    if (ae && $(ae) && /^f(Name|Phone|Email)$/.test(ae)) { var el = $(ae); el.focus(); try { el.setSelectionRange(el.value.length, el.value.length); } catch (e) { /* not for every type */ } }
  }
  function refreshBar() {   // only the basket total changes while choosing, so the page is not redrawn under a thumb
    var pb = $('payBtn'); if (!pb) return;
    pb.disabled = busy || !count();
    $('payLabel').textContent = busy ? W.opening : (count() ? W.pay : W.basketEmpty);
    $('payAmt').textContent = count() && !busy ? gbp(total()) : '';
  }
  function setQty(id, n) {
    var it = byId[id]; if (!it) return;
    var limit = it.left !== null ? Math.min(20, it.left) : 20;
    n = Math.max(0, Math.min(limit, n)); if (n) qty[id] = n; else delete qty[id];
    var slots = document.querySelectorAll('[data-item="' + id + '"] [data-slot]');   // the same item can be on a shelf and in its category
    for (var k = 0; k < slots.length; k++) slots[k].innerHTML = ctl(it);
    errMsg = ''; var e = document.querySelector('.err'); if (e) e.remove();
    saveBasket(); refreshBar();
  }
  function fail(msg, field) { errMsg = msg; badField = field || ''; render(); var e = document.querySelector('.err'); if (e) e.scrollIntoView({ block: 'nearest' }); if (field) { var t = field === 'name' ? $('fName') : $('fPhone'); if (t) { t.scrollIntoView({ block: 'center' }); t.focus(); } } }
  function submit() {
    if (busy) return;
    who.name = $('fName').value.trim(); who.phone = $('fPhone').value.trim(); who.email = $('fEmail').value.trim(); saveBasket();
    badField = '';
    if (!count()) return fail(W.needItems);
    if (!collect) { errMsg = W.needWhen; render(); var o = document.querySelector('.opts'); if (o) o.scrollIntoView({ block: 'center' }); return; }
    if (!who.name) return fail(W.needName, 'name');
    if (!who.phone && !who.email) return fail(W.needContact, 'contact');
    busy = true; errMsg = ''; render();
    if (!attemptRef) attemptRef = 'a' + Math.random().toString(36).slice(2, 12) + Date.now().toString(36);
    var body = { slug: slug, items: Object.keys(qty).map(function (id) { return { id: id, qty: qty[id] }; }), collect: collect, name: who.name, phone: who.phone, email: who.email, client_ref: attemptRef, website: ($('fWebsite') || {}).value || '' };
    fetch('/api/public_shop_order', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (r) {
        if (r.ok && r.d.order_id) {
          clearBasket();
          var pay = safeHref(r.d.pay_url);
          if (pay) { location.href = pay; return; }
          location.href = '/shop.html?order=' + encodeURIComponent(r.d.order_id);
          return;
        }
        busy = false; attemptRef = ''; reloadThen((r.d && r.d.error) || W.failed);
      })
      .catch(function () { busy = false; errMsg = W.failedHelp; render(); });
  }
  // after a refusal (sold out, collection time passed...) fetch the shop again so what is shown is true, and say what went wrong
  function reloadThen(msg) {
    fetch('/api/public_shop', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ slug: slug }) })
      .then(function (r) { return r.json(); })
      .then(function (d) { if (d && d.items) { data = d; prep(); Object.keys(qty).forEach(function (id) { if (!data.items.some(function (i) { return i.id === id && !i.sold_out; })) delete qty[id]; }); if (!data.options.some(function (o) { return o.key === collect; })) collect = ''; } errMsg = msg; render(); })
      .catch(function () { errMsg = msg; render(); });
  }

  // ---- an order's own page: its reference, and where it stands
  var polls = 0, pollTimer = null;
  function orderPage(o) {
    var paid = o.status === 'paid' || o.status === 'prepared' || o.status === 'collected', slugOf = o.org_slug || '';
    var lines = o.lines.map(function (l) { return '<li><span>' + l.qty + ' × ' + esc(l.name) + '</span><b>' + gbp(l.unit_price * l.qty) + '</b></li>'; }).join('');
    var html = mast(o.org_name || W.title, W.title, slugOf) + '<main class="gutter"><div class="wrap"><div class="status">';
    if (paid) {
      html += '<h1>Thank you. Your order is in.</h1><div class="ref" style="width:100%"><div><span class="k">Your order reference</span><b>' + esc(o.ref) + '</b></div><button class="ibtn" type="button" data-copy="' + esc(o.ref) + '" aria-label="Copy the reference" title="Copy the reference">' + ico(I.copy) + '</button></div>' +
        '<p>Collect it at the church door on your way out from <b style="color:var(--fg)">' + esc(o.slot_label) + '</b>. It will be ready in an envelope or bag with this reference and your name.</p>';
    } else if (o.status === 'cancelled') {
      html += '<h1>This order was not completed.</h1><p>' + esc(o.ref) + ' was cancelled, so nothing is being kept for you. If you were charged, please contact the parish office.</p>' + (slugOf ? '<a class="btn solid" style="display:inline-flex;align-items:center" href="/shop/' + esc(slugOf) + '">Start a new order</a>' : '');
    } else {
      html += '<h1>Waiting for your payment…</h1><div class="ref" style="width:100%"><div><span class="k">Your order reference</span><b>' + esc(o.ref) + '</b></div></div><p>We are checking with the card payment. This page updates by itself. If you have not paid yet:</p>' + (safeHref(o.pay_url) ? '<a class="btn solid" style="display:inline-flex;align-items:center" href="' + esc(safeHref(o.pay_url)) + '">Go to the payment page</a>' : '');
    }
    if (o.status !== 'cancelled') html += '<ul class="lines" style="width:100%">' + lines + '<li style="border-top:2px solid var(--line);padding-top:6px"><span>Total</span><b>' + gbp(o.total) + '</b></li></ul>';
    if (paid) html += '<button class="ibtn" type="button" data-copylink aria-label="Copy a link back to this page" title="Copy a link back to this page">' + ico(I.link) + '</button><p style="font-size:.9375rem">Keep this page, or copy its link, to see your reference again. If you are collecting for someone else, tell the volunteer the reference or your name.</p>';
    html += '</div></div></main>';
    $('app').innerHTML = html;
    document.title = o.ref + ' · ' + W.title;
    clearTimeout(pollTimer);
    if (o.status === 'awaiting_payment' && polls++ < 40) pollTimer = setTimeout(function () { fetch('/api/public_shop_status', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ order_id: orderId }) }).then(function (r) { return r.json(); }).then(function (d) { if (d && d.ref) orderPage(d); }).catch(function () { /* try again on the next beat */ }); }, 4000);
  }

  document.addEventListener('click', function (e) {
    var t = e.target, b;
    if ((b = t.closest('[data-inc]'))) { var id = b.getAttribute('data-inc'), box = b.closest('[data-item]'); setQty(id, (qty[id] || 0) + 1); keepFocus(box, '[data-inc]'); return; }
    if ((b = t.closest('[data-dec]'))) { var id2 = b.getAttribute('data-dec'), box2 = b.closest('[data-item]'); setQty(id2, (qty[id2] || 0) - 1); keepFocus(box2, (qty[id2] ? '[data-dec]' : '[data-inc]')); return; }
    if ((b = t.closest('[data-cat]'))) { catSel = b.getAttribute('data-cat'); q = ''; var si = $('fSearch'); if (si) si.value = ''; drawList(); var top = $('chips'); if (top && top.scrollIntoView) top.scrollIntoView({ block: 'nearest' }); return; }
    if ((b = t.closest('[data-more]'))) { open[b.getAttribute('data-more')] = true; drawList(); return; }
    if (t.closest('[data-clear]')) { q = ''; var si2 = $('fSearch'); if (si2) { si2.value = ''; si2.focus(); } drawList(); return; }
    if ((b = t.closest('[data-say]'))) { q = b.getAttribute('data-say'); catSel = ''; var si3 = $('fSearch'); if (si3) si3.value = q; drawList(); return; }
    if (t.closest('#payBtn')) { submit(); return; }
    if (t.closest('#retry')) { start(); return; }
    if ((b = t.closest('[data-copy]'))) { var v = b.getAttribute('data-copy'); try { navigator.clipboard.writeText(v).then(function () { say(W.copied + ': ' + v); }, function () { say(v); }); } catch (x) { say(v); } return; }
    if (t.closest('[data-copylink]')) { var u = location.href; try { navigator.clipboard.writeText(u).then(function () { say(W.copiedLink); }, function () { say(u); }); } catch (x2) { say(u); } return; }
  });
  document.addEventListener('change', function (e) {
    if (e.target && e.target.name === 'collect') { collect = e.target.value; errMsg = ''; saveBasket(); document.querySelectorAll('.opt').forEach(function (l) { l.classList.toggle('on', l.querySelector('input').checked); }); var er = document.querySelector('.err'); if (er) er.remove(); }
  });
  function keepFocus(box, sel) { if (!box) return; var n = box.querySelector(sel) || box.querySelector('[data-inc]'); if (n && !n.disabled) { try { n.focus({ preventScroll: true }); } catch (x) { n.focus(); } } }
  // a picture that cannot be fetched is dropped, leaving the plain icon behind it
  document.addEventListener('error', function (e) { var t = e.target; if (t && t.tagName === 'IMG' && t.parentNode && t.parentNode.className.indexOf('pic') >= 0) t.parentNode.removeChild(t); }, true);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && e.target && e.target.id === 'fSearch' && q) { q = ''; e.target.value = ''; drawList(); } });
  document.addEventListener('input', function (e) {
    if (e.target && e.target.id === 'fSearch') { var v = e.target.value; clearTimeout(searchTimer); searchTimer = setTimeout(function () { q = v; if (q.trim()) catSel = ''; drawList(); }, 120); return; }
    if (e.target && /^f(Name|Phone|Email)$/.test(e.target.id)) { who.name = ($('fName') || {}).value || ''; who.phone = ($('fPhone') || {}).value || ''; who.email = ($('fEmail') || {}).value || ''; saveBasket(); }
  });

  function take(r) {
    if (orderId) {
      if (r && r.ok && r.d && r.d.ref) { orderPage(r.d); return; }
      if (r && r.status === 404) { status('We could not find that order.', 'Please check the link, or ask at the parish office.', false, ''); return; }
      status(W.failed, W.failedHelp, true, ''); return;
    }
    if (!r) { status(W.failed, W.failedHelp, true, slug); return; }
    if (r.status === 404) { status(W.closed, W.closedHelp, false, slug); return; }
    if (r.ok && r.d && r.d.items) { data = r.d; prep(); loadBasket(); document.title = W.title + ' · ' + data.org.name; render(); return; }
    status(W.failed, W.failedHelp, true, slug);
  }
  function start() {
    if (!orderId && !slug) { status(W.closed, W.closedHelp, false, ''); return; }
    var p = P.p; P.p = null;
    if (!p) p = fetch(orderId ? '/api/public_shop_status' : '/api/public_shop', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(orderId ? { order_id: orderId } : { slug: slug }) })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (d) { return { ok: r.ok, status: r.status, d: d }; }); }).catch(function () { return null; });
    p.then(take);
  }
  status(W.loading, '', false, slug);
  start();
})();
</script>
</body>
</html>
