<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2E4739">
<title>St.Vincent De Paul Church — Campaigns</title>
<link rel="stylesheet" href="/theme.css">
<style>
  * { box-sizing: border-box; }
  body { margin:0; }
  header { padding:10px 16px; background:var(--pine); color:#F1F0E7; display:flex; justify-content:space-between; align-items:center; gap:10px; }
  #headerRight { display:flex; gap:6px; }
  header h1 { margin:0; font-weight:400; }
  header h1.brand { flex:1; min-width:0; display:flex; flex-direction:column; line-height:1.1; font-family:var(--font-caps); }
  header h1.brand .eb { font-size:10.5px; letter-spacing:.16em; line-height:1.3; text-transform:uppercase; color:var(--brass-bright); }
  header h1.brand .wm { font-size:22px; color:#F1F0E7; margin-top:3px; }
  header button { background:transparent; border:1px solid rgba(241,240,231,.4); color:#F1F0E7; border-radius:9px; padding:9px 13px; font-size:14.5px; font-weight:600; }
  main { max-width: 600px; margin: 0 auto; padding: 20px; }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:20px; margin-bottom:16px; }
  label { display:block; font-size:14.5px; color:var(--slate); margin: 12px 0 4px; font-weight:500; }
  input, select { width:100%; padding:14px; font-size:17px; border:1px solid var(--stone); border-radius:11px; background:#fff; color:var(--ink); }
  button.primary { width:100%; padding:16px; font-size:18px; font-weight:600; background:var(--accent); color:#F3F1E7; border:none; border-radius:12px; margin-top:16px; }
  button.primary:disabled { background:var(--line); color:var(--slate); }
  button.secondary { width:100%; padding:14px; font-size:16px; font-weight:600; background:var(--accent-dim); color:var(--accent); border:none; border-radius:12px; margin-top:8px; }
  button.small { padding:9px 13px; font-size:14.5px; font-weight:500; border-radius:9px; border:1px solid var(--stone); background:var(--surface); color:var(--ink); }
  button.ghost { background:none; border:1px dashed var(--stone); color:var(--slate); border-radius:9px; padding:9px 10px; font-size:14px; width:100%; }
  button.link { background:none; border:none; color:var(--slate); font-size:14px; text-decoration:underline; padding:0; }
  button.link.bad { color:var(--bad); }
  button.icon-x { background:none; border:none; color:var(--slate); font-size:16px; padding:4px 8px; }
  .row { display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap; }
  .row > * { flex:1; min-width:110px; }
  .ticket-row { display:flex; gap:8px; align-items:center; margin-bottom:8px; }
  .ticket-row input { flex:1; }
  .toggle { display:flex; border:1px solid var(--line); border-radius:10px; overflow:hidden; margin-top:6px; }
  .toggle button { flex:1; padding:11px; border:none; background:var(--surface); font-size:14.5px; font-weight:600; color:var(--slate); }
  .toggle button.active { background:var(--accent); color:white; }
  .toggle button.active.alt { background:var(--tier-c); }
  .total { font-family:var(--font-head); font-size:32px; font-weight:500; text-align:center; margin:16px 0; }
  .stat { display:flex; justify-content:space-between; padding:11px 0; border-bottom:1px solid var(--line); font-size:16.5px; }
  .stat b { font-family:var(--font-head); font-weight:500; font-size:18px; }
  .stat:last-child { border:none; }
  .badge { display:inline-block; padding:3px 11px; border-radius:20px; font-size:13px; font-weight:600; }
  .tiny-actions { display:flex; flex-wrap:wrap; gap:6px; }
  .badge.ok { background:var(--good-dim); color:var(--good); }
  .badge.warn { background:var(--warn-dim); color:var(--warn); }
  .badge.bad { background:var(--bad-dim); color:var(--bad); }
  .badge.tier0 { background:var(--accent-dim); color:var(--accent); }
  .badge.tier1 { background:var(--good-dim); color:var(--good); }
  .badge.tier2 { background:var(--warn-dim); color:var(--warn); }
  .badge.tier3 { background:var(--tier-c-dim); color:var(--tier-c); }
  .tabs { display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap; }
  .tabs button { flex:1; padding:11px 8px; border:1px solid var(--stone); background:var(--surface); border-radius:11px; font-size:14.5px; font-weight:600; color:var(--pine); }
  .tabs button.active { background:var(--pine); color:#F3F1E7; border-color:var(--pine); }
  .error { background:var(--bad-dim); color:var(--bad); padding:13px; border-radius:11px; margin:10px 0; font-size:15.5px; }
  .info { background:var(--good-dim); color:var(--good); padding:13px; border-radius:11px; margin:10px 0; font-size:15.5px; }
  .hint { background:var(--brass-dim); color:var(--slate); padding:11px 13px; border-radius:11px; margin:10px 0; font-size:14px; }
  .muted { color:var(--slate); font-size:14.5px; }
  table { width:100%; border-collapse:collapse; font-size:14.5px; }
  td, th { padding:9px 5px; border-bottom:1px solid var(--line); text-align:left; }
  .share-row { display:flex; gap:6px; }
  .share-link { flex:1; display:flex; align-items:center; justify-content:center; gap:4px; background:var(--accent-dim); color:var(--accent); border-radius:10px; padding:11px 4px; font-size:14.5px; font-weight:600; text-decoration:none; }
  .tier-row, .block-row { display:flex; gap:8px; align-items:flex-end; margin-bottom:8px; }
  .tier-row > div, .block-row > div { flex:1; }
  #app { padding-bottom: 60px; }

  /* ---- Compact Sell screen: the whole sale fits one phone screen with no scrolling ---- */
  #app.sell { padding: 10px 12px 12px; }
  .sell .card { padding: 12px; margin-bottom: 10px; border-radius: 12px; }
  .statsbar { display:flex; justify-content:space-between; align-items:center; gap:8px; width:100%; padding:10px 13px; margin-bottom:10px; font-size:14.5px; text-align:left; color:var(--ink); background:var(--surface); border:1px solid var(--line); border-radius:12px; }
  .statsbar b { font-weight:700; }
  .statsline { min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .saletitle { font-family:var(--font-head); font-size:20px; font-weight:500; margin:0 0 2px; }
  .selrow { display:flex; gap:8px; margin-bottom:2px; }
  .selrow select { flex:1; min-width:0; padding:11px; font-size:15.5px; }
  .qty-row { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:10px; }
  .qty-label { font-size:17.5px; font-weight:600; }
  .stepper { display:flex; align-items:center; border:1px solid var(--stone); border-radius:12px; overflow:hidden; background:#fff; }
  .stepper button { width:54px; height:48px; border:none; background:var(--accent-dim); color:var(--accent); font-size:28px; font-weight:600; line-height:1; }
  .stepper input { width:60px; height:48px; text-align:center; border:none; border-left:1px solid var(--line); border-right:1px solid var(--line); border-radius:0; padding:0; font-family:var(--font-head); font-size:22px; font-weight:600; }
  .sell input.compact { margin-top:10px; padding:11px 12px; }
  .namecontact { display:flex; gap:8px; margin-top:10px; }
  .namecontact input { flex:1; min-width:0; padding:12px 11px; font-size:16.5px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; align-items:center; min-height:0; }
  .chip { padding:4px 10px; border-radius:14px; font-size:14px; font-weight:600; background:var(--pine-dim); color:var(--pine); }
  .chip.ok { background:var(--good-dim); color:var(--good); }
  .chip.bad { background:var(--bad-dim); color:var(--bad); }
  .totalline { display:flex; justify-content:space-between; align-items:baseline; margin-top:10px; font-size:15.5px; color:var(--slate); }
  .totalline b { font-family:var(--font-head); font-weight:500; font-size:31px; color:var(--ink); }
  .pay3 { display:flex; gap:8px; margin-top:6px; }
  .pay3 button { flex:1; margin:0; padding:16px 4px; font-size:17.5px; font-weight:600; border:none; border-radius:13px; color:#fff; }
  .pay3 button:disabled { background:var(--line) !important; color:var(--slate); }
  .feedbar { display:flex; justify-content:space-between; align-items:center; gap:8px; width:100%; padding:11px 13px; font-size:14.5px; text-align:left; color:var(--ink); background:var(--surface); border:1px solid var(--line); border-radius:12px; margin-bottom:10px; }
  .feedbar.attn { border-color:var(--warn); background:var(--warn-dim); }
  .sheet { position:fixed; left:0; right:0; bottom:0; z-index:20; max-width:560px; margin:0 auto; background:white; border-top:1px solid var(--line); border-radius:16px 16px 0 0; box-shadow:0 -6px 24px rgba(0,0,0,.18); padding:14px 16px 18px; }
  @media (max-height:700px) {
    header { padding:7px 14px; } header h1.brand .wm { font-size:19px; margin-top:1px; } header h1.brand .eb { font-size:10px; }
    #app.sell { padding:8px 12px 8px; } .sell .card { padding:10px; margin-bottom:8px; } .statsbar { padding:8px 12px; margin-bottom:8px; }
    .qty-row { margin-top:7px; } .stepper button, .stepper input { height:44px; } .sell input.compact { margin-top:8px; padding:10px 12px; }
    .namecontact { margin-top:8px; } .namecontact input { padding:10px 11px; } .totalline { margin-top:6px; } .totalline b { font-size:27px; }
    .pay3 button { padding:13px 4px; } .feedbar { padding:9px 12px; margin-bottom:6px; } .chips { margin-top:6px; }
  }
  @media (max-height:600px) { header h1.brand .wm { display:none; } .saletitle { font-size:17px; } .totalline b { font-size:24px; } .pay3 button { padding:11px 4px; font-size:16.5px; } }
  .sheet .share-link { padding:16px 4px; font-size:16.5px; }
</style>
</head>
<body>
<header>
  <h1 class="brand"><span class="eb">St.Vincent De Paul Church</span><span class="wm">Campaigns</span></h1>
  <div id="headerRight"></div>
</header>
<main id="app"></main>

<script>
const API = '/api/';
let state = { session: null, user: null, campaigns: [], org: null, lastCampaignId: null };
try {
  const saved = localStorage.getItem('pc_session');
  if (saved) state = { ...state, ...JSON.parse(saved) };
} catch {}

function saveState() { localStorage.setItem('pc_session', JSON.stringify(state)); }
function logout() { clearTimeout(autoLogoutTimer); state = { session: null, user: null, campaigns: [], org: null, lastCampaignId: null }; viewMode = 'sell'; saveState(); render(); }

// The session token isn't encrypted, just signed — safe to read its expiry client-side
// (we're not trusting it for auth, the server re-verifies the signature on every call).
let autoLogoutTimer = null;
function scheduleAutoLogout() {
  clearTimeout(autoLogoutTimer);
  if (!state.session) return;
  try {
    let b64 = state.session.split('.')[0].replace(/-/g, '+').replace(/_/g, '/');
    while (b64.length % 4) b64 += '=';
    const payload = JSON.parse(atob(b64));
    const msLeft = payload.exp - Date.now();
    if (msLeft <= 0) { logout(); return; }
    autoLogoutTimer = setTimeout(() => { alert('Session expired after 2 hours — please log in again.'); logout(); }, msLeft);
  } catch {}
}

// A request that gets no reply (weak signal) gives up after timeoutMs instead of hanging, and
// says so in plain words. err.network marks "we don't know whether the server got it" — as
// opposed to a real answer from the server — so callers can tell those two cases apart.
async function call(action, body = {}, timeoutMs = 20000) {
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), timeoutMs);
  let res, data;
  try {
    res = await fetch(API + action, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session: state.session, ...body }),
      signal: ctl.signal,
    });
    data = await res.json().catch(() => ({}));
  } catch (e) {
    const err = new Error(e && e.name === 'AbortError' ? 'No reply from the server — the signal may be weak.' : "Can't reach the server — check your signal.");
    err.network = true;
    throw err;
  } finally { clearTimeout(timer); }
  // The server ends a session when the account is disabled or its password is reset. Go back to
  // the login screen straight away instead of leaving a screen that can't do anything.
  if (res.status === 401 && state.session && action !== 'login') { logout(); throw new Error('Your session has ended — please log in again.'); }
  if (!res.ok) throw new Error(data.error || 'Something went wrong');
  return data;
}

function h(strings, ...vals) { return strings.reduce((a, s, i) => a + s + (vals[i] ?? ''), ''); }
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

// Admin and SuperAdmin can sell too (they must — anyone who can sell has to show up in
// Cash Recon and every other reconciliation screen, same as a Seller). viewMode is how
// they switch between their Admin dashboard and the same Sell screen a Seller uses.
let viewMode = 'sell'; // Sell is everyone's landing page; admins reach the Admin area via a button there
function render() {
  const staleSheet = document.getElementById('sheet'); if (staleSheet) staleSheet.remove();
  document.getElementById('app').className = '';
  if (!state.session) { renderLogin(); return; }
  const toAdmin = state.user.role !== 'seller' && state.user.role !== 'platform_owner' && viewMode === 'sell'
    ? `<button onclick="viewMode='admin'; render();">← Admin</button>` : '';
  document.getElementById('headerRight').innerHTML = `${toAdmin}<button onclick="logout()">Log out (${esc(state.user.name)})</button>`;
  if (state.user.role === 'platform_owner') renderPlatformOwner();
  else if (state.user.role === 'seller') renderSeller();
  else if (viewMode === 'sell') renderSeller();
  else renderAdmin();
}

// ================= LOGIN / BOOTSTRAP =================
function renderLogin(err) {
  document.getElementById('headerRight').innerHTML = '';
  document.getElementById('app').innerHTML = h`
    <div class="card">
      <h2 style="margin-top:0">Log in</h2>
      ${err ? `<div class="error">${esc(err)}</div>` : ''}
      <label>Mobile number</label>
      <input id="mobile" type="tel" placeholder="07xxxxxxxxx" inputmode="numeric">
      <label>Password</label>
      <input id="password" type="password">
      <button class="primary" onclick="doLogin()">Log in</button>
    </div>
    <div class="card">
      <p class="muted">First time setting this up? Only works once, before any Platform Owner exists.</p>
      <button class="secondary" onclick="showBootstrap()">First-time Platform Owner setup</button>
    </div>
  `;
}
async function doLogin() {
  const mobile = document.getElementById('mobile').value.trim();
  const password = document.getElementById('password').value;
  try {
    const data = await call('login', { mobile, password });
    state.session = data.session; state.user = data.user; viewMode = 'sell';
    saveState(); scheduleAutoLogout(); render();
  } catch (e) { renderLogin(e.message); }
}
function showBootstrap() {
  document.getElementById('app').innerHTML = h`
    <div class="card">
      <h2 style="margin-top:0">First-time Platform Owner Setup</h2>
      <p class="muted">Creates the very first Platform Owner account — the global role that creates each church (Organization) and its first Admin. Only works if no Platform Owner exists yet.</p>
      <label>Your name</label><input id="bName">
      <label>Mobile number</label><input id="bMobile" type="tel">
      <label>Password (8+ characters, yours alone)</label><input id="bPassword" type="password">
      <button class="primary" onclick="doBootstrap()">Create Platform Owner</button>
      <button class="secondary" onclick="renderLogin()">Back to login</button>
      <div id="bootstrapResult"></div>
    </div>`;
}
async function doBootstrap() {
  const resEl = document.getElementById('bootstrapResult');
  try {
    await call('bootstrap_platform_owner', {
      name: document.getElementById('bName').value.trim(),
      mobile: document.getElementById('bMobile').value.trim(),
      password: document.getElementById('bPassword').value,
    });
    renderLogin('Platform Owner created — please log in.');
  } catch (e) { resEl.innerHTML = `<div class="error">${esc(e.message)}</div>`; }
}

// ================= PLATFORM OWNER =================
async function renderPlatformOwner() {
  const { organizations } = await call('list_organizations');
  document.getElementById('app').innerHTML = h`
    <div class="card">
      <h2 style="margin-top:0">Organizations</h2>
      <p class="muted">Each church is its own Organization, with its own campaigns, sellers, and data — completely separate from any other.</p>
      <table>
        <tr><th>Name</th><th>Created</th></tr>
        ${organizations.map(o => `<tr><td>${esc(o.name)}</td><td>${new Date(o.created_at).toLocaleDateString('en-GB')}</td></tr>`).join('')}
      </table>
    </div>
    <div class="card">
      <h3 style="margin-top:0">Add a new church</h3>
      <label>Organization name</label>
      <input id="orgName" placeholder="e.g. St. Vincent De Paul Church, Osterley">
      <button class="primary" onclick="doCreateOrg()">Create Organization</button>
      <div id="orgResult"></div>
    </div>
    <div class="card">
      <h3 style="margin-top:0">Add that church's first Admin</h3>
      <label>Organization</label>
      <select id="orgForAdmin">${organizations.map(o => `<option value="${o.id}">${esc(o.name)}</option>`).join('')}</select>
      <label>Name</label><input id="adminName">
      <label>Mobile number</label><input id="adminMobile" type="tel">
      <label>Password (8+ characters)</label><input id="adminPassword" type="password">
      <button class="primary" onclick="doAddOrgAdmin()">Create SuperAdmin for this church</button>
      <div id="adminResult"></div>
    </div>
    <div class="card">
      <h3 style="margin-top:0">Recover a locked-out SuperAdmin</h3>
      <p class="muted">Deliberately narrow: finds a SuperAdmin by their mobile number to reset their password or re-enable their account — nothing else about their church is visible here. A locked-out Admin or Seller is recovered by their own church's SuperAdmin instead.</p>
      <label>Their mobile number</label>
      <input id="recoverMobile" type="tel" placeholder="07…">
      <button class="secondary" onclick="doFindSuperadmin()">Find</button>
      <div id="recoverResult"></div>
    </div>
  `;
}
let foundSuperadmin = null;
async function doFindSuperadmin() {
  const resEl = document.getElementById('recoverResult');
  foundSuperadmin = null;
  try {
    const { user } = await call('platform_find_user', { mobile: document.getElementById('recoverMobile').value });
    foundSuperadmin = user;
    resEl.innerHTML = `
      <div class="info" style="margin-top:10px">
        <b>${esc(user.name)}</b> — ${esc(user.org_name)}<br>
        <span class="badge ${user.active?'ok':'bad'}">${user.active?'Active':'Disabled'}</span>
      </div>
      <button class="small" style="margin-top:8px" onclick="doResetSuperadminPassword()">Reset password</button>
      <button class="small" onclick="doToggleSuperadminActive()">${user.active?'Disable':'Enable'}</button>
    `;
  } catch (e) { resEl.innerHTML = `<div class="error" style="margin-top:10px">${esc(e.message)}</div>`; }
}
async function doResetSuperadminPassword() {
  if (!foundSuperadmin) return;
  const pw = prompt(`New password for ${foundSuperadmin.name} (8+ characters):`);
  if (!pw) return;
  try { await call('platform_reset_superadmin_password', { user_id: foundSuperadmin.id, new_password: pw }); alert('Password reset. Let them know their new password directly.'); }
  catch (e) { alert(e.message); }
}
async function doToggleSuperadminActive() {
  if (!foundSuperadmin) return;
  try { await call('platform_set_superadmin_active', { user_id: foundSuperadmin.id, active: !foundSuperadmin.active }); doFindSuperadmin(); }
  catch (e) { alert(e.message); }
}
async function doCreateOrg() {
  const resEl = document.getElementById('orgResult');
  try {
    await call('create_organization', { name: document.getElementById('orgName').value.trim() });
    renderPlatformOwner();
  } catch (e) { resEl.innerHTML = `<div class="error">${esc(e.message)}</div>`; }
}
async function doAddOrgAdmin() {
  const resEl = document.getElementById('adminResult');
  try {
    await call('create_user', {
      org_id: document.getElementById('orgForAdmin').value,
      role: 'superadmin',
      name: document.getElementById('adminName').value.trim(),
      mobile: document.getElementById('adminMobile').value.trim(),
      password: document.getElementById('adminPassword').value,
    });
    resEl.innerHTML = `<div class="info">SuperAdmin created for that church.</div>`;
  } catch (e) { resEl.innerHTML = `<div class="error">${esc(e.message)}</div>`; }
}

// ================= SELLER =================
let sellCounts = {}, selectedBlockId = null, startNumValue = '', buyerNameValue = '', ticketNumbers = [];
let pendingUndo = null, shareMenuOpenFor = null, tickHandle = null, linkPollHandle = null, activity = [];
let contactValue = '';

function currentCampaign() { return state.campaigns.find(c => c.id === state.lastCampaignId) || state.campaigns[0]; }
function tierSummary(c) { return c.tiers.map(t => `${t.name} £${Number(t.price).toFixed(2)}`).join(' · '); }

async function renderSeller() {
  // One round trip for everything this screen needs (campaigns, church details, this seller's
  // stats) — three calls in a row is slow on a weak signal. Nothing typed so far is lost if it
  // fails: the half-filled sale lives in variables, not on screen, so Retry just redraws it.
  let screen;
  try { screen = await call('sell_screen', { campaign_id: state.lastCampaignId || undefined }); }
  catch (e) {
    document.getElementById('app').innerHTML = `${state.user.role !== 'seller' ? `<button class="secondary" style="margin-bottom:14px" onclick="viewMode='admin'; render();">← Back to Admin</button>` : ''}
      <div class="card"><div class="error">${esc(e.message)}</div>
      <p class="muted">Nothing you've entered has been lost.</p>
      <button class="primary" onclick="renderSeller()">Try again</button></div>`;
    return;
  }
  const campaigns = screen.campaigns;
  state.campaigns = campaigns;
  state.lastCampaignId = screen.campaign_id;
  state.org = screen.organization;
  saveState();

  if (!campaigns.length) {
    const isAdminRole = state.user.role !== 'seller';
    document.getElementById('app').innerHTML = `${isAdminRole ? `<button class="secondary" style="margin-bottom:14px" onclick="viewMode='admin'; render();">← Back to Admin</button>` : ''}
      <div class="card"><div class="error">No campaign is active yet — ${isAdminRole ? 'create or activate one from the Campaigns tab in Admin.' : 'ask a SuperAdmin to create or activate one.'}</div></div>`;
    return;
  }
  const camp = currentCampaign();
  const stats = screen.stats;
  if (ticketNumbers.__campaignId !== camp.id) {
    sellCounts = Object.fromEntries(camp.tiers.map(t => [t.id, 0]));
    startNumValue = ''; buyerNameValue = ''; contactValue = '';
    selectedBlockId = camp.blocks[0] ? camp.blocks[0].id : null;
    ticketNumbers = []; ticketNumbers.__campaignId = camp.id;
  }
  if (!camp.blocks.find(b => b.id === selectedBlockId)) selectedBlockId = camp.blocks[0] ? camp.blocks[0].id : null;
  const block = camp.blocks.find(b => b.id === selectedBlockId);
  const isOnline = !!block && block.type === 'digital';
  // Picking a specific "lucky number" is reserved for the public buyer page (buy.html) — a
  // seller selling an online ticket in person always gets the next available number(s), same
  // as how a physical seller works through their stack in order.
  const autoMode = isOnline;

  // Laid out so a whole sale fits one phone screen with no scrolling: a one-line stats bar
  // (tap for the detail), steppers instead of a keypad for quantity, name + contact side by
  // side, and the three payment buttons in one row. Recent sales sit behind a slim bar.
  lastStats = stats;
  const multiCamp = campaigns.length > 1, multiBlock = camp.blocks.length > 1;
  document.getElementById('app').className = 'sell';
  document.getElementById('app').innerHTML = h`
    <div id="statsWrap"></div>
    <div class="card">
      ${(multiCamp || multiBlock) ? `<div class="selrow">
        ${multiCamp ? `<select id="campSelect" aria-label="Campaign" onchange="onCampaignChange(this.value)">
          ${campaigns.map(c => `<option value="${c.id}" ${c.id===camp.id?'selected':''}>${esc(c.name)}</option>`).join('')}
        </select>` : ''}
        ${multiBlock ? `<select id="blockSelect" aria-label="Selling from" onchange="onBlockChange(this.value)">
          ${camp.blocks.map(b => `<option value="${b.id}" ${b.id===block.id?'selected':''}>${esc(b.label)}${b.type==='digital'?' (Online)':''}</option>`).join('')}
        </select>` : ''}
      </div>` : ''}
      ${!multiCamp ? `<div class="saletitle">${esc(camp.name)}${isOnline ? ' <span class="muted">· Online</span>' : ''}</div>` : ''}

      ${camp.tiers.map(t => `
        <div class="qty-row">
          <span class="qty-label">${esc(t.name)} <span class="muted">£${Number(t.price).toFixed(2)}</span></span>
          <div class="stepper">
            <button type="button" aria-label="One fewer ${esc(t.name)}" onclick="bumpQty('${t.id}', -1)">−</button>
            <input type="number" min="0" inputmode="numeric" id="qty-${t.id}" aria-label="Number of ${esc(t.name)}" value="${sellCounts[t.id]||0}" oninput="sellCounts['${t.id}']=Number(this.value)||0; regenerateTicketNumbers();">
            <button type="button" aria-label="One more ${esc(t.name)}" onclick="bumpQty('${t.id}', 1)">+</button>
          </div>
        </div>`).join('')}

      ${autoMode ? '' : `<input type="text" class="compact" id="startNum" inputmode="numeric" aria-label="First ticket number" placeholder="First ticket number, e.g. ${block.range_start}" value="${esc(startNumValue)}" oninput="startNumValue=this.value; regenerateTicketNumbers()">`}

      <div id="ticketRows"></div>

      <div class="namecontact">
        <input id="buyerName" aria-label="Buyer name" placeholder="Buyer name" value="${esc(buyerNameValue)}" oninput="buyerNameValue=this.value">
        <input id="contactInput" aria-label="Buyer's mobile or email, needed for Pay by Link" placeholder="Mobile / email" value="${esc(contactValue)}" oninput="contactValue=this.value" autocomplete="off">
      </div>

      <div class="totalline"><span>Total</span><b id="totalDisplay">£0.00</b></div>
      <div class="pay3" id="paymentButtons">${paymentButtonsHtml()}</div>
      <div id="submitError"></div>
    </div>

    <div id="feed"></div>
  `;
  renderStats(); renderTicketRows(); updateTotal(); renderFeed();
}

// ---- Compact Sell screen helpers ----
let lastStats = null, statsOpen = false, feedOpen = false, sheetId = null, numbersOpen = false, ticketStatus = {};
// Whole pounds when there are no pence (£24), otherwise £24.50 — keeps the stats bar to one line.
function pounds(n) { n = Number(n) || 0; return '£' + (Math.abs(n - Math.round(n)) < 0.005 ? String(Math.round(n)) : n.toFixed(2)); }
function toggleStats() { statsOpen = !statsOpen; renderStats(); }
function toggleFeed() { feedOpen = !feedOpen; renderFeed(); }
function toggleNumbers() { numbersOpen = !numbersOpen; renderTicketRows(true); }
function closeSheet() { sheetId = null; renderSheet(); }
function bumpQty(tierId, d) {
  sellCounts[tierId] = Math.max(0, (sellCounts[tierId] || 0) + d);
  const el = document.getElementById('qty-' + tierId); if (el) el.value = sellCounts[tierId];
  regenerateTicketNumbers();
}
function renderStats() {
  const el = document.getElementById('statsWrap'); if (!el || !lastStats) return;
  const s = lastStats;
  el.innerHTML = `<button type="button" class="statsbar" onclick="toggleStats()">
      <span class="statsline"><b>${s.ticketsSoldCount}</b> sold · <b>${pounds(s.cashCollected)}</b> cash · <b>${pounds(s.cardTotal)}</b> card${s.linkPending > 0 ? ` · ⏳ ${pounds(s.linkPending)}` : ''}</span>
      <span>${statsOpen ? '▴' : '▾'}</span></button>
    ${statsOpen ? `<div class="card">
      <div class="stat"><span>Tickets sold by you</span><b>${s.ticketsSoldCount}</b></div>
      <div class="stat"><span>Cash collected</span><b>£${s.cashCollected.toFixed(2)}</b></div>
      <div class="stat"><span>· Reconciled</span><b>£${s.cashReconciled.toFixed(2)}</b></div>
      <div class="stat"><span>Card &amp; link paid</span><b>£${s.cardTotal.toFixed(2)}</b></div>
      <div class="stat"><span>Links awaiting payment</span><b>£${s.linkPending.toFixed(2)}</b></div>
    </div>` : ''}`;
}

function onCampaignChange(id) { state.lastCampaignId = id; saveState(); ticketNumbers = []; renderSeller(); }
function onBlockChange(id) { selectedBlockId = id; startNumValue = ''; ticketNumbers = []; ticketNumbers.__campaignId = currentCampaign().id; renderSeller(); }
// ---- Pay by Link: sending the link to the buyer's own mobile/email ----
// The contact is pre-filled as the recipient, so the seller just taps send in their own
// SMS/WhatsApp/Mail app; we record which channel was used and when.
function contactKind(v) { return String(v || '').includes('@') ? 'email' : 'phone'; }
function waNumber(v) { // WhatsApp wants international digits only; assume UK for a leading 0
  const d = String(v).replace(/[^\d+]/g, '');
  if (d.startsWith('+')) return d.slice(1);
  if (d.startsWith('00')) return d.slice(2);
  if (d.startsWith('0')) return '44' + d.slice(1);
  return d;
}
function linkShareHtml(paymentId, contact, message, subject) {
  const body = encodeURIComponent(message), subj = encodeURIComponent(subject);
  if (contactKind(contact) === 'email') {
    return `<div class="share-row"><a class="share-link" href="mailto:${encodeURIComponent(contact)}?subject=${subj}&body=${body}" onclick="logShared('${paymentId}','email')">✉️ Email ${esc(contact)}</a></div>`;
  }
  return `<div class="share-row">
    <a class="share-link" href="sms:${esc(contact)}?body=${body}" onclick="logShared('${paymentId}','sms')">📱 SMS</a>
    <a class="share-link" href="https://wa.me/${waNumber(contact)}?text=${body}" target="_blank" rel="noopener" onclick="logShared('${paymentId}','whatsapp')">💬 WhatsApp</a>
  </div>`;
}
// SumUp's hosted checkout is fixed at 30 minutes (not configurable), so every link message
// says so. What happens after expiry differs: a physical ticket stays with the buyer and the
// seller/church issues a fresh link; an online ticket's number is released for someone else.
// The line that ends every message and the public page: the church's saved thank-you (which says
// where the money goes). If a SuperAdmin ever blanks it, fall back to a plain thank-you by name.
function thankYou() {
  const o = state.org;
  return (o && o.thank_you_text) || (o && o.name ? 'Thank you for supporting ' + o.name + '.' : 'Thank you for your support!');
}
function churchName() { return (state.org && state.org.name) || 'St.Vincent De Paul Church'; }
function linkMessage(campaignName, amount, ticketNumbers, payUrl, isOnline) {
  const expiry = isOnline
    ? `This link is valid for 30 minutes — after that your ticket number is released and you would need to start again.`
    : `This link is valid for 30 minutes. If it expires, just ask us for a fresh link — your ticket is still yours.`;
  const after = isOnline
    ? `After you pay, tap the button on the payment page to come back — that's where you'll see and save your ticket.`
    : `After you pay, tap the button on the payment page to come back and save a digital receipt.`;
  return `Hello from ${churchName()} — please pay £${Number(amount).toFixed(2)} for your ${campaignName} ticket${ticketNumbers.length>1?'s':''} (no. ${ticketNumbers.join(', ')}):\n${payUrl}\n${expiry}\n${after}\n\n${thankYou()}`;
}
async function logShared(paymentId, channel) {
  try {
    await call('log_link_shared', { payment_id: paymentId, channel });
    const a = activity.find(x => x.paymentId === paymentId);
    if (a) { a.sharedVia = channel; a.sharedAt = new Date().toISOString(); setTimeout(renderFeed, 400); }
  } catch {}
}
// SumUp tells the server the moment a link is paid; this just keeps the seller's screen current.
function startLinkPoller() {
  if (linkPollHandle) return;
  linkPollHandle = setInterval(async () => {
    const waiting = activity.filter(a => a.method === 'link' && a.status === 'linkpending');
    if (!waiting.length) { clearInterval(linkPollHandle); linkPollHandle = null; return; }
    let changed = false;
    for (const a of waiting) {
      try {
        const { status } = await call('checkout_status', { payment_id: a.paymentId });
        if (status === 'paid') { a.status = 'linkpaid'; changed = true; }
        else if (status === 'failed' || status === 'void') { a.status = 'linkfailed'; changed = true; }
      } catch {}
    }
    if (changed) renderFeed();
  }, 8000);
}

function regenerateTicketNumbers() {
  const camp = currentCampaign();
  const block = camp.blocks.find(b => b.id === selectedBlockId);
  const order = camp.tiers.map(t => ({ id: t.id, count: sellCounts[t.id] || 0 }));
  const total = order.reduce((s, o) => s + o.count, 0);
  const seq = []; order.forEach(o => { for (let i=0;i<o.count;i++) seq.push(o.id); });

  if (block && block.type === 'digital') {
    ticketNumbers = total ? seq.map(tierId => ({ tierId, auto: true })) : [];
  } else {
    // Nothing is looked up until the first number has all its digits (a 10001–15000 series
    // means 5) — typing "1", "10", "100"… must not fire a request per keystroke per ticket.
    const startEl = document.getElementById('startNum');
    const raw = startEl ? startEl.value.trim() : '';
    const start = Number(raw);
    const complete = raw !== '' && !isNaN(start) && raw.length >= minDigits(block);
    startHint = (total && raw && !complete) ? `Type all ${minDigits(block)} digits and the numbers will be checked.` : '';
    ticketNumbers = (!total || !complete) ? [] : seq.map((tierId, i) => ({ value: String(start+i), tierId }));
  }
  ticketNumbers.__campaignId = camp.id;
  renderTicketRows(); updateTotal();
}

// How many digits a ticket number in this series has (its first number's length, e.g. 10001 → 5).
let startHint = '';
function minDigits(block) { return block ? String(block.range_start).length : 1; }

// keepStatus: just re-draw (e.g. opening the editor) without asking the server again.
function renderTicketRows(keepStatus) {
  const wrap = document.getElementById('ticketRows'); if (!wrap) return;
  const camp = currentCampaign();
  const block = camp.blocks.find(b => b.id === selectedBlockId);
  if (block && block.type === 'digital') {
    const byTier = {};
    ticketNumbers.forEach(tn => byTier[tn.tierId] = (byTier[tn.tierId]||0)+1);
    const chips = camp.tiers.filter(t => byTier[t.id]).map((t) => {
      const idx = camp.tiers.findIndex(x=>x.id===t.id);
      return `<span class="badge tier${idx%4}">${esc(t.name)} × ${byTier[t.id]}</span>`;
    }).join('');
    wrap.innerHTML = chips
      ? `<div class="chips">${chips}<span class="muted">any available online number</span></div>`
      : `<div class="muted" style="margin-top:8px">Online numbers are assigned automatically.</div>`;
    return;
  }
  // Physical: the numbers show as a compact row of chips (with live availability). The full
  // per-ticket editor stays one tap away for tickets that aren't in sequence, and a problem
  // number is called out in red right under the chips.
  if (!keepStatus) ticketStatus = {};
  const rows = numbersOpen ? ticketNumbers.map((tn, i) => {
    const tierIdx = camp.tiers.findIndex(t => t.id === tn.tierId);
    const tier = camp.tiers[tierIdx];
    return `<div class="ticket-row">
        <span class="badge tier${tierIdx%4}">${esc(tier.name)}</span>
        <input value="${esc(tn.value)}" inputmode="numeric" aria-label="Ticket number ${i + 1}" oninput="setTicketValue(${i}, this.value)">
      </div>
      <div id="tnStatus-${i}" style="font-size:12px;margin:-4px 0 8px 4px;color:var(--slate)"></div>`;
  }).join('') : '';
  wrap.innerHTML = `${startHint ? `<div class="muted" style="margin-top:8px">${esc(startHint)}</div>` : ''}<div class="chips" id="ticketChips"></div><div id="ticketErr"></div>${rows}`;
  if (keepStatus) {
    ticketNumbers.forEach((_, i) => {
      const st = ticketStatus[i], el = document.getElementById(`tnStatus-${i}`);
      if (st && el) { el.textContent = st.text; el.style.color = st.kind === 'ok' ? 'var(--good)' : st.kind === 'bad' ? 'var(--bad)' : 'var(--slate)'; }
    });
    renderChips();
  } else {
    renderChips();
    checkAllTickets();
  }
}

// One request for the whole run of numbers (not one per ticket). Only numbers that already have
// all their digits are asked about; anything edited meanwhile is left alone when the answer lands.
async function checkAllTickets() {
  const camp = currentCampaign();
  const need = minDigits(camp.blocks.find(b => b.id === selectedBlockId));
  const snapshot = ticketNumbers.map(t => String(t.value));
  const idxs = snapshot.map((_, i) => i).filter(i => snapshot[i].trim().length >= need && /^\d+$/.test(snapshot[i].trim()));
  if (!idxs.length) return;
  idxs.forEach(i => setTicketNumberStatus(i, '⋯ checking', 'var(--slate)'));
  const stillSame = (i) => ticketNumbers[i] && String(ticketNumbers[i].value) === snapshot[i];
  try {
    const { results } = await call('check_tickets', { campaign_id: camp.id, ticket_numbers: idxs.map(i => Number(snapshot[i])) });
    idxs.forEach((i, k) => {
      if (!stillSame(i)) return;
      const r = results[k];
      if (r && r.ok) setTicketNumberStatus(i, '✓ available', 'var(--good)');
      else setTicketNumberStatus(i, (r && r.error) || 'Could not check this number', 'var(--bad)');
    });
  } catch (e) {
    idxs.forEach(i => { if (stillSame(i)) setTicketNumberStatus(i, e.message, 'var(--bad)'); });
  }
}

function renderChips() {
  const el = document.getElementById('ticketChips'); if (!el) return;
  const camp = currentCampaign();
  const kindOf = (i) => (ticketStatus[i] && ticketStatus[i].kind) || '';
  const mark = (k) => k === 'ok' ? ' ✓' : k === 'bad' ? ' ✗' : '';
  let chips;
  if (ticketNumbers.length > 6) {
    // A long run collapses to "first … last (N)", coloured by its worst status.
    const kinds = ticketNumbers.map((_, i) => kindOf(i));
    const worst = kinds.includes('bad') ? 'bad' : (kinds.every(k => k === 'ok') ? 'ok' : '');
    chips = `<span class="chip ${worst}">${esc(ticketNumbers[0].value)} … ${esc(ticketNumbers[ticketNumbers.length - 1].value)} (${ticketNumbers.length})${mark(worst)}</span>`;
  } else {
    chips = ticketNumbers.map((tn, i) => `<span class="chip ${kindOf(i)}">${esc(tn.value)}${mark(kindOf(i))}</span>`).join('');
  }
  el.innerHTML = chips + (ticketNumbers.length ? `<button type="button" class="link" onclick="toggleNumbers()">${numbersOpen ? 'Hide editor' : 'Edit numbers'}</button>` : '');
  const badIdx = ticketNumbers.findIndex((_, i) => kindOf(i) === 'bad');
  const errEl = document.getElementById('ticketErr');
  if (errEl) errEl.innerHTML = badIdx >= 0 ? `<div class="error" style="margin:6px 0 0;padding:8px 10px;font-size:13px">${esc(ticketStatus[badIdx].text)}${numbersOpen ? '' : ' — tap “Edit numbers” to fix it.'}</div>` : '';
}

const ticketCheckTimers = {};
function setTicketValue(i, v) {
  ticketNumbers[i].value = v;
  setTicketNumberStatus(i, '');
  clearTimeout(ticketCheckTimers[i]);
  // Only look a number up once it has all its digits — an edit in progress isn't checked.
  if (String(v).trim().length < minDigits(currentCampaign().blocks.find(b => b.id === selectedBlockId))) return;
  ticketCheckTimers[i] = setTimeout(() => checkTicketLive(i, v), 350);
}
async function checkTicketLive(i, v) {
  if (!v || String(v).trim() === '') return;
  const camp = currentCampaign();
  if (String(v).trim().length < minDigits(camp.blocks.find(b => b.id === selectedBlockId))) return;
  setTicketNumberStatus(i, '⋯ checking', 'var(--slate)');
  try {
    await call('check_ticket', { campaign_id: camp.id, ticket_number: Number(v) });
    if (String(ticketNumbers[i] && ticketNumbers[i].value) !== String(v)) return;
    setTicketNumberStatus(i, '✓ available', 'var(--good)');
  } catch (e) {
    if (String(ticketNumbers[i] && ticketNumbers[i].value) !== String(v)) return;
    setTicketNumberStatus(i, e.message, 'var(--bad)');
  }
}
function setTicketNumberStatus(i, text, color) {
  const kind = color === 'var(--good)' ? 'ok' : color === 'var(--bad)' ? 'bad' : '';
  ticketStatus[i] = { text, kind };
  const el = document.getElementById(`tnStatus-${i}`);
  if (el) { el.textContent = text; el.style.color = color || 'var(--slate)'; }
  renderChips();
}

function updateTotal() {
  const camp = currentCampaign();
  const el = document.getElementById('totalDisplay'); if (!el) return;
  const total = camp.tiers.reduce((s, t) => s + (sellCounts[t.id]||0) * Number(t.price), 0);
  el.textContent = `£${total.toFixed(2)}`;
}

// Three ways to pay, for physical AND online tickets alike: Cash, Pay at Machine (tapped on
// the POS machine, seller logs it), Pay by Link (a per-sale SumUp link sent to the buyer).
// Cash/Machine work the same for an online lucky number as for a physical ticket — the seller
// is standing there vouching for it either way. Link-only would be a rule for an unattended
// sale with no seller present (e.g. a future public buyer page), not for "online" as such.
// Undo lives on whichever of Cash/Machine was just tapped — a link, once created, can't be undone.
function paymentButtonsHtml() {
  const camp = currentCampaign();
  const scoped = pendingUndo && camp && pendingUndo.campaignId === camp.id;
  const a = scoped ? activity.find(x => x.id === pendingUndo.activityId) : null;
  const remaining = a ? a.remaining : 0;
  const cashPending = scoped && pendingUndo.method === 'cash';
  const machinePending = scoped && pendingUndo.method === 'machine';
  const busy = saleInFlight; // a sale is being recorded right now — lock all three so nothing double-fires
  const linkBtn = `<button style="background:var(--tier-c)" title="Pay by Link — a payment link is sent to the buyer" ${scoped || busy ? 'disabled' : ''} onclick="submitSale('link')">Link</button>`;
  return `
    <button style="${cashPending?'background:var(--ink)':'background:var(--good)'}" title="Cash taken" ${(scoped && !cashPending) || busy ? 'disabled' : ''} onclick="${cashPending?`doUndo(${pendingUndo.activityId})`:`submitSale('cash')`}">
      ${cashPending ? `Undo (${remaining}s)` : 'Cash'}
    </button>
    <button style="${machinePending?'background:var(--ink)':'background:var(--slate)'}" title="Pay at Machine — paid on the card machine, you're logging it" ${(scoped && !machinePending) || busy ? 'disabled' : ''} onclick="${machinePending?`doUndo(${pendingUndo.activityId})`:`submitSale('machine')`}">
      ${machinePending ? `Undo (${remaining}s)` : 'Machine'}
    </button>
    ${linkBtn}`;
}
function updatePaymentButtons() { const el = document.getElementById('paymentButtons'); if (el) el.innerHTML = paymentButtonsHtml(); }

let saleInFlight = false, saleAttempt = null;
function newClientRef() {
  return (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 12);
}
async function submitSale(method) {
  const camp = currentCampaign();
  const block = camp.blocks.find(b => b.id === selectedBlockId);
  const autoMode = block && block.type === 'digital';
  const errEl = document.getElementById('submitError');
  if (!ticketNumbers.length) { errEl.innerHTML = `<div class="error">Enter at least one ticket count first.</div>`; return; }
  if (!autoMode) {
    const need = minDigits(block);
    if (ticketNumbers.some(tn => String(tn.value).trim().length < need)) {
      errEl.innerHTML = `<div class="error">Ticket numbers in this series have ${need} digits — one of them looks incomplete.</div>`; return;
    }
    const statuses = ticketNumbers.map((tn,i)=>(ticketStatus[i] && ticketStatus[i].text) || '');
    if (statuses.some(s => s.includes('already') || s.includes("doesn't exist"))) {
      errEl.innerHTML = `<div class="error">Fix the flagged ticket number(s) before recording this sale.</div>`; return;
    }
  }
  if (method === 'link' && !contactValue.trim()) {
    errEl.innerHTML = `<div class="error">Enter the buyer's mobile number or email first — that's where the payment link goes, and how we tie the ticket to them.</div>`; return;
  }
  if (!buyerNameValue.trim()) { errEl.innerHTML = `<div class="error">Enter the buyer's name first.</div>`; return; }
  if (saleInFlight) return; // a second tap while the first is still going must do nothing
  errEl.innerHTML = '';
  const tier_counts = Object.fromEntries(camp.tiers.map(t => [t.id, sellCounts[t.id]||0]));
  const draft = { sellCounts: {...sellCounts}, startNumValue, buyerNameValue, contactValue, selectedBlockId, ticketNumbers: ticketNumbers.map(t=>({...t})) };

  // Retry-safe: the same sale details reuse the same reference, so if a reply was lost on a weak
  // signal and the seller taps again, the server hands back the ORIGINAL sale instead of making
  // a second one. Changing anything about the sale starts a fresh reference.
  const sig = JSON.stringify([camp.id, tier_counts, autoMode ? selectedBlockId : ticketNumbers.map(t => t.value), method, buyerNameValue, method === 'link' ? contactValue : '']);
  if (!saleAttempt || saleAttempt.sig !== sig) saleAttempt = { sig, ref: newClientRef() };
  saleInFlight = true; updatePaymentButtons();
  errEl.innerHTML = `<div class="hint">Recording the sale…</div>`;

  try {
    const data = await call('record_sale', {
      campaign_id: camp.id, tier_counts,
      ticket_numbers: autoMode ? undefined : ticketNumbers.map(t => t.value),
      auto_assign_block_id: autoMode ? selectedBlockId : undefined,
      method, payer_name: buyerNameValue, contact_value: method === 'link' ? contactValue : undefined,
      client_ref: saleAttempt.ref,
    });
    saleAttempt = null;
    errEl.innerHTML = '';
    const newId = Date.now();
    const entry = {
      id: newId, paymentId: data.payment_id, campaignId: camp.id, method, amount: data.amount,
      buyerName: buyerNameValue, tickets: data.tickets, soldAt: new Date().toISOString(),
      status: 'undo', remaining: 8, draft,
    };
    if (method === 'link') {
      // Not undoable: the link exists now. Track it until SumUp says it's paid.
      Object.assign(entry, { status: 'linkpending', payUrl: data.pay_url, contact: data.contact_value, sharedVia: null });
      sheetId = newId; // pop the send buttons up over the form
    } else if (data.replayed) {
      // An earlier tap already recorded this sale (its reply just never arrived). The 15-second
      // undo window has long since passed, so don't offer an Undo that would be refused.
      entry.status = 'final';
    } else {
      pendingUndo = { activityId: newId, method, campaignId: camp.id };
    }
    activity.unshift(entry);

    sellCounts = Object.fromEntries(camp.tiers.map(t => [t.id, 0]));
    startNumValue = ''; buyerNameValue = ''; contactValue = '';
    ticketNumbers = []; ticketNumbers.__campaignId = camp.id;
    saleInFlight = false;
    renderSeller();
    if (method === 'link') startLinkPoller(); else if (entry.status === 'undo') startTicker();
  } catch (e) {
    saleInFlight = false; updatePaymentButtons();
    if (e.network) {
      // We don't know whether the server got it — keep the same reference so a retry can't double-sell.
      errEl.innerHTML = `<div class="error">${esc(e.message)} Nothing is lost — tap the same button again to retry; it can't sell twice.</div>`;
    } else {
      saleAttempt = null; // a real answer from the server: this attempt is finished, the next one is new
      errEl.innerHTML = `<div class="error">${esc(e.message)}</div>`;
    }
  }
}

async function doUndo(activityId) {
  const a = activity.find(x => x.id === activityId); if (!a) return;
  try {
    await call('undo_sale', { payment_id: a.paymentId });
  } catch (e) {
    // window closed server-side, or something else changed — surface it, keep the entry as-is
    document.getElementById('submitError').innerHTML = `<div class="error">${esc(e.message)}</div>`;
    return;
  }
  activity = activity.filter(x => x.id !== activityId);
  if (pendingUndo && pendingUndo.activityId === activityId) pendingUndo = null;

  if (a.campaignId === state.lastCampaignId && a.draft) {
    sellCounts = {...a.draft.sellCounts};
    startNumValue = a.draft.startNumValue;
    buyerNameValue = a.draft.buyerNameValue;
    contactValue = a.draft.contactValue || '';
    selectedBlockId = a.draft.selectedBlockId;
    ticketNumbers = a.draft.ticketNumbers.map(t=>({...t}));
    ticketNumbers.__campaignId = a.campaignId;
    renderSeller();
    const errEl = document.getElementById('submitError');
    if (errEl) errEl.innerHTML = `<div class="info">Sale restored — tap the correct payment method below.</div>`;
  } else {
    renderFeed(); updatePaymentButtons();
  }
}

function startTicker() {
  if (tickHandle) return;
  tickHandle = setInterval(() => {
    let anyPending = false;
    activity.forEach(a => { if (a.status === 'undo') { a.remaining -= 1; if (a.remaining <= 0) { a.status='final'; if (pendingUndo && pendingUndo.activityId===a.id) pendingUndo=null; } else anyPending = true; } });
    renderFeed(); updatePaymentButtons();
    if (!anyPending) { clearInterval(tickHandle); tickHandle = null; }
  }, 1000);
}

// Recent sales sit behind one slim bar so they never push the sale form off the screen. The
// bar itself flags anything that needs the seller (a link awaiting payment, or one expired).
function renderFeed() {
  const el = document.getElementById('feed'); if (!el) return;
  const camp = currentCampaign();
  const mine = activity.filter(a => a.campaignId === camp.id);
  if (!mine.length) { el.innerHTML = ''; renderSheet(); return; }
  const awaiting = mine.filter(a => a.method === 'link' && a.status === 'linkpending').length;
  const expired = mine.filter(a => a.method === 'link' && a.status === 'linkfailed').length;
  const bits = [`${mine.length} sale${mine.length === 1 ? '' : 's'} this session`];
  if (awaiting) bits.push(`⏳ ${awaiting} awaiting payment`);
  if (expired) bits.push(`⚠ ${expired} link expired`);
  el.innerHTML = `<button type="button" class="feedbar ${expired ? 'attn' : ''}" onclick="toggleFeed()"><span>${bits.join(' · ')}</span><span>${feedOpen ? '▴' : '▾'}</span></button>${feedOpen ? feedCardsHtml(mine) : ''}`;
  renderSheet();
}

// After a Pay-by-Link sale the send buttons pop up over the form, so the seller can send the
// link straight away without scrolling to find it in the list.
function renderSheet() {
  let el = document.getElementById('sheet');
  const a = sheetId && activity.find(x => x.id === sheetId && x.status === 'linkpending');
  if (!a || !document.getElementById('feed')) { if (el) el.remove(); if (!a) sheetId = null; return; }
  const camp = state.campaigns.find(c => c.id === a.campaignId) || currentCampaign();
  const isOnline = (camp.blocks.find(b => b.id === (a.draft && a.draft.selectedBlockId)) || {}).type === 'digital';
  const nums = a.tickets.map(t => t.display_number || t.ticket_number);
  const sent = a.sharedVia ? `✓ Sent by ${{sms:'SMS',whatsapp:'WhatsApp',email:'Email'}[a.sharedVia]}` : `Not sent yet`;
  if (!el) { el = document.createElement('div'); el.id = 'sheet'; el.className = 'sheet'; document.body.appendChild(el); }
  el.innerHTML = `<div style="font-weight:700;font-size:16px">Send the payment link to ${esc(a.buyerName)}</div>
    <div class="muted" style="margin:2px 0 12px">£${a.amount.toFixed(2)} · ${nums.length} ticket${nums.length>1?'s':''} · ${esc(a.contact)} · ${sent}</div>
    ${linkShareHtml(a.paymentId, a.contact, linkMessage(camp.name, a.amount, nums, a.payUrl, isOnline), camp.name + ' — payment link')}
    <button type="button" class="secondary" onclick="closeSheet()">Done</button>`;
}

function feedCardsHtml(mine) {
  return mine.map(a => {
    const label = `${a.tickets.length} ticket${a.tickets.length>1?'s':''} (${a.tickets.map(t=>t.display_number||t.ticket_number).join(', ')})`;
    const when = new Date(a.soldAt).toLocaleString('en-GB', {day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
    if (a.method === 'link') {
      const nums = a.tickets.map(t => t.display_number || t.ticket_number);
      const sentLine = a.sharedVia
        ? `Sent by ${{sms:'SMS',whatsapp:'WhatsApp',email:'Email'}[a.sharedVia]} to ${esc(a.contact)} at ${new Date(a.sharedAt).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}`
        : `Not sent yet — tap a button below to send it to ${esc(a.contact)}`;
      if (a.status === 'linkpaid') return `<div class="card">
        <div class="info">✓ Paid — £${a.amount.toFixed(2)} for ${label} (${esc(a.buyerName)}, ${esc(a.contact)}). SumUp confirmed it.</div>
        <div style="font-size:11px;color:var(--slate);margin-top:4px">${sentLine} · Sold ${when}</div>
        <div style="margin-top:9px"><button class="link" onclick="toggleShareMenu(${a.id})">📤 Share ticket</button></div>
        ${shareMenuOpenFor===a.id ? shareMenuHtml(a) : ''}
      </div>`;
      const failed = a.status === 'linkfailed';
      return `<div class="card">
        <div class="${failed ? 'error' : 'hint'}" style="margin-top:0">${failed ? 'Link expired or failed' : '⏳ Awaiting payment'} — £${a.amount.toFixed(2)} for ${label}, ${esc(a.buyerName)}</div>
        <div style="font-size:12px;color:var(--slate);margin:6px 0">${sentLine}</div>
        ${failed ? (((currentCampaign().blocks.find(b => b.id === (a.draft && a.draft.selectedBlockId)) || {}).type === 'digital')
          ? `<div class="muted">This online ticket number has been released. Start a new sale for ${esc(a.buyerName)} if they still want it.</div>`
          : `<div class="muted">The ticket stays with ${esc(a.buyerName)}. If they still want to pay, make them a fresh link.</div>
             <button class="small" style="margin-top:8px" ${a.resending ? 'disabled' : ''} onclick="doSellerResend(${a.id})">${a.resending ? 'Please wait…' : 'Create a fresh link'}</button>
             ${a.resendError ? `<div class="error" style="margin-top:8px">${esc(a.resendError)}</div>` : ''}`) : `
        ${linkShareHtml(a.paymentId, a.contact, linkMessage(currentCampaign().name, a.amount, nums, a.payUrl, (currentCampaign().blocks.find(b => b.id === (a.draft && a.draft.selectedBlockId)) || {}).type === 'digital'), currentCampaign().name + ' — payment link')}`}
      </div>`;
    }
    if (a.status === 'undo') return `<div class="card">${label} for ${esc(a.buyerName||'(no name given)')} — ${a.method==='cash'?'Cash':'Machine'} £${a.amount.toFixed(2)} — logging… <span class="muted">(Undo is on the button above)</span></div>`;
    return `<div class="card">
      <div class="info">£${a.amount.toFixed(2)} ${a.method==='cash'?'cash':'paid at machine'} recorded for ${label} (${esc(a.buyerName||'no name given')}).</div>
      <div style="font-size:11px;color:var(--slate);margin-top:4px">Sold ${when}</div>
      <div style="margin-top:9px">
        <button class="link" onclick="toggleShareMenu(${a.id})">📤 Share ticket</button>
      </div>
      ${shareMenuOpenFor===a.id ? shareMenuHtml(a) : ''}
    </div>`;
  }).join('');
}

// A seller may issue a fresh link for their own PHYSICAL sale once the old link is dead. The
// server re-checks with SumUp first and refuses if it was actually paid or is still live, so
// this can never leave two payable links behind.
async function doSellerResend(activityId) {
  const a = activity.find(x => x.id === activityId); if (!a || a.resending) return;
  a.resending = true; a.resendError = null; renderFeed();
  try {
    const r = await call('resend_payment', { payment_id: a.paymentId });
    Object.assign(a, { status: 'linkpending', payUrl: r.pay_url, sharedVia: null, sharedAt: null });
    sheetId = a.id;
    startLinkPoller();
  } catch (e) { a.resendError = e.message; }
  a.resending = false; renderFeed();
}

function toggleShareMenu(id) { shareMenuOpenFor = shareMenuOpenFor === id ? null : id; renderFeed(); }
// Replicates the physical ticket's own content — church name/address, campaign-specific
// details (prizes, draw date, tagline, whatever the SuperAdmin wrote for THIS campaign — see
// campaigns.details_text), tier breakdown, ticket number(s), price, buyer, sale date/time.
function shareMessageFor(a) {
  const camp = state.campaigns.find(c => c.id === a.campaignId);
  const byTier = {};
  a.tickets.forEach(t => byTier[t.tier_name] = (byTier[t.tier_name]||0)+1);
  const denom = Object.entries(byTier).map(([name,n]) => `${n} x ${name}`).join(', ');
  const numbers = a.tickets.map(t => t.display_number || t.ticket_number).join(', ');
  const when = new Date(a.soldAt).toLocaleString('en-GB', {day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
  const lines = [];
  if (state.org && state.org.name) lines.push(state.org.name);
  if (state.org && state.org.address) lines.push(state.org.address);
  lines.push('', `🎟️ ${camp.name} — Ticket No. ${numbers}`, '');
  if (camp.details_text) { lines.push(camp.details_text, ''); }
  lines.push(`${a.tickets.length} ticket${a.tickets.length>1?'s':''}: ${denom}`, `Total: £${a.amount.toFixed(2)}`, `Buyer: ${a.buyerName||'—'}`, `Sold: ${when}`, '');
  // A permanent link to view/save the ticket (or a digital receipt for a physical ticket) on any device.
  const online = (camp.blocks.find(b => b.id === (a.draft && a.draft.selectedBlockId)) || {}).type === 'digital';
  if (a.paymentId) lines.push(`${online ? 'View or save your ticket any time' : 'Digital receipt (keep your physical ticket too)'}:`, `${location.origin}/ticket.html?payment_id=${a.paymentId}`, '');
  lines.push(thankYou());
  return lines.join('\n');
}
// Reused for both a Cash/Machine sale (no known contact — three generic buttons) and a paid
// Pay by Link sale (contact already on file, so it's pre-filled — but not tracked via
// logShared, which is specifically for the payment-request send, not this confirmation).
function shareMenuHtml(a) {
  const body = encodeURIComponent(shareMessageFor(a));
  const camp = state.campaigns.find(c => c.id === a.campaignId);
  const subject = encodeURIComponent(`${camp.name} — your ticket`);
  if (a.contact) {
    return `<div style="background:var(--brass-dim);border:1px dashed var(--line);border-radius:10px;padding:10px;margin-top:8px">
      <div style="font-size:11.5px;color:var(--slate);margin-bottom:8px">Send this ticket by:</div>
      ${contactKind(a.contact)==='email'
        ? `<div class="share-row"><a class="share-link" href="mailto:${encodeURIComponent(a.contact)}?subject=${subject}&body=${body}">✉️ Email ${esc(a.contact)}</a></div>`
        : `<div class="share-row">
            <a class="share-link" href="sms:${esc(a.contact)}?body=${body}">📱 SMS</a>
            <a class="share-link" href="https://wa.me/${waNumber(a.contact)}?text=${body}" target="_blank" rel="noopener">💬 WhatsApp</a>
          </div>`}
    </div>`;
  }
  return `<div style="background:var(--brass-dim);border:1px dashed var(--line);border-radius:10px;padding:10px;margin-top:8px">
    <div style="font-size:11.5px;color:var(--slate);margin-bottom:8px">Send this ticket by:</div>
    <div class="share-row">
      <a class="share-link" href="sms:?body=${body}">📱 SMS</a>
      <a class="share-link" href="https://wa.me/?text=${body}" target="_blank" rel="noopener">💬 WhatsApp</a>
      <a class="share-link" href="mailto:?subject=${subject}&body=${body}">✉️ Email</a>
    </div>
  </div>`;
}

    <div style="flex:1 1 100px"><label>${i===0?'Label':''}</label><input value="${esc(b.label)}" placeholder="${isDigital?'e.g. Online':'e.g. Main'}" oninput="draftBlocks[${i}].label=this.value"></div>
    <div style="flex:1 1 80px"><label>${i===0?'Start #':''}</label><input type="number" value="${b.range_start}" oninput="draftBlocks[${i}].range_start=this.value"></div>
    <div style="flex:1 1 80px"><label>${i===0?'End #':''}</label><input type="number" value="${b.range_end}" oninput="draftBlocks[${i}].range_end=this.value"></div>
    ${isDigital ? `<div style="flex:1 1 90px"><label>${i===0?'Prefix':''}</label><input value="${esc(b.number_prefix||'')}" placeholder="e.g. O" maxlength="6" oninput="draftBlocks[${i}].number_prefix=this.value"></div>` : ''}
    <button class="icon-x" onclick="removeBlockRow(${i})" ${draftBlocks.length<=1?'style="visibility:hidden"':''}>✕</button>
  </div>
  ${isDigital ? `<div class="hint" style="margin:-2px 0 8px">Buyers can pick a specific number in this range ("lucky number") or get any available one — both live-checked, same as physical.</div>` : ''}`;
}
function setBlockType(i,type) { draftBlocks[i].type = type; renderCampaignsTab(); }
function addTierRow() { draftTiers.push({name:'',price:''}); renderCampaignsTab(); }
function removeTierRow(i) { if (draftTiers.length<=1) return; draftTiers.splice(i,1); renderCampaignsTab(); }
function addBlockRow() { draftBlocks.push({type:'physical', label:'', range_start:'', range_end:'', number_prefix:''}); renderCampaignsTab(); }
function removeBlockRow(i) { if (draftBlocks.length<=1) return; draftBlocks.splice(i,1); renderCampaignsTab(); }

async function createCampaign() {
  const resEl = document.getElementById('createResult');
  try {
    const tiers = draftTiers.filter(t=>t.name.trim()!=='' && t.price!=='').map(t=>({name:t.name.trim(), price:Number(t.price)}));
    const blocks = draftBlocks.filter(b=>b.range_start!=='' && b.range_end!=='').map(b => ({
      type:b.type, label:b.label.trim()||(b.type==='digital'?'Online':'Main'),
      range_start:Number(b.range_start), range_end:Number(b.range_end),
      number_prefix: b.type==='digital' ? (b.number_prefix||'').trim() : '',
    }));
    await call('create_campaign', { name: document.getElementById('cName').value.trim(), tiers, blocks, details_text: document.getElementById('cDetails').value }, 60000);
    draftTiers = [{name:'',price:''},{name:'',price:''}];
    draftBlocks = [{type:'physical', label:'', range_start:'', range_end:'', number_prefix:''}];
    renderCampaignsTab();
  } catch (e) { resEl.innerHTML = `<div class="error">${esc(e.message)}</div>`; }
}
async function doAddSeries() {
  const resEl = document.getElementById('addSeriesResult');
  const campaignSel = document.getElementById('asCampaign');
  const campaignName = campaignSel.options[campaignSel.selectedIndex].text;
  try {
    const { block } = await call('add_block_to_campaign', {
      campaign_id: campaignSel.value,
      type: document.getElementById('asType').value,
      label: document.getElementById('asLabel').value,
      range_start: document.getElementById('asStart').value,
      range_end: document.getElementById('asEnd').value,
      number_prefix: document.getElementById('asPrefix').value,
    }, 60000);
    await renderCampaignsTab();
    document.getElementById('addSeriesResult').innerHTML = `<div class="info">Added "${esc(block.label)}" (${esc(block.number_prefix||'')}${block.range_start}–${esc(block.number_prefix||'')}${block.range_end}) to ${esc(campaignName)}.</div>`;
  } catch (e) { resEl.innerHTML = `<div class="error">${esc(e.message)}</div>`; }
}
async function toggleCampaignActive(id, active) { try { await call('set_campaign_active', { campaign_id: id, active }); renderCampaignsTab(); } catch (e) { alert(e.message); } }
async function downloadCampaignReport(id) {
  try {
    const { csv, filename } = await call('export_campaign_report', { campaign_id: id }, 60000);
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
  } catch (e) { alert(e.message); }
}
async function doSumupCheck() {
  const resEl = document.getElementById('sumupCheckResult');
  resEl.innerHTML = `<div class="hint">Checking…</div>`;
  try {
    const r = await call('sumup_check');
    resEl.innerHTML = `<div class="${r.ok ? 'info' : 'error'}"><b>${r.ok ? '✓ Pay by Link is ready to use' : 'Pay by Link will not work yet'}</b>
      ${r.steps.map(s => `<div style="margin-top:4px">${s.ok ? '✓' : '✗'} ${esc(s.step)} — ${esc(s.detail)}</div>`).join('')}</div>`;
  } catch (e) { resEl.innerHTML = `<div class="error">${esc(e.message)}</div>`; }
}
async function doBinCampaign(id, name) {
  if (!confirm(`Move "${name}" to the Recycle Bin? Data is kept, not deleted.`)) return;
  try { await call('bin_campaign', { campaign_id: id }); renderCampaignsTab(); } catch (e) { alert(e.message); }
}

async function renderRecycleBinTab() {
  const { campaigns } = await call('list_binned_campaigns');
  const el = document.getElementById('adminContent');
  el.innerHTML = h`<div class="card"><h3 style="margin-top:0">Recycle Bin</h3>
    ${!campaigns.length ? '<p class="muted">Nothing in the bin.</p>' : `
    <table><tr><th>Name</th><th>Tiers</th><th></th></tr>
    ${campaigns.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(tierSummary(c))}</td>
      <td><button class="small" onclick="downloadCampaignReport('${c.id}')">Report</button>
      <button class="small" onclick="doRestoreCampaign('${c.id}')">Restore</button></td></tr>`).join('')}
    </table>`}
  </div>`;
}
async function doRestoreCampaign(id) { try { await call('restore_campaign', { campaign_id: id }); renderRecycleBinTab(); } catch (e) { alert(e.message); } }

// ---- Sales tab ----
async function renderSalesTab() {
  const { campaigns } = await call('list_campaigns');
  const { payments } = await call('list_recent_payments', { campaign_id: campaignFilter || undefined });
  const el = document.getElementById('adminContent');
  el.innerHTML = `<div class="card"><label>Viewing</label>
    <select onchange="campaignFilter=this.value; renderSalesTab();">
      <option value="">All Campaigns</option>
      ${campaigns.map(c=>`<option value="${c.id}" ${campaignFilter===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}
    </select></div>
    <div class="card"><h3 style="margin-top:0">Recent Sales</h3><table>
    <tr><th>Tickets</th><th>Buyer</th><th>Seller</th><th>Amt</th><th>Method</th><th>Status</th><th></th></tr>
    ${payments.map(p=>`<tr>
      <td>${p.tickets.join(' · ')}</td>
      <td>${esc(p.payer_name||'—')}${p.contact_value ? `<br><span class="muted">${esc(p.contact_value)}${p.contact_channel ? ' · via ' + p.contact_channel : ''}</span>` : ''}</td>
      <td>${esc(p.seller)}</td><td>£${Number(p.amount).toFixed(2)}</td><td>${{cash:'Cash',machine:'Machine',link:'Link'}[p.method]||p.method}</td>
      <td><span class="badge ${p.status==='paid'?'ok':p.status==='pending'?'warn':'bad'}">${p.status==='pending' ? (p.method==='link' ? 'awaiting payment' : p.method==='cash' ? 'cash to reconcile' : 'pending') : p.status==='failed' ? 'link expired' : p.status}</span></td>
      <td>${p.status!=='void' && !(p.method==='link' && p.status==='paid') ? `<button class="small" onclick="doVoid('${p.id}')">Void</button>` : ''}</td>
    </tr>`).join('')}
    </table></div>`;
}
async function doVoid(paymentId) {
  const reason = prompt('Reason for voiding this sale? (An unpaid payment link is cancelled too. A payment SumUp has already received can\'t be voided here.)');
  if (!reason) return;
  try { await call('void_sale', { payment_id: paymentId, reason }); renderSalesTab(); } catch (e) { alert(e.message); }
}

// ---- Cash Recon tab ----
async function renderCashTab() {
  const { campaigns } = await call('list_campaigns');
  const { users } = await call('list_users');
  const sellers = users.filter(u => u.active); // anyone active can have cash to reconcile
  const el = document.getElementById('adminContent');
  el.innerHTML = `<div class="card"><h3 style="margin-top:0">Cash Reconciliation</h3>
    <label>Campaign</label><select id="reconCampaign">${campaigns.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select>
    <label>Seller</label><select id="reconSeller">${sellers.map(u=>`<option value="${u.id}">${esc(u.name)}</option>`).join('')}</select>
    <label>Cash amount handed over (£)</label><input id="reconAmount" type="number" step="0.01">
    <button class="primary" onclick="doCashRecon()">Confirm & Reconcile</button>
    <div id="reconResult"></div>
  </div>`;
}
async function doCashRecon() {
  const resEl = document.getElementById('reconResult');
  try {
    const data = await call('cash_recon', {
      seller_id: document.getElementById('reconSeller').value,
      campaign_id: document.getElementById('reconCampaign').value,
      amount_received: Number(document.getElementById('reconAmount').value),
    });
    let msg = `Matched ${data.matched_count} sale(s) totalling £${data.matched_amount.toFixed(2)}.`;
    if (data.surplus > 0) msg += `<br><b style="color:var(--warn)">£${data.surplus.toFixed(2)} surplus — everything's matched, this is extra. Check with seller.</b>`;
    if (data.shortfall > 0) msg += `<br><b style="color:var(--bad)">£${data.shortfall.toFixed(2)} short of the next pending sale — nothing more confirmed until the rest is handed over.</b>`;
    if (data.still_pending.length) msg += `<br>${data.still_pending.length} sale(s) still pending for this seller.`;
    resEl.innerHTML = `<div class="info">${msg}</div>`;
  } catch (e) { resEl.innerHTML = `<div class="error">${esc(e.message)}</div>`; }
}

// ---- Needs Attention tab: Pay-by-Link sales not yet paid (or whose link expired) ----
// Each row shows who the link was sent to, so an unpaid handed-over ticket can be chased.
async function renderAttentionTab() {
  if (!state.org) { try { state.org = (await call('get_org_settings')).organization; } catch {} } // for the church name + thank-you in reminders
  const { payments } = await call('list_incomplete_payments', { campaign_id: campaignFilter || undefined });
  const el = document.getElementById('adminContent');
  el.innerHTML = `<div class="card"><h3 style="margin-top:0">Needs Attention</h3>
    <p class="muted">Pay-by-Link sales that haven't been paid. The ticket is with the buyer — chase them on the contact below, or issue a fresh link if it expired.</p>
    ${!payments.length ? '<p class="muted">Nothing needs attention.</p>' : payments.map(p => {
      const msg = `Hello from ${churchName()} — a reminder to please pay £${Number(p.amount).toFixed(2)} for your tickets (${p.tickets.join(' · ')}):\n${p.link_url}\nThis link is valid for 30 minutes from when it was sent — if it has expired, just ask us for a fresh one.\n\n${thankYou()}`;
      const sent = p.link_shared_at ? `Sent via ${p.contact_channel} on ${new Date(p.link_shared_at).toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}` : 'Not recorded as sent';
      return `<div style="border-top:1px solid var(--line);padding:12px 0">
        <div style="display:flex;justify-content:space-between;gap:8px"><b>${esc(p.payer_name||'(name removed)')}</b>
          <span class="badge ${p.status==='failed'?'bad':'warn'}">${p.status==='failed'?'link expired':'awaiting payment'}</span></div>
        <div class="muted">${esc(p.contact_value||'(contact removed)')} · £${Number(p.amount).toFixed(2)} · tickets ${p.tickets.join(' · ')} · seller ${esc(p.seller)}</div>
        <div class="muted">${sent}${p.resend_count ? ` · resent ${p.resend_count}×` : ''}</div>
        ${p.status==='pending' && p.link_url && p.contact_value ? `<div style="margin-top:8px">${linkShareHtml(p.id, p.contact_value, msg, 'Payment link')}</div>` : ''}
        <div style="margin-top:8px"><button class="small" onclick="doResend('${p.id}')">${p.status==='failed' ? 'Create a fresh link' : 'Replace link'}</button></div>
      </div>`;
    }).join('')}
  </div>`;
}
async function doResend(paymentId) {
  try { await call('resend_payment', { payment_id: paymentId }); renderAttentionTab(); }
  catch (e) { alert(e.message); }
}

// ---- Users tab (SuperAdmin only) ----
async function renderUsersTab() {
  const { users } = await call('list_users');
  const { campaigns } = await call('list_campaigns', { include_inactive: true });
  const el = document.getElementById('adminContent');
  el.innerHTML = `<div class="card"><h3 style="margin-top:0">Users</h3>
    <table><tr><th>Name</th><th>Mobile</th><th>Role</th><th>Status</th><th></th></tr>
    ${users.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.mobile)}</td><td>${u.role}</td>
      <td><span class="badge ${u.active?'ok':'bad'}">${u.active?'Active':'Disabled'}</span></td>
      <td><button class="small" onclick="toggleUserActive('${u.id}', ${!u.active})">${u.active?'Disable':'Enable'}</button>
      <button class="small" onclick="doResetPassword('${u.id}')">Reset PW</button></td></tr>`).join('')}
    </table></div>
    <div class="card"><h3 style="margin-top:0">Add User</h3>
    <label>Name</label><input id="uName">
    <label>Mobile</label><input id="uMobile" type="tel">
    <label>Role</label><select id="uRole"><option value="seller">Seller</option><option value="admin">Admin</option><option value="superadmin">SuperAdmin</option></select>
    <label>Password (8+ characters)</label><input id="uPassword" type="password">
    <button class="primary" onclick="doCreateUser()">Create User</button>
    <div id="userResult"></div>
    </div>`;
}
async function doCreateUser() {
  const resEl = document.getElementById('userResult');
  try {
    await call('create_user', {
      name: document.getElementById('uName').value.trim(),
      mobile: document.getElementById('uMobile').value.trim(),
      role: document.getElementById('uRole').value,
      password: document.getElementById('uPassword').value,
    });
    renderUsersTab();
  } catch (e) { resEl.innerHTML = `<div class="error">${esc(e.message)}</div>`; }
}
async function toggleUserActive(id, active) { try { await call('set_user_active', { user_id: id, active }); renderUsersTab(); } catch (e) { alert(e.message); } }
async function doResetPassword(id) {
  const pw = prompt('New password (8+ characters):'); if (!pw) return;
  try { await call('reset_password', { user_id: id, new_password: pw }); alert('Password reset.'); } catch (e) { alert(e.message); }
}

// ---------- boot ----------
if (state.session) scheduleAutoLogout();
render();
// Lets the app open with no signal (see sw.js) — sales themselves always need the network.
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
</script>
