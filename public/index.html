<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parish Campaigns — St. Vincent De Paul Church, Osterley, London</title>
<style>
  :root {
    --ink: #1c1c1e; --paper: #fdfcf9; --line: #e4e0d8;
    --accent: #8a3b2b; --accent-dim: #f2e4de;
    --good: #3a6b4f; --warn: #b5651d; --bad: #a4342a;
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, Segoe UI, Roboto, sans-serif; background:var(--paper); color:var(--ink); }
  header { padding: 18px 20px; border-bottom: 1px solid var(--line); display:flex; justify-content:space-between; align-items:center; }
  header h1 { font-size: 17px; margin:0; }
  header button { background:none; border:1px solid var(--line); border-radius:8px; padding:8px 14px; font-size:14px; }
  main { max-width: 560px; margin: 0 auto; padding: 20px; }
  .card { background:white; border:1px solid var(--line); border-radius:14px; padding:20px; margin-bottom:16px; }
  label { display:block; font-size:13px; color:#555; margin: 12px 0 4px; }
  input, select { width:100%; padding:14px; font-size:16px; border:1px solid var(--line); border-radius:10px; }
  button.primary { width:100%; padding:16px; font-size:17px; font-weight:600; background:var(--accent); color:white; border:none; border-radius:12px; margin-top:16px; }
  button.secondary { width:100%; padding:14px; font-size:15px; background:var(--accent-dim); color:var(--accent); border:none; border-radius:12px; margin-top:8px; }
  button.small { padding:8px 12px; font-size:13px; border-radius:8px; border:1px solid var(--line); background:white; }
  .row { display:flex; gap:10px; align-items:center; }
  .ticket-row { display:flex; gap:8px; align-items:center; margin-bottom:8px; }
  .ticket-row input { flex:1; }
  .toggle { display:flex; border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .toggle button { flex:1; padding:12px; border:none; background:white; font-size:15px; }
  .toggle button.active[data-t="A"] { background:var(--accent); color:white; }
  .toggle button.active[data-t="C"] { background:var(--good); color:white; }
  .total { font-size:28px; font-weight:700; text-align:center; margin:16px 0; }
  .stat { display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--line); }
  .stat:last-child { border:none; }
  .badge { display:inline-block; padding:2px 10px; border-radius:20px; font-size:12px; font-weight:600; }
  .badge.ok { background:#e2efe6; color:var(--good); }
  .badge.warn { background:#fbead9; color:var(--warn); }
  .badge.bad { background:#f6dedb; color:var(--bad); }
  .tabs { display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap; }
  .tabs button { flex:1; padding:10px; border:1px solid var(--line); background:white; border-radius:10px; font-size:13px; }
  .tabs button.active { background:var(--ink); color:white; border-color:var(--ink); }
  .error { background:#f6dedb; color:var(--bad); padding:12px; border-radius:10px; margin:10px 0; font-size:14px; }
  .info { background:#e2efe6; color:var(--good); padding:12px; border-radius:10px; margin:10px 0; font-size:14px; }
  .muted { color:#888; font-size:13px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  td, th { padding:8px 4px; border-bottom:1px solid var(--line); text-align:left; }
  .qr-wrap { text-align:center; }
  .qr-wrap img { border:8px solid white; border-radius:12px; box-shadow:0 2px 12px rgba(0,0,0,0.1); }
  #app { padding-bottom: 60px; }
</style>
</head>
<body>
<header>
  <h1>⛪ Parish Campaigns</h1>
  <div id="headerRight"></div>
</header>
<main id="app"></main>

<script>
const API = '/api/';
let state = { session: null, user: null, series: [] };
try {
  const saved = localStorage.getItem('bbq_session');
  if (saved) state = JSON.parse(saved);
} catch {}

function saveState() { localStorage.setItem('bbq_session', JSON.stringify(state)); }
function logout() { clearTimeout(autoLogoutTimer); state = { session: null, user: null, series: [] }; saveState(); render(); }

// The session token isn't encrypted, just signed — safe to read its expiry client-side
// (we're not trusting it for auth, the server re-verifies the signature on every call).
let autoLogoutTimer = null;
function scheduleAutoLogout() {
  clearTimeout(autoLogoutTimer);
  if (!state.session) return;
  try {
    let b64 = state.session.split('.')[0].replace(/-/g, '+').replace(/_/g, '/');
    while (b64.length % 4) b64 += '='; // atob requires padding; base64url encoding omits it
    const payload = JSON.parse(atob(b64));
    const msLeft = payload.exp - Date.now();
    if (msLeft <= 0) { logout(); return; }
    autoLogoutTimer = setTimeout(() => { alert('Session expired after 2 hours — please log in again.'); logout(); }, msLeft);
  } catch { /* malformed token, let the next API call fail naturally */ }
}

async function call(action, body = {}) {
  const res = await fetch(API + action, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ session: state.session, ...body }),
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'Something went wrong');
  return data;
}

function h(strings, ...vals) { return strings.reduce((a, s, i) => a + s + (vals[i] ?? ''), ''); }

// ---------------- LOGIN ----------------
function renderLogin(err) {
  document.getElementById('headerRight').innerHTML = '';
  document.getElementById('app').innerHTML = h`
    <div class="card">
      <h2 style="margin-top:0">Log in</h2>
      ${err ? `<div class="error">${err}</div>` : ''}
      <label>Mobile number</label>
      <input id="mobile" type="tel" placeholder="07xxxxxxxxx" inputmode="numeric">
      <label>Password</label>
      <input id="password" type="password">
      <button class="primary" onclick="doLogin()">Log in</button>
    </div>
    <div class="card">
      <p class="muted">First time setting this up? Only works once, before any users exist.</p>
      <button class="secondary" onclick="showBootstrap()">First-time SuperAdmin setup</button>
    </div>
  `;
}
async function doLogin() {
  const mobile = document.getElementById('mobile').value.trim();
  const password = document.getElementById('password').value;
  try {
    const data = await call('login', { mobile, password });
    state.session = data.session; state.user = data.user;
    saveState();
    scheduleAutoLogout();
    render();
  } catch (e) { renderLogin(e.message); }
}
function showBootstrap() {
  document.getElementById('app').innerHTML = h`
    <div class="card">
      <h2 style="margin-top:0">First-time SuperAdmin Setup</h2>
      <p class="muted">Create the very first SuperAdmin account. This only works if no users exist yet.</p>
      <label>Your name</label><input id="bName">
      <label>Mobile number</label><input id="bMobile" type="tel">
      <label>Password (yours alone — keep it private)</label><input id="bPassword" type="password">
      <button class="primary" onclick="doBootstrap()">Create SuperAdmin</button>
      <button class="secondary" onclick="renderLogin()">Back to login</button>
    </div>`;
}
async function doBootstrap() {
  try {
    await call('bootstrap_superadmin', {
      name: document.getElementById('bName').value.trim(),
      mobile: document.getElementById('bMobile').value.trim(),
      password: document.getElementById('bPassword').value,
    });
    renderLogin('SuperAdmin created — please log in.');
  } catch (e) { alert(e.message); }
}

// ---------------- SELLER VIEW ----------------
let currentSeries = null;
let activity = []; // {id, ticketsLabel, method, status, amount, paymentId}
let activityCounter = 0;

function pickDefaultCampaign(series) {
  // Remembers the seller's last choice for the life of this login session (cleared on
  // logout/expiry, since it lives in the same localStorage blob as the session token).
  // Otherwise defaults to the earliest-created active campaign.
  if (state.lastCampaignId && series.some(s => s.id === state.lastCampaignId)) return state.lastCampaignId;
  return series.length ? series[0].id : null;
}

function statsBlockHtml(stats) {
  return `
    <div class="stat"><span>Total tickets sold</span><b>${stats.ticketsSoldCount}</b></div>
    <div class="stat"><span>Total cash collected</span><b>£${stats.cashCollected.toFixed(2)}</b></div>
    <div class="stat"><span>Total cash reconciled</span><b>£${stats.cashReconciled.toFixed(2)}</b></div>
    <div class="stat"><span>Total card payment</span><b>£${stats.cardTotal.toFixed(2)}</b></div>`;
}
async function refreshSellerStats() {
  const el = document.getElementById('sellerStatsBlock');
  if (!el || !currentSeries) return;
  const stats = await call('seller_state', { series_id: currentSeries });
  el.innerHTML = statsBlockHtml(stats);
}
function toggleQrPanel(show) {
  const panel = document.getElementById('qrPanelCard');
  if (panel) panel.style.display = show ? '' : 'none';
}

async function renderSeller() {
  document.getElementById('headerRight').innerHTML = `<button onclick="logout()">Log out (${state.user.name})</button>`;
  const { series } = await call('list_series');
  state.series = series;
  currentSeries = pickDefaultCampaign(series);
  const stats = currentSeries ? await call('seller_state', { series_id: currentSeries }) : { ticketsSoldCount: 0, cashCollected: 0, cashReconciled: 0, cardTotal: 0 };

  if (!series.length) {
    document.getElementById('app').innerHTML = `
      <div class="card">${statsBlockHtml(stats)}</div>
      <div class="card"><div class="error">No campaign is active yet — ask a SuperAdmin to create or activate one under the Campaigns tab.</div></div>`;
    return;
  }

  document.getElementById('app').innerHTML = h`
    <div class="card" id="sellerStatsBlock">${statsBlockHtml(stats)}</div>
    <div class="card">
      <h2 style="margin-top:0">New Sale</h2>
      <label>Campaign</label>
      <select id="seriesSelect" onchange="currentSeries=this.value; state.lastCampaignId=this.value; saveState(); updateTotal(); refreshSellerStats();">
        ${series.map(s => `<option value="${s.id}" ${s.id===currentSeries?'selected':''}>${s.name} (£${s.adult_price} adult / £${s.child_price} child)</option>`).join('')}
      </select>
      <div class="row" style="margin-top:14px">
        <div style="flex:1"><label>No. of Adult tickets</label><input id="adultCount" type="number" min="0" inputmode="numeric" value="0" oninput="regenerateTicketNumbers()"></div>
        <div style="flex:1"><label>No. of Child tickets</label><input id="childCount" type="number" min="0" inputmode="numeric" value="0" oninput="regenerateTicketNumbers()"></div>
      </div>
      <label>Starting ticket number <span class="muted">(rest fills in automatically — edit any that don't match)</span></label>
      <input id="startingNumberInput" inputmode="numeric" placeholder="e.g. 30001" oninput="regenerateTicketNumbers()">
      <div id="ticketNumberRows" style="margin-top:10px"></div>
      <div class="total" id="totalDisplay">£0.00</div>
      <label>Buyer name</label>
      <input id="payerNameInput" placeholder="e.g. Mary O'Brien">
      <button class="primary" style="background:var(--good)" onclick="submitSale('cash')">Record Cash Payment</button>
      <button class="primary" style="background:#555" onclick="submitSale('card_manual')">Card Paid on Reader / Link — Log It</button>
      <button class="secondary" onclick="toggleQrPanel(true)">Show QR to Buyer</button>
    </div>
    <div id="qrPanelCard" class="card qr-wrap" style="display:none">
      <p>Ask the buyer to scan this to pay.</p>
      <img src="assets/payment-qr.png" alt="Scan to pay" style="max-width:220px">
      <button class="secondary" onclick="toggleQrPanel(false)" style="margin-top:10px">Back to Sale</button>
    </div>
    <div id="activityFeed"></div>
  `;
  renderActivityFeed();
}

let ticketNumberInputs = []; // parallel array of editable ticket numbers, auto-filled from the starting number

function regenerateTicketNumbers() {
  const adultCount = Number(document.getElementById('adultCount')?.value) || 0;
  const childCount = Number(document.getElementById('childCount')?.value) || 0;
  const startVal = document.getElementById('startingNumberInput')?.value;
  const total = adultCount + childCount;
  const start = Number(startVal);

  if (total <= 0 || !startVal || isNaN(start)) {
    ticketNumberInputs = [];
  } else {
    ticketNumberInputs = Array.from({ length: total }, (_, i) => String(start + i));
  }
  renderTicketNumberRows();
  updateTotal();
}

function renderTicketNumberRows() {
  const wrap = document.getElementById('ticketNumberRows');
  if (!wrap) return;
  const adultCount = Number(document.getElementById('adultCount')?.value) || 0;
  wrap.innerHTML = ticketNumberInputs.map((num, i) => h`
    <div class="ticket-row">
      <span class="badge" style="background:${i < adultCount ? 'var(--accent-dim)' : '#e2efe6'};color:${i < adultCount ? 'var(--accent)' : 'var(--good)'}">${i < adultCount ? 'Adult' : 'Child'}</span>
      <input value="${num}" inputmode="numeric" oninput="setTicketNumberValue(${i}, this.value)">
    </div>
    <div id="tnStatus-${i}" style="font-size:12px;margin:-4px 0 8px 4px;color:#888"></div>
    `).join('');
  // Every auto-filled number is worth checking too, not just edited ones — the sequential
  // guess can just as easily land on an already-sold ticket as a manually typed one.
  ticketNumberInputs.forEach((num, i) => checkTicketLive(i, num));
}

const ticketCheckTimers = {};
function setTicketNumberValue(i, v) {
  ticketNumberInputs[i] = v;
  setTicketNumberStatus(i, '');
  clearTimeout(ticketCheckTimers[i]);
  if (String(v).trim().length < 3 || !currentSeries) return;
  ticketCheckTimers[i] = setTimeout(() => checkTicketLive(i, v), 400);
}

async function checkTicketLive(i, v) {
  if (!v || String(v).trim().length < 3 || !currentSeries) return;
  setTicketNumberStatus(i, '⋯ checking', '#888');
  try {
    await call('check_ticket', { series_id: currentSeries, ticket_number: Number(v) });
    if (String(ticketNumberInputs[i]) !== String(v)) return; // stale — kept typing since
    setTicketNumberStatus(i, '✓ available', 'var(--good)');
  } catch (e) {
    if (String(ticketNumberInputs[i]) !== String(v)) return;
    setTicketNumberStatus(i, e.message, 'var(--bad)');
  }
}
function setTicketNumberStatus(i, text, color) {
  const el = document.getElementById(`tnStatus-${i}`);
  if (el) { el.textContent = text; el.style.color = color || '#888'; }
}

function updateTotal() {
  const series = state.series.find(s => s.id === currentSeries);
  const totalEl = document.getElementById('totalDisplay');
  if (!series || !totalEl) return;
  const adultCount = Number(document.getElementById('adultCount')?.value) || 0;
  const childCount = Number(document.getElementById('childCount')?.value) || 0;
  const total = adultCount * Number(series.adult_price) + childCount * Number(series.child_price);
  totalEl.textContent = `£${total.toFixed(2)}`;
}

// Renders the running list of sales — recorded, or errored — without ever blocking
// the ticket-entry form above it. Each entry updates in place.
function renderActivityFeed() {
  const el = document.getElementById('activityFeed');
  if (!el) return;
  el.innerHTML = activity.map(a => {
    if (a.status === 'processing') {
      return `<div class="card">Recording ${a.ticketsLabel}…</div>`;
    }
    if (a.status === 'error') {
      return `<div class="card"><div class="error">${a.ticketsLabel}: ${a.message}</div></div>`;
    }
    if (a.method === 'cash') {
      return `<div class="card"><div class="info">£${a.amount.toFixed(2)} cash recorded for ${a.ticketsLabel} (${a.payerName}).<br>${a.forSeller ? '<b>Hand this cash to an Admin.</b>' : 'Remember to reconcile via Cash Recon.'}</div></div>`;
    }
    if (a.method === 'card_manual') {
      return `<div class="card"><div class="info">£${a.amount.toFixed(2)} card (via reader) logged for ${a.ticketsLabel} (${a.payerName}).</div>
        <label for="photoInput-${a.id}" class="secondary" style="display:block;text-align:center;padding:10px;border-radius:10px;margin-top:8px;cursor:pointer">
          ${a.photoAttached ? '✓ Photo attached' : '📷 Add photo of payment (optional)'}
        </label>
        <input type="file" accept="image/*" capture="environment" id="photoInput-${a.id}" style="display:none" onchange="attachPhoto(${a.id}, this)">
        ${a.photoError ? `<div class="error">${a.photoError}</div>` : ''}
      </div>`;
    }
    return '';
  }).join('');
}

async function attachPhoto(activityId, inputEl) {
  const file = inputEl.files[0];
  if (!file) return;
  const entry = activity.find(a => a.id === activityId);
  if (!entry) return;

  try {
    const resizedBase64 = await resizeImageForUpload(file);
    await call('upload_payment_photo', { payment_id: entry.paymentId, image_base64: resizedBase64 });
    entry.photoAttached = true;
    entry.photoError = null;
  } catch (e) {
    entry.photoError = 'Photo upload failed — sale is still recorded fine, you can retry the photo later from Recent Sales.';
  }
  renderActivityFeed();
}

// Resize/compress client-side before upload — important given church wifi is often weak,
// and a full-resolution phone photo (5-10MB) would be slow or fail outright.
function resizeImageForUpload(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onload = (e) => { img.src = e.target.result; };
    reader.onerror = reject;
    img.onload = () => {
      const maxDim = 1000;
      const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
      const canvas = document.createElement('canvas');
      canvas.width = img.width * scale;
      canvas.height = img.height * scale;
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      resolve(canvas.toDataURL('image/jpeg', 0.7));
    };
    img.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function submitSale(method) {
  const adultCount = Number(document.getElementById('adultCount').value) || 0;
  const childCount = Number(document.getElementById('childCount').value) || 0;
  const totalCount = adultCount + childCount;
  if (totalCount <= 0) { alert('Enter at least one adult or child ticket'); return; }

  const rawNumbers = ticketNumberInputs.map(n => n.trim()).filter(Boolean);
  if (rawNumbers.length !== totalCount) { alert(`${totalCount} adult+child specified but ${rawNumbers.length} ticket number(s) are filled in — enter a starting number, or fill in any blanks.`); return; }

  const payerInput = document.getElementById('payerNameInput');
  const payer_name = payerInput.value.trim();
  if (!payer_name) { alert('Buyer name is required.'); return; }

  const adultNums = rawNumbers.slice(0, adultCount);
  const childNums = rawNumbers.slice(adultCount);
  const parts = [];
  if (adultNums.length) parts.push(`Adults: ${adultNums.join(', ')}`);
  if (childNums.length) parts.push(`Children: ${childNums.join(', ')}`);
  const ticketsLabel = parts.join(' · ');
  const forSeller = state.user.role === 'seller';

  // Free up the form immediately so the seller can start the next sale
  // without waiting for this one to finish — resolution shows up below instead.
  document.getElementById('adultCount').value = 0;
  document.getElementById('childCount').value = 0;
  document.getElementById('startingNumberInput').value = '';
  ticketNumberInputs = [];
  renderTicketNumberRows();
  payerInput.value = '';
  updateTotal();

  const id = ++activityCounter;
  activity.unshift({ id, ticketsLabel, method, status: 'processing' });
  if (activity.length > 20) activity.length = 20;
  renderActivityFeed();

  try {
    const data = await call('record_sale', {
      series_id: currentSeries, adult_count: adultCount, child_count: childCount,
      ticket_numbers: rawNumbers, method, payer_name,
    });
    const entry = activity.find(a => a.id === id);
    if (method === 'cash') {
      Object.assign(entry, { status: 'cash', amount: data.amount, forSeller, payerName: payer_name });
    } else {
      Object.assign(entry, { status: 'card_manual', amount: data.amount, paymentId: data.payment_id, payerName: payer_name });
    }
    renderActivityFeed();
    refreshSellerStats();
  } catch (e) {
    const entry = activity.find(a => a.id === id);
    Object.assign(entry, { status: 'error', message: e.message });
    renderActivityFeed();
  }
}

// ---------------- ADMIN VIEW ----------------
let adminTab = 'dashboard';
async function renderAdmin() {
  document.getElementById('headerRight').innerHTML = `<button onclick="logout()">Log out (${state.user.name})</button>`;
  const isSuper = state.user.role === 'superadmin';
  if (!isSuper && (adminTab === 'series' || adminTab === 'users' || adminTab === 'recyclebin')) adminTab = 'dashboard';
  document.getElementById('app').innerHTML = h`
    <div class="tabs">
      <button class="${adminTab==='dashboard'?'active':''}" onclick="setAdminTab('dashboard')">Dashboard</button>
      <button class="${adminTab==='sell'?'active':''}" onclick="setAdminTab('sell')">Sell Tickets</button>
      <button class="${adminTab==='cash'?'active':''}" onclick="setAdminTab('cash')">Cash Recon</button>
      <button class="${adminTab==='sales'?'active':''}" onclick="setAdminTab('sales')">Recent Sales</button>
      <button class="${adminTab==='attention'?'active':''}" onclick="setAdminTab('attention')">Needs Attention</button>
      ${isSuper ? `<button class="${adminTab==='series'?'active':''}" onclick="setAdminTab('series')">Campaigns</button>` : ''}
      ${isSuper ? `<button class="${adminTab==='users'?'active':''}" onclick="setAdminTab('users')">Users</button>` : ''}
      ${isSuper ? `<button class="${adminTab==='retention'?'active':''}" onclick="setAdminTab('retention')">Data Retention</button>` : ''}
      ${isSuper ? `<button class="${adminTab==='recyclebin'?'active':''}" onclick="setAdminTab('recyclebin')">Recycle Bin</button>` : ''}
    </div>
    <div id="retentionBanner"></div>
    <div id="adminContent"></div>
  `;
  if (isSuper) renderRetentionBanner();
  if (adminTab === 'dashboard') await renderDashboardTab();
  if (adminTab === 'sell') await renderSellTab();
  if (adminTab === 'cash') await renderCashTab();
  if (adminTab === 'sales') await renderSalesTab();
  if (adminTab === 'attention') await renderAttentionTab();
  if (adminTab === 'retention') await renderRetentionTab();
  if (adminTab === 'recyclebin') await renderRecycleBinTab();
  if (adminTab === 'series') await renderSeriesTab();
  if (adminTab === 'users') await renderUsersTab();
}
function setAdminTab(t) { adminTab = t; renderAdmin(); }

let campaignFilter = ''; // '' = all campaigns
async function renderDashboardTab() {
  const { series } = await call('list_series');
  const d = await call('dashboard_state', { series_id: campaignFilter || undefined });
  const el = document.getElementById('adminContent');
  const sellerRows = Object.entries(d.sellerBreakdown).map(([name, v]) => h`
    <tr><td>${name}</td><td>£${v.card.toFixed(2)}</td><td>£${v.cash_confirmed.toFixed(2)}</td><td>£${v.cash_pending.toFixed(2)}</td></tr>
  `).join('');
  el.innerHTML = h`
    <div class="card">
      <label>Viewing</label>
      <select onchange="campaignFilter=this.value; renderDashboardTab();">
        <option value="" ${!campaignFilter?'selected':''}>All Campaigns (overview)</option>
        ${series.map(s => `<option value="${s.id}" ${campaignFilter===s.id?'selected':''}>${s.name}</option>`).join('')}
      </select>
    </div>
    <div class="card">
      <h3 style="margin-top:0">Adult / Child Summary</h3>
      <div class="stat"><span>Adult tickets sold</span><b>${d.adultSoldCount}</b></div>
      <div class="stat"><span>Child tickets sold</span><b>${d.childSoldCount}</b></div>
      <div class="stat"><span>Adult amount</span><b>£${d.adultAmount.toFixed(2)}</b></div>
      <div class="stat"><span>Children amount</span><b>£${d.childAmount.toFixed(2)}</b></div>
    </div>
    <div class="card">
      <div class="stat"><span><b>Total Collected</b></span><b>£${d.totalCollected.toFixed(2)}</b></div>
      <div class="stat"><span>Card Payment</span><b>£${d.cardTotal.toFixed(2)}</b></div>
      <div class="stat"><span>Cash</span><b>£${d.cashTotal.toFixed(2)}</b></div>
      <div class="stat" style="padding-left:16px"><span>· Reconciled</span><b>£${d.cashConfirmed.toFixed(2)}</b></div>
      <div class="stat" style="padding-left:16px"><span>· Pending</span><b style="color:var(--warn)">£${d.cashPending.toFixed(2)}</b></div>
    </div>
    <div class="card">
      <div class="stat"><span>Sold</span><b>${d.sold} / ${d.total}</b></div>
      <div class="stat"><span>Unsold</span><b>${d.unsold}</b></div>
      <div class="stat"><span>Tickets held, payment incomplete</span><b style="color:var(--warn)">${d.heldCount}</b></div>

async function renderSellTab() {

  currentSeries = pickDefaultCampaign(series);

  el.innerHTML = h`
    <div class="card" id="sellerStatsBlock">${statsBlockHtml(stats)}</div>
    <div class="card">
      <h3 style="margin-top:0">Sell Tickets</h3>
      <p class="muted">Same sale flow sellers use — sales made here are recorded under your own admin login.</p>
      <label>Campaign</label>
      <select id="seriesSelect" onchange="currentSeries=this.value; state.lastCampaignId=this.value; saveState(); updateTotal(); refreshSellerStats();">
        ${series.map(s => `<option value="${s.id}" ${s.id===currentSeries?'selected':''}>${s.name} (£${s.adult_price} adult / £${s.child_price} child)</option>`).join('')}

      <div class="row" style="margin-top:14px">

      <label>Buyer name</label>
      <input id="payerNameInput" placeholder="e.g. Mary O'Brien">
      <button class="primary" style="background:var(--good)" onclick="submitSale('cash')">Record Cash Payment</button>
      <button class="primary" style="background:#555" onclick="submitSale('card_manual')">Card Paid on Reader / Link — Log It</button>
      <button class="secondary" onclick="toggleQrPanel(true)">Show QR to Buyer</button>
    </div>
    <div id="qrPanelCard" class="card qr-wrap" style="display:none">
      <p>Ask the buyer to scan this to pay.</p>
      <img src="assets/payment-qr.png" alt="Scan to pay" style="max-width:220px">
      <button class="secondary" onclick="toggleQrPanel(false)" style="margin-top:10px">Back to Sale</button>
    </div>
    <div id="activityFeed"></div>

}

async function renderCashTab() {
  const { users } = await call('list_users');
  const { series } = await call('list_series');
  const sellers = users.filter(u => u.active); // anyone who can sell (seller, admin, or superadmin) can have cash to reconcile
  const el = document.getElementById('adminContent');
  el.innerHTML = h`
    <div class="card">
      <h3 style="margin-top:0">Confirm Cash Received</h3>
      <label>Campaign</label>
      <select id="reconSeries">${series.map(s => `<option value="${s.id}">${s.name}</option>`).join('') || '<option disabled>No campaigns yet</option>'}</select>
      <label>Person handing over cash</label>
      <select id="reconSeller">${sellers.map(s => `<option value="${s.id}">${s.name}${s.role !== 'seller' ? ' ('+s.role+')' : ''}</option>`).join('')}</select>
      <label>Amount received (£)</label>
      <input id="reconAmount" type="number" step="0.01" inputmode="decimal">
      <button class="primary" onclick="doCashRecon()">Confirm & Reconcile</button>
      <div id="reconResult"></div>
    </div>
  `;
}
async function doCashRecon() {
  const seller_id = document.getElementById('reconSeller').value;
  const series_id = document.getElementById('reconSeries').value;
  const amount_received = Number(document.getElementById('reconAmount').value);
  const resEl = document.getElementById('reconResult');
  try {
    const data = await call('cash_recon', { seller_id, series_id, amount_received });
    let msg = `Matched ${data.matched_count} sale(s) totalling £${data.matched_amount.toFixed(2)}.`;
    if (data.surplus > 0) msg += ` <br><b style="color:var(--warn)">£${data.surplus.toFixed(2)} surplus — everything's matched, this is extra on top. Check with seller.</b>`;
    if (data.shortfall > 0) msg += ` <br><b style="color:var(--bad)">£${data.shortfall.toFixed(2)} short of the next pending sale (£${data.still_pending[0] ? Number(data.still_pending[0].amount).toFixed(2) : '?'}) — nothing more confirmed until the rest is handed over.</b>`;
    if (data.still_pending.length) msg += `<br>${data.still_pending.length} sale(s) still pending for this seller.`;
    resEl.innerHTML = `<div class="info">${msg}</div>`;
  } catch (e) { resEl.innerHTML = `<div class="error">${e.message}</div>`; }
}

async function renderSalesTab() {
  const { series } = await call('list_series');
  const { payments } = await call('list_recent_payments', { series_id: campaignFilter || undefined });
  const el = document.getElementById('adminContent');
  el.innerHTML = `<div class="card">
    <label>Viewing</label>
    <select onchange="campaignFilter=this.value; renderSalesTab();">
      <option value="" ${!campaignFilter?'selected':''}>All Campaigns</option>
      ${series.map(s => `<option value="${s.id}" ${campaignFilter===s.id?'selected':''}>${s.name}</option>`).join('')}
    </select>
    </div>
    <div class="card"><h3 style="margin-top:0">Recent Sales</h3><table>
    <tr><th>Tickets</th><th>Seller</th><th>Amt</th><th>Method</th><th>Status</th><th></th></tr>
    ${payments.map(p => `
      <tr>
        <td>${p.tickets.join(' · ')}</td>
        <td>${p.seller}</td>
        <td>£${Number(p.amount).toFixed(2)}</td>

async function viewPhoto(paymentId) {
  try {
    const { url } = await call('get_payment_photo_url', { payment_id: paymentId });
    window.open(url, '_blank');
  } catch (e) { alert(e.message); }
}
async function doVoid(paymentId) {
  const reason = prompt('Reason for voiding this sale?');
  if (!reason) return;
  try { await call('void_sale', { payment_id: paymentId, reason }); renderSalesTab(); }
  catch (e) { alert(e.message); }
}

function minutesAgo(iso) { return Math.round((Date.now() - new Date(iso).getTime()) / 60000); }

async function renderAttentionTab() {
  const { series } = await call('list_series');
  const { payments } = await call('list_incomplete_payments', { series_id: campaignFilter || undefined });
  const el = document.getElementById('adminContent');
  const filterHtml = `<div class="card">
    <label>Viewing</label>
    <select onchange="campaignFilter=this.value; renderAttentionTab();">
      <option value="" ${!campaignFilter?'selected':''}>All Campaigns</option>
      ${series.map(s => `<option value="${s.id}" ${campaignFilter===s.id?'selected':''}>${s.name}</option>`).join('')}
    </select>
    </div>`;
  if (!payments.length) {
    el.innerHTML = filterHtml + `<div class="card"><div class="info">Nothing outstanding — every card payment in flight has either completed or been resolved.</div></div>`;
    return;
  }
  el.innerHTML = filterHtml + `<div class="card"><h3 style="margin-top:0">Needs Attention</h3>
    <p class="muted">Card payments awaiting completion or that failed/expired — resend generates a fresh payment link for the same tickets.</p>
    <table><tr><th>Tickets</th><th>Payer</th><th>Amount</th><th>Seller</th><th>Status</th><th>Age</th><th></th></tr>
    ${payments.map(p => `
      <tr>
        <td>${p.tickets.join(' · ')}</td>
        <td>${p.payer_name || '—'}</td>
        <td>£${Number(p.amount).toFixed(2)}</td>
        <td>${p.seller}</td>
        <td><span class="badge ${p.status==='pending'?'warn':'bad'}">${p.status}</span></td>
        <td>${minutesAgo(p.created_at)}m${p.resend_count ? ` · resent ${p.resend_count}x` : ''}</td>
        <td><button class="small" onclick="doResend('${p.id}')">Resend</button></td>
      </tr>`).join('')}
    </table>
  </div>
  <div id="resendResult"></div>`;
}

async function doResend(paymentId) {
  const resEl = document.getElementById('resendResult');
  try {
    const data = await call('resend_payment', { payment_id: paymentId });
    resEl.innerHTML = h`
      <div class="card qr-wrap">
        <p>New payment link for £${data.amount.toFixed(2)}</p>
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=${encodeURIComponent(data.pay_url)}" alt="Scan to pay">
        <a class="secondary" style="display:block;text-decoration:none;text-align:center;padding:12px;border-radius:10px" href="${data.pay_url}" target="_blank">Open payment page</a>
        <a class="secondary" style="display:block;text-decoration:none;text-align:center;padding:12px;border-radius:10px;margin-top:8px" href="https://wa.me/?text=${encodeURIComponent('Pay for your tickets here: ' + data.pay_url)}" target="_blank">Share via WhatsApp</a>
      </div>`;
  } catch (e) { resEl.innerHTML = `<div class="error">${e.message}</div>`; }
}

async function renderSeriesTab() {
  const { series } = await call('list_series', { include_inactive: true });
  const el = document.getElementById('adminContent');
  el.innerHTML = h`
    <div class="card"><h3 style="margin-top:0">Existing Campaigns</h3>
      <table><tr><th>Name</th><th>Range</th><th>Adult</th><th>Child</th><th>Status</th><th></th></tr>
      ${series.map(s => `<tr><td>${s.name}</td><td>${s.range_start}-${s.range_end}</td><td>£${s.adult_price}</td><td>£${s.child_price}</td>
        <td><span class="badge ${s.active?'ok':'bad'}">${s.active?'Active':'Inactive'}</span></td>
        <td>
          <button class="small" onclick="toggleCampaignActive('${s.id}', ${!s.active})">${s.active?'Deactivate':'Activate'}</button>
          <button class="small" onclick="downloadCampaignReport('${s.id}')">Download Report</button>
          <button class="small" onclick="doBinCampaign('${s.id}', '${s.name.replace(/'/g,"\\'")}')">Move to Bin</button>
        </td></tr>`).join('')}
      </table>
      <p class="muted">Only Active campaigns are selectable on the Sell page. When more than one is active, the earliest-created one shows by default.</p>
    </div>

async function toggleCampaignActive(seriesId, active) {
  try { await call('set_campaign_active', { series_id: seriesId, active }); renderSeriesTab(); }
  catch (e) { alert(e.message); }
}
async function downloadCampaignReport(seriesId) {
  try {
    const { csv, filename } = await call('export_campaign_report', { series_id: seriesId });
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } catch (e) { alert(e.message); }
}
async function doBinCampaign(seriesId, name) {
  if (!confirm(`Move "${name}" to the Recycle Bin? It'll disappear from every dashboard and seller's stats, but the data isn't deleted — you can restore it later.`)) return;
  try { await call('bin_campaign', { series_id: seriesId }); renderSeriesTab(); }
  catch (e) { alert(e.message); }
}

async function renderRecycleBinTab() {
  const { series } = await call('list_binned_campaigns');
  const el = document.getElementById('adminContent');
  el.innerHTML = h`
    <div class="card">
      <h3 style="margin-top:0">Recycle Bin</h3>
      <p class="muted">Binned campaigns are excluded from every dashboard and seller's stats — the data is kept, not deleted, and reports can still be downloaded.</p>
      ${!series.length ? '<p class="muted">Nothing in the bin.</p>' : `
      <table><tr><th>Name</th><th>Range</th><th>Adult</th><th>Child</th><th></th></tr>
      ${series.map(s => `<tr><td>${s.name}</td><td>${s.range_start}-${s.range_end}</td><td>£${s.adult_price}</td><td>£${s.child_price}</td>
        <td>
          <button class="small" onclick="downloadCampaignReport('${s.id}')">Download Report</button>
          <button class="small" onclick="doRestoreCampaign('${s.id}')">Restore</button>
        </td></tr>`).join('')}
      </table>`}
    </div>
  `;
}
async function doRestoreCampaign(seriesId) {
  try { await call('restore_campaign', { series_id: seriesId }); renderRecycleBinTab(); }
  catch (e) { alert(e.message); }
}

async function doCreateSeries() {
  const resEl = document.getElementById('seriesResult');
  try {
    await call('create_series', {
      name: document.getElementById('sName').value.trim(),
      range_start: Number(document.getElementById('sStart').value),
      range_end: Number(document.getElementById('sEnd').value),
      adult_price: Number(document.getElementById('sAdult').value),
      child_price: Number(document.getElementById('sChild').value),
    });
    renderSeriesTab();
  } catch (e) { resEl.innerHTML = `<div class="error">${e.message}</div>`; }
}

async function renderRetentionBanner() {
  const bannerEl = document.getElementById('retentionBanner');
  if (!bannerEl) return;
  try {
    const { count } = await call('retention_flags');
    if (count > 0) {
      bannerEl.innerHTML = `<div class="card"><div class="error">
        ${count} record(s) contain a name older than 90 days — your data retention policy says these should be reviewed.
        <button class="small" style="margin-left:8px" onclick="setAdminTab('retention')">Review now</button>
      </div></div>`;
    }
  } catch { /* non-critical */ }
}

async function renderRetentionTab() {
  const { count, payments, tickets } = await call('retention_flags');
  const el = document.getElementById('adminContent');
  el.innerHTML = h`
    <div class="card">
      <h3 style="margin-top:0">Data Retention (90-day policy)</h3>
      <p class="muted">Personal names older than 90 days, flagged for review. Anonymizing clears the name only —
      amounts, ticket numbers, and totals are kept, since financial records typically need to be retained
      for accounting purposes even after personal data should be minimized.</p>
      ${count === 0 ? '<div class="info">Nothing due for review right now.</div>' : h`
        <div class="stat"><span>Payer names flagged</span><b>${payments.length}</b></div>
        <div class="stat"><span>Ticket attendee names flagged</span><b>${tickets.length}</b></div>
        <button class="primary" style="background:var(--bad)" onclick="doAnonymize()">Anonymize all ${count} flagged record(s)</button>
      `}
      <div id="retentionResult"></div>
    </div>
  `;
}
async function doAnonymize() {
  if (!confirm('This permanently clears names on all flagged records. Amounts and ticket numbers are kept. Continue?')) return;
  const resEl = document.getElementById('retentionResult');
  try {
    const data = await call('anonymize_old_data');
    resEl.innerHTML = `<div class="info">Cleared ${data.payments_cleared} payer name(s) and ${data.tickets_cleared} ticket name(s).</div>`;
    renderRetentionTab();
    renderRetentionBanner();
  } catch (e) { resEl.innerHTML = `<div class="error">${e.message}</div>`; }
}

async function renderUsersTab() {
  const { users } = await call('list_users');
  const { series } = await call('list_series', { include_inactive: true });
  const el = document.getElementById('adminContent');
  el.innerHTML = h`
    <div class="card"><h3 style="margin-top:0">All Users</h3>
      <p class="muted">By default every user sees and can sell all active campaigns. Use "Restrict" to switch specific campaigns off for someone.</p>
      <table><tr><th>Name</th><th>Mobile</th><th>Role</th><th>Status</th><th>Disabled campaigns</th><th></th></tr>
      ${users.map(u => `
        <tr><td>${u.name}</td><td>${u.mobile}</td><td>${u.role}</td>
        <td><span class="badge ${u.active?'ok':'bad'}">${u.active?'active':'disabled'}</span></td>
        <td>${u.disabled_campaign_names.length ? u.disabled_campaign_names.join(', ') : '<span class="muted">none — full access</span>'}</td>
        <td>
          <button class="small" onclick="toggleUser('${u.id}', ${!u.active})">${u.active?'Disable':'Enable'}</button>
          <button class="small" onclick="toggleAssignEditor('${u.id}')">Restrict</button>
          <button class="small" onclick="doResetPassword('${u.id}', '${u.name.replace(/'/g,"\\'")}')">Reset Password</button>
        </td></tr>
        <tr id="assignRow-${u.id}" style="display:none"><td colspan="6">
          <p class="muted">Tick any campaign to switch it OFF for this user specifically:</p>
          ${series.map(s => `<label style="margin-right:14px"><input type="checkbox" value="${s.id}" class="assignCb-${u.id}" ${u.disabled_campaign_ids.includes(s.id)?'checked':''} style="width:auto"> ${s.name}</label>`).join('')}
          <button class="small" onclick="saveAssignments('${u.id}')">Save</button>
        </td></tr>
      `).join('')}
      </table>
      <div id="assignResult"></div>
    </div>
    <div class="card"><h3 style="margin-top:0">Add User</h3>
      <label>Name</label><input id="uName">
      <label>Mobile number</label><input id="uMobile" type="tel">
      <label>Role</label>
      <select id="uRole"><option value="seller">Volunteer Seller</option><option value="admin">Admin</option><option value="superadmin">SuperAdmin</option></select>
      <label>Password</label><input id="uPassword" type="password">
      <p class="muted">For Volunteer Sellers, use the one shared password everyone will use. For Admins/SuperAdmins, give each their own.</p>
      <label>Restrict from campaign(s) <span class="muted">(optional — by default this user gets every active campaign; tick to switch specific ones off)</span></label>
      ${series.map(s => `<label style="display:block;margin:4px 0"><input type="checkbox" value="${s.id}" class="newUserCb" style="width:auto"> ${s.name}</label>`).join('') || '<p class="muted">No campaigns exist yet.</p>'}
      <button class="primary" onclick="doCreateUser()">Add User</button>
      <div id="userResult"></div>
    </div>
  `;
}
function toggleAssignEditor(userId) {
  const row = document.getElementById(`assignRow-${userId}`);
  if (row) row.style.display = row.style.display === 'none' ? '' : 'none';
}
async function saveAssignments(userId) {
  const checked = Array.from(document.querySelectorAll(`.assignCb-${userId}:checked`)).map(cb => cb.value);
  const resEl = document.getElementById('assignResult');
  try {
    await call('set_disabled_campaigns', { user_id: userId, disabled_campaign_ids: checked });
    renderUsersTab();
  } catch (e) { resEl.innerHTML = `<div class="error">${e.message}</div>`; }
}
async function doCreateUser() {
  const resEl = document.getElementById('userResult');
  const disabled_campaign_ids = Array.from(document.querySelectorAll('.newUserCb:checked')).map(cb => cb.value);
  try {
    await call('create_user', {
      name: document.getElementById('uName').value.trim(),
      mobile: document.getElementById('uMobile').value.trim(),
      role: document.getElementById('uRole').value,
      password: document.getElementById('uPassword').value,
      disabled_campaign_ids,
    });
    renderUsersTab();
  } catch (e) { resEl.innerHTML = `<div class="error">${e.message}</div>`; }
}
async function toggleUser(id, active) {
  try { await call('set_user_active', { user_id: id, active }); renderUsersTab(); }
  catch (e) { alert(e.message); }
}

async function doResetPassword(userId, userName) {
  const newPassword = prompt(`New password for ${userName}:`);
  if (!newPassword) return;
  try {
    await call('reset_password', { user_id: userId, new_password: newPassword });
    alert(`Password reset for ${userName}.`);
  } catch (e) { alert(e.message); }
}

function render() {
  if (!state.session) { renderLogin(); return; }
  if (state.user.role === 'seller') renderSeller();
  else renderAdmin();
}
scheduleAutoLogout();
render();
