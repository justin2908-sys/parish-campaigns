// Check what SumUp took against what we have. The file is read in this browser and sent once; nothing from it is kept.
function sumupCardHtml() {
  return `<div class="card"><h3 style="margin-top:0">Check against SumUp</h3>
    <p class="muted">In SumUp open <b>Reports</b> and export your transactions as a <b>CSV</b>. Open that file here. It lists anything SumUp took that isn't recorded here, and anything recorded here as paid that SumUp doesn't show. The file isn't kept.</p>
    <label for="suFile">The SumUp file (CSV)</label><input type="file" id="suFile" accept=".csv,.txt,text/csv,text/plain">
    <label for="suFrom">The file starts on <span class="muted">(optional, so older payments aren't expected in it)</span></label><input type="date" id="suFrom">
    <button class="primary" style="margin-top:12px" onclick="doSumupCheck()">Check it</button><div id="suResult"></div></div>`;
}
async function doSumupCheck() {
  const out = document.getElementById('suResult'), f = document.getElementById('suFile').files[0];
  if (!f) { toast('Choose the SumUp file first', 'error'); return; }
  out.innerHTML = '<p class="muted">Reading the file…</p>';
  try {
    const r = await call('sumup_reconcile', { text: await f.text(), from: document.getElementById('suFrom').value || undefined }, 60000);
    const list = (rows, line) => rows.map(x => `<div style="border-top:1px solid var(--line);padding:8px 0">${line(x)}</div>`).join('');
    out.innerHTML = `<p style="margin:12px 0 4px"><b>${r.sumup_codes}</b> SumUp transactions read; <b>${r.matched}</b> match our paid payments${r.other_takings ? `; ${r.other_takings} other takings that aren't pay-by-link sales (card machine, etc.)` : ''}.</p>
      ${r.ok ? '<div class="info">✓ Everything agrees.</div>' : ''}
      ${r.not_recorded.length ? `<div class="error"><b>SumUp took these, but they are not recorded here</b>${list(r.not_recorded, x => `<b>${esc(x.code)}</b> — ${esc(x.line)}`)}</div>` : ''}
      ${r.recorded_as_not_paid.length ? `<div class="error"><b>Recorded here as not paid, but SumUp took the money</b>${list(r.recorded_as_not_paid, x => `<b>${esc(x.code)}</b> — ${esc(x.campaign)}, £${x.amount.toFixed(2)}, recorded as ${esc(x.status)}`)}</div>` : ''}
      ${r.not_in_sumup.length ? `<div class="hint"><b>Recorded here as paid, but not in the file</b> (if the file doesn't cover these dates, ignore them)${list(r.not_in_sumup, x => `<b>${esc(x.code)}</b> — ${esc(x.campaign)}, £${x.amount.toFixed(2)}, ${esc(new Date(x.created_at).toLocaleDateString('en-GB'))}`)}</div>` : ''}`;

  } catch (e) { out.innerHTML = `<div class="error">${esc(e.message)}</div>`; }
}

// A refund is made by hand (in SumUp, or in cash); this only writes it down so the records agree.
async function doRefund(paymentId, total, already) {
  const amt = prompt(`How much was refunded, in £? (The sale was £${Number(total).toFixed(2)}. Refund it in SumUp or in cash first, then record it here — this does not move any money.)`, Number(total).toFixed(2));

  const note = prompt('A short note — why, and how it was refunded (e.g. "Application not accepted; refunded in SumUp"):');

}

async function doCashRecon() {
  const resEl = document.getElementById('reconResult');
  try {
    const data = await call('cash_recon', {
      seller_id: document.getElementById('reconSeller').value,
      campaign_id: document.getElementById('reconCampaign').value,
      amount_received: Number(document.getElementById('reconAmount').value),
    });
    let msg = `Matched ${data.matched_count} sale(s) totalling £${data.matched_amount.toFixed(2)}.`;
    if (data.surplus > 0) msg += `<br><b style="color:var(--warn)">£${data.surplus.toFixed(2)} surplus — everything's matched, this is extra. Check with seller.</b>`;
    if (data.shortfall > 0) msg += `<br><b style="color:var(--bad)">£${data.shortfall.toFixed(2)} short of the next pending sale — nothing more confirmed until the rest is handed over.</b>`;
    if (data.still_pending.length) msg += `<br>${data.still_pending.length} sale(s) still pending for this seller.`;
    resEl.innerHTML = `<div class="info">${msg}</div>`;
    toast(`✓ Cash reconciled — ${data.matched_count} sale(s), £${data.matched_amount.toFixed(2)}`);
  } catch (e) { resEl.innerHTML = `<div class="error">${esc(e.message)}</div>`; }
}

// ---------- keep the app up to date ----------
// A phone can keep this page open for days after a new version is published, and keeps running the old one. So the page
// asks, once every 7 days, whether index.html has changed since the copy it is running. The question is a tiny conditional
// request (almost always answered with an empty "no change"). When there is a newer version it reloads itself — but never
// in the middle of a sale or while anything is open, and never within 10 minutes of a sale (the seller may still want to
// share that ticket). If it can't reload yet, a bar at the top says a new version is waiting.
const UPDATE_EVERY_MS = 7 * 24 * 60 * 60 * 1000;   // how often it asks (remembered on the phone, so reopening the app doesn't ask again)
const UPDATE_MIN_GAP_MS = 60 * 1000;               // if a check fails (no signal), never retry more often than this
const UPDATE_CHECKED_KEY = 'pc_update_checked_at';
let updateEtag = null, updateLastCheck = 0, updatePending = false, updateIdleTimer = null;
// The version of the page we are running = the copy the service worker saved when it served it (see sw.js).
async function loadedEtag() {
  try { const hit = await caches.match('/index.html'); const e = hit && hit.headers.get('etag'); if (e) return e; } catch { /* no saved copy */ }
  return null;
}
// force = true is used when the server itself says this screen is out of date (a sale was refused for that reason).
async function checkForUpdate(force) {
  if (updatePending) return;
  const now = Date.now();
  if (!force) {
    let last = 0; try { last = Number(localStorage.getItem(UPDATE_CHECKED_KEY) || 0); } catch { /* private mode: the 7 days can't be remembered */ }
    if (now - last < UPDATE_EVERY_MS) return;
  }
  if (now - updateLastCheck < UPDATE_MIN_GAP_MS) return;
  updateLastCheck = now;
  try {
    if (!updateEtag) updateEtag = await loadedEtag();
    const res = await fetch('/index.html', { cache: 'no-store', method: updateEtag ? 'GET' : 'HEAD', headers: updateEtag ? { 'If-None-Match': updateEtag } : {} });
    try { localStorage.setItem(UPDATE_CHECKED_KEY, String(Date.now())); } catch { /* private mode */ }   // got an answer: the next check is in 7 days
    if (res.status === 304) return;                       // unchanged
    const et = res.headers.get('etag');
    if (res.body) res.body.cancel().catch(() => {});      // never download the page just to compare
    if (!updateEtag) { updateEtag = et; return; }         // nothing saved to compare with: this answer is the baseline
    if (res.ok && et && et !== updateEtag) { updatePending = true; tryApplyUpdate(); }
  } catch { /* offline or a weak signal: try again at the next check */ }
}
function appIsBusy() {
  if (saleInFlight) return true;
  if (buyerNameValue.trim() || contactValue.trim() || startNumValue) return true;
  for (const id of ['sheet', 'feedSheet', 'numbersSheet', 'linksPanel', 'wizardPanel', 'settingsPanel']) if (document.getElementById(id)) return true;
  const el = document.activeElement;
  if (el && (el.tagName === 'TEXTAREA' || (el.tagName === 'INPUT' && el.value))) return true;
  return activity.some(a => Date.now() - new Date(a.soldAt).getTime() < 10 * 60 * 1000);
}
function tryApplyUpdate() {
  clearTimeout(updateIdleTimer);
  if (!appIsBusy()) { applyUpdate(); return; }
  showUpdateBar('A new version is ready. It will load when you finish — or tap Update now.', true);
  updateIdleTimer = setTimeout(tryApplyUpdate, 20000);
}
function applyUpdate() {
  let last = 0; try { last = Number(sessionStorage.getItem('pc_updated_at') || 0); } catch { /* private mode */ }
  if (Date.now() - last < 3 * 60 * 1000) {   // we have just reloaded and still got the old copy (a weak signal served the saved one): ask instead of looping
    showUpdateBar('A new version is ready. Tap Update now.', true); return;
  }
  try { sessionStorage.setItem('pc_updated_at', String(Date.now())); } catch { /* private mode */ }
  showUpdateBar('Updating to the latest version…', false);
  setTimeout(() => location.reload(), 800);
}
async function updateNow() {
  try { for (const k of await caches.keys()) await caches.delete(k); } catch { /* nothing saved */ }
  location.reload();
}
function showUpdateBar(text, withButton) {
  let bar = document.getElementById('updateBar');
  if (!bar) {
    bar = document.createElement('div'); bar.id = 'updateBar'; bar.setAttribute('role', 'status');
    bar.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:90;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;padding:8px 12px;background:var(--pine);color:#F3F1E7;font-size:14px;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.25)';
    document.body.appendChild(bar);
  }
  bar.innerHTML = `<span>${esc(text)}</span>${withButton ? '<button type="button" onclick="updateNow()" style="background:var(--brass-bright,#D9B25A);color:#1d2b22;border:none;border-radius:8px;padding:6px 12px;font-weight:700">Update now</button>' : ''}`;
}
function startUpdateWatcher() {
  // Each of these only asks if 7 days have passed since the last answer, so they cost nothing the rest of the time.
  setInterval(() => { if (document.visibilityState === 'visible') checkForUpdate(); }, 6 * 60 * 60 * 1000);   // an app left open for days
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkForUpdate(); });   // phone unlocked / app switched back to
  window.addEventListener('online', () => checkForUpdate());
  setTimeout(() => checkForUpdate(), 15000);   // soon after opening (the very first time, and 7 days after the last)
}

function gwAnnQuick(i) {

function gwAnnRefresh() {
  const a = gw.draft.ann, d = gw.d, w = [];
  const msg = a.message.trim(), now = d.now_local, set = (id, fn) => { const e = document.getElementById(id); if (e) fn(e); };
  set('gwAnnCount', e => { e.textContent = `(${a.message.length}/200)`; });
  let blocked = !msg;
  if (msg && a.starts_at && a.ends_at && a.ends_at <= a.starts_at) { w.push('<li class="err">The end is before the start, so this would never show.</li>'); blocked = true; }
  else if (msg && a.ends_at && a.ends_at <= now) { w.push('<li class="err">That end time has already passed.</li>'); blocked = true; }
  if (msg && !a.ends_at) w.push('<li>No end time. It stays up until you take it down. <button class="small" type="button" onclick="gwAnnWeek()">End in 7 days</button></li>');
  if (msg && a.urgent && a.message.length > 120) w.push('<li>Urgent messages sit in a narrow bar and read best when short. Try to keep it under 120 characters.</li>');
  if (!msg && (a.starts_at || a.ends_at)) w.push('<li>Add a message, or clear the times.</li>');
  if (d.announcement && d.announcement.state === 'ended' && !msg) w.push(`<li>The last notice ended on ${esc(d.announcement.ends_at.replace('T', ' at '))} and is no longer showing.</li>`);

  set('gwAnnLinkMsg', e => { e.className = 'gw-msg' + (linkOk ? '' : ' err'); e.textContent = a.link_url ? (linkOk ? 'Shows as “More information”.' : 'Links must start with https:// and be a full web address.') : ''; });

}
function gwAnnWeek() {

// drag by the handle: the dragged row stays put in the page; its neighbours step around it
let gwDrag = null;
document.addEventListener('pointerdown', (e) => {
  const g = e.target.closest && e.target.closest('.gw-grip'); if (!g) return;
  const row = g.closest('.gw-arow'); e.preventDefault();
  gwDrag = { row, list: row.parentNode, sec: row.parentNode.getAttribute('data-sec'), before: [...row.parentNode.querySelectorAll('.gw-arow')].map(n => n.dataset.id).join() };
  row.classList.add('dragging');
  try { g.setPointerCapture(e.pointerId); } catch { /* fine */ }
});
document.addEventListener('pointermove', (e) => {
  if (!gwDrag) return;
  const y = e.clientY, r = gwDrag.row; let guard = 0, s, b;
  while (guard++ < 30) {
    s = r.previousElementSibling;
    if (s && s.classList.contains('gw-arow')) { b = s.getBoundingClientRect(); if (y < b.top + b.height / 2) { gwDrag.list.insertBefore(s, r.nextSibling); continue; } }
    s = r.nextElementSibling;
    if (s && s.classList.contains('gw-arow')) { b = s.getBoundingClientRect(); if (y > b.top + b.height / 2) { gwDrag.list.insertBefore(s, r); continue; } }
    break;
  }
  if (y < 90) window.scrollBy(0, -12); else if (y > window.innerHeight - 90) window.scrollBy(0, 12);
});
function gwEndDrag() {
  if (!gwDrag) return;
  const d = gwDrag; gwDrag = null;
  const ids = [...d.list.querySelectorAll('.gw-arow')].map(n => n.dataset.id);
  if (ids.join() !== d.before) gwSaveOrder(d.sec, ids); else d.row.classList.remove('dragging');
}
document.addEventListener('pointerup', gwEndDrag);
document.addEventListener('pointercancel', gwEndDrag);

  if (!f.label.trim()) errs.push('Give it a name.');
  if (!f.starts_on) errs.push('Choose a start date.');
  if (!f.ends_on) errs.push('Choose an end date. Every item needs one so it comes down by itself.');
  if (f.starts_on && f.ends_on && f.ends_on < f.starts_on) errs.push('The end date is before the start date.');
  if (!f.url.trim()) errs.push('Add the web address people should go to.');
  else if (!gwOkUrl(f.url)) errs.push('The web address must start with https:// and be a full address.');
  if (f.ends_on && f.ends_on < today) warns.push('That end date has passed, so it will not show.');
  if (f.url && /\/(buy|register)\.html|campaign_id=/i.test(f.url)) warns.push('This looks like a Parish Campaigns page. It is better to list it from Campaigns, so places left and the dates update by themselves.');
  const all = [...gw.d.sections.involved.items, ...gw.d.sections.registration.items];
  if (f.label.trim() && all.some(i => i.id !== f.id && i.name.trim().toLowerCase() === f.label.trim().toLowerCase())) warns.push('Something with this name is already on the list.');
  const el = document.getElementById('gwF_issues'); if (el) el.innerHTML = errs.map(m => `<li class="err">${esc(m)}</li>`).join('') + warns.map(m => `<li>${esc(m)}</li>`).join('');
  const u = document.getElementById('gwF_url'); if (u) u.classList.toggle('gw-bad', !!f.url.trim() && !gwOkUrl(f.url));
  const b = document.getElementById('gwF_save'); if (b) b.disabled = errs.length > 0;
  return errs.length === 0;
}
function gwFormCancel() { gw.form = null; document.getElementById('gwForm').innerHTML = ''; toast('Nothing was changed'); }
async function gwFormSave() {
  if (!gwFormCheck()) return;
  const f = gw.form;
  try {
    await call('gateway_item_save', { id: f.id, section: f.section, label: f.label, url: f.url, cta: f.cta, starts_on: f.starts_on, ends_on: f.ends_on });
    toast(f.id ? '✓ Saved' : `✓ Added. It shows from ${gwShort(f.starts_on)}`); gw.form = null; await gwReload();
  } catch (e) { toast(e.message, 'error'); }
}
async function gwRemoveItem(id) {
  if (gw.removeArm !== id) { gw.removeArm = id; gwPaint(); setTimeout(() => { if (gw && gw.removeArm === id) { gw.removeArm = null; gwPaint(); } }, 4000); return; }
  try { await call('gateway_item_delete', { id }); gw.removeArm = null; toast('✓ Removed'); await gwReload(); } catch (e) { toast(e.message, 'error'); }
}

// ---------- boot ----------
if (state.session) scheduleAutoLogout();
render();
startUpdateWatcher();
// Lets the app open with no signal (see sw.js) — sales themselves always need the network.
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
</script>
