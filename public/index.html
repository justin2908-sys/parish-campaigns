<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2E4739">
<title>St.Vincent De Paul Church — Campaigns</title>
<link rel="stylesheet" href="/theme.css">
<style>
  * { box-sizing: border-box; }
  body { margin:0; }
  header { padding:10px 16px; background:var(--pine); color:#F1F0E7; display:flex; justify-content:space-between; align-items:center; gap:10px; }
  #headerRight { display:flex; gap:6px; }
  header h1 { margin:0; font-weight:400; }
  header h1.brand { flex:1; min-width:0; display:flex; flex-direction:column; line-height:1.1; font-family:var(--font-caps); }
  header h1.brand .eb { font-size:10.5px; letter-spacing:.16em; line-height:1.3; text-transform:uppercase; color:var(--brass-bright); }
  header h1.brand .wm { font-size:22px; color:#F1F0E7; margin-top:3px; }
  header button { background:transparent; border:1px solid rgba(241,240,231,.4); color:#F1F0E7; border-radius:9px; padding:9px 13px; font-size:14.5px; font-weight:600; }
  main { max-width: 600px; margin: 0 auto; padding: 20px; }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:20px; margin-bottom:16px; }
  label { display:block; font-size:14.5px; color:var(--slate); margin: 12px 0 4px; font-weight:500; }
  input, select { width:100%; padding:14px; font-size:17px; border:1px solid var(--stone); border-radius:11px; background:#fff; color:var(--ink); }
  button.primary { width:100%; padding:16px; font-size:18px; font-weight:600; background:var(--accent); color:#F3F1E7; border:none; border-radius:12px; margin-top:16px; }
  button.primary:disabled { background:var(--line); color:var(--slate); }
  button.secondary { width:100%; padding:14px; font-size:16px; font-weight:600; background:var(--accent-dim); color:var(--accent); border:none; border-radius:12px; margin-top:8px; }
  button.small { padding:9px 13px; font-size:14.5px; font-weight:500; border-radius:9px; border:1px solid var(--stone); background:var(--surface); color:var(--ink); }
  button.ghost { background:none; border:1px dashed var(--stone); color:var(--slate); border-radius:9px; padding:9px 10px; font-size:14px; width:100%; }
  button.link { background:none; border:none; color:var(--slate); font-size:14px; text-decoration:underline; padding:0; }
  button.link.bad { color:var(--bad); }
  button.icon-x { background:none; border:none; color:var(--slate); font-size:16px; padding:4px 8px; }
  .row { display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap; }
  .row > * { flex:1; min-width:110px; }
  .ticket-row { display:flex; gap:8px; align-items:center; margin-bottom:8px; }
  .ticket-row input { flex:1; }
  .toggle { display:flex; border:1px solid var(--line); border-radius:10px; overflow:hidden; margin-top:6px; }
  .toggle button { flex:1; padding:11px; border:none; background:var(--surface); font-size:14.5px; font-weight:600; color:var(--slate); }
  .toggle button.active { background:var(--accent); color:white; }
  .toggle button.active.alt { background:var(--tier-c); }
  .total { font-family:var(--font-head); font-size:32px; font-weight:500; text-align:center; margin:16px 0; }
  .stat { display:flex; justify-content:space-between; padding:11px 0; border-bottom:1px solid var(--line); font-size:16.5px; }
  .stat b { font-family:var(--font-head); font-weight:500; font-size:18px; }
  .stat:last-child { border:none; }
  .badge { display:inline-block; padding:3px 11px; border-radius:20px; font-size:13px; font-weight:600; }
  .tiny-actions { display:flex; flex-wrap:wrap; gap:6px; }
  .badge.ok { background:var(--good-dim); color:var(--good); }
  .badge.warn { background:var(--warn-dim); color:var(--warn); }
  .badge.bad { background:var(--bad-dim); color:var(--bad); }
  .badge.tier0 { background:var(--accent-dim); color:var(--accent); }
  .badge.tier1 { background:var(--good-dim); color:var(--good); }
  .badge.tier2 { background:var(--warn-dim); color:var(--warn); }
  .badge.tier3 { background:var(--tier-c-dim); color:var(--tier-c); }
  .tabs { display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap; }
  .tabs button { flex:1; padding:11px 8px; border:1px solid var(--stone); background:var(--surface); border-radius:11px; font-size:14.5px; font-weight:600; color:var(--pine); }
  .tabs button.active { background:var(--pine); color:#F3F1E7; border-color:var(--pine); }
  .error { background:var(--bad-dim); color:var(--bad); padding:13px; border-radius:11px; margin:10px 0; font-size:15.5px; }
  .info { background:var(--good-dim); color:var(--good); padding:13px; border-radius:11px; margin:10px 0; font-size:15.5px; }
  .hint { background:var(--brass-dim); color:var(--slate); padding:11px 13px; border-radius:11px; margin:10px 0; font-size:14px; }
  .muted { color:var(--slate); font-size:14.5px; }
  table { width:100%; border-collapse:collapse; font-size:14.5px; }
  td, th { padding:9px 5px; border-bottom:1px solid var(--line); text-align:left; }
  .share-row { display:flex; gap:6px; }
  .share-link { flex:1; display:flex; align-items:center; justify-content:center; gap:4px; background:var(--accent-dim); color:var(--accent); border-radius:10px; padding:11px 4px; font-size:14.5px; font-weight:600; text-decoration:none; }
  .tier-row, .block-row { display:flex; gap:8px; align-items:flex-end; margin-bottom:8px; }
  .tier-row > div, .block-row > div { flex:1; }
  #app { padding-bottom: 60px; }

  /* ---- Compact Sell screen: the whole sale fits one phone screen with no scrolling ---- */
  #app.sell { padding: 10px 12px 12px; }
  .sell .card { padding: 12px; margin-bottom: 10px; border-radius: 12px; }
  .statsbar { display:flex; justify-content:space-between; align-items:center; gap:8px; width:100%; padding:10px 13px; margin-bottom:10px; font-size:14.5px; text-align:left; color:var(--ink); background:var(--surface); border:1px solid var(--line); border-radius:12px; }
  .statsbar b { font-weight:700; }
  .statsline { min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .saletitle { font-family:var(--font-head); font-size:20px; font-weight:500; margin:0 0 2px; }
  .selrow { display:flex; gap:8px; margin-bottom:2px; }
  .selrow select { flex:1; min-width:0; padding:11px; font-size:15.5px; }
  .qty-row { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:10px; }
  .qty-label { font-size:17.5px; font-weight:600; }
  .stepper { display:flex; align-items:center; border:1px solid var(--stone); border-radius:12px; overflow:hidden; background:#fff; }
  .stepper button { width:54px; height:48px; border:none; background:var(--accent-dim); color:var(--accent); font-size:28px; font-weight:600; line-height:1; }
  .stepper input { width:60px; height:48px; text-align:center; border:none; border-left:1px solid var(--line); border-right:1px solid var(--line); border-radius:0; padding:0; font-family:var(--font-head); font-size:22px; font-weight:600; }
  .sell input.compact { margin-top:10px; padding:11px 12px; }
  .namecontact { display:flex; gap:8px; margin-top:10px; }
  .namecontact input { flex:1; min-width:0; padding:12px 11px; font-size:16.5px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; align-items:center; min-height:0; }
  .chip { padding:4px 10px; border-radius:14px; font-size:14px; font-weight:600; background:var(--pine-dim); color:var(--pine); }
  .chip.ok { background:var(--good-dim); color:var(--good); }
  .chip.bad { background:var(--bad-dim); color:var(--bad); }
  .totalline { display:flex; justify-content:space-between; align-items:baseline; margin-top:10px; font-size:15.5px; color:var(--slate); }
  .totalline b { font-family:var(--font-head); font-weight:500; font-size:31px; color:var(--ink); }
  .pay3 { display:flex; gap:8px; margin-top:6px; }
  .pay3 button { flex:1; margin:0; padding:16px 4px; font-size:17.5px; font-weight:600; border:none; border-radius:13px; color:#fff; }
  .pay3 button:disabled { background:var(--line) !important; color:var(--slate); }
  .feedbar { display:flex; justify-content:space-between; align-items:center; gap:8px; width:100%; padding:11px 13px; font-size:14.5px; text-align:left; color:var(--ink); background:var(--surface); border:1px solid var(--line); border-radius:12px; margin-bottom:10px; }
  .feedbar.attn { border-color:var(--warn); background:var(--warn-dim); }
  .sheet { position:fixed; left:0; right:0; bottom:0; z-index:20; max-width:560px; margin:0 auto; background:white; border-top:1px solid var(--line); border-radius:16px 16px 0 0; box-shadow:0 -6px 24px rgba(0,0,0,.18); padding:14px 16px 18px; }
  @media (max-height:700px) {
    header { padding:7px 14px; } header h1.brand .wm { font-size:19px; margin-top:1px; } header h1.brand .eb { font-size:10px; }
    #app.sell { padding:8px 12px 8px; } .sell .card { padding:10px; margin-bottom:8px; } .statsbar { padding:8px 12px; margin-bottom:8px; }
    .qty-row { margin-top:7px; } .stepper button, .stepper input { height:44px; } .sell input.compact { margin-top:8px; padding:10px 12px; }
    .namecontact { margin-top:8px; } .namecontact input { padding:10px 11px; } .totalline { margin-top:6px; } .totalline b { font-size:27px; }
    .pay3 button { padding:13px 4px; } .feedbar { padding:9px 12px; margin-bottom:6px; } .chips { margin-top:6px; }
  }
  @media (max-height:600px) {
    header { padding:5px 12px; } header h1.brand .eb { display:none; } header h1.brand .wm { display:block; font-size:18px; margin:0; } header button { padding:7px 11px; }
    .saletitle { font-size:17px; } .totalline b { font-size:24px; } .pay3 button { padding:11px 4px; font-size:16.5px; }
    #app.sell { padding:6px 10px 6px; } .sell .card { padding:8px; margin-bottom:6px; } .statsbar { padding:6px 12px; margin-bottom:6px; }
    .selrow select { padding:8px 10px; } .stepper button, .stepper input { height:40px; } .qty-row { margin-top:5px; }
    .sell input.compact { margin-top:6px; padding:8px 12px; } .namecontact { margin-top:6px; } .namecontact input { padding:8px 10px; }
    .totalline { margin-top:4px; } .feedbar { padding:7px 12px; margin-bottom:4px; } .chips { margin-top:4px; }
    .sell .error { padding:8px 10px; margin:6px 0 0; font-size:14px; }
  }
  .sheet .share-link { padding:16px 4px; font-size:16.5px; }
  /* Anything that can grow long on the Sell screen (recent sales, the ticket-number editor) opens as a
     sheet over the bottom with its own scrolling, and the stats detail floats over the form — so the
     page itself never has to scroll. */
  .sheetbig { max-height:72vh; max-height:72dvh; display:flex; flex-direction:column; }
  .sheethead { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:8px; flex:none; }
  .sheetscroll { overflow-y:auto; -webkit-overflow-scrolling:touch; min-height:0; }
  .sheetscroll .card { margin-bottom:8px; }
  #statsWrap { position:relative; }
  .statsdrop { position:absolute; left:0; right:0; z-index:15; box-shadow:0 12px 30px rgba(0,0,0,.22); }
  /* Admin screen: the way back to selling — has to look like the button it is. */
  .sellbtn { display:flex; align-items:center; justify-content:center; gap:10px; width:100%; margin:0 0 14px; padding:16px; font-size:19px; font-weight:700; letter-spacing:.01em; color:var(--ink); border:none; border-radius:14px; background:linear-gradient(180deg,#DDBA66,#B8913A); box-shadow:0 4px 0 #8B6A22; }
  .sellbtn:active { transform:translateY(2px); box-shadow:0 2px 0 #8B6A22; }
  .sellbtn .go { font-size:22px; opacity:.85; }
  /* New-campaign wizard: "how do people sign up?" choices */
  .kindcard { display:flex; flex-direction:column; gap:3px; width:100%; text-align:left; margin-top:8px; padding:13px 14px; border:1.5px solid var(--stone); border-radius:12px; background:var(--surface); color:var(--ink); font-size:15px; }
  .kindcard b { font-size:16.5px; }
  .kindcard span { color:var(--slate); font-size:14px; line-height:1.35; }
  .kindcard.on { border-color:var(--accent); background:var(--accent-dim); }
  .kindcard:disabled { opacity:.55; }
</style>
</head>
<body>
<header>
  <h1 class="brand"><span class="eb">St.Vincent De Paul Church</span><span class="wm">Campaigns</span></h1>
  <div id="headerRight"></div>
</header>
<main id="app"></main>

<script>
const API = '/api/';
const APP_BUILD = '2026-10-13';   // sent with every sale; the server asks an older screen to refresh (MIN_SELL_BUILD in api.js)
let state = { session: null, user: null, campaigns: [], org: null, lastCampaignId: null };
try {
  const saved = localStorage.getItem('pc_session');
  if (saved) state = { ...state, ...JSON.parse(saved) };
} catch {}

function saveState() { localStorage.setItem('pc_session', JSON.stringify(state)); }
function logout() { clearTimeout(autoLogoutTimer); state = { session: null, user: null, campaigns: [], org: null, lastCampaignId: null }; viewMode = 'sell'; saveState(); render(); }

// The session token isn't encrypted, just signed — safe to read its expiry client-side
// (we're not trusting it for auth, the server re-verifies the signature on every call).
let autoLogoutTimer = null;
function scheduleAutoLogout() {
  clearTimeout(autoLogoutTimer);
  if (!state.session) return;
  try {
    let b64 = state.session.split('.')[0].replace(/-/g, '+').replace(/_/g, '/');
    while (b64.length % 4) b64 += '=';
    const payload = JSON.parse(atob(b64));
    const msLeft = payload.exp - Date.now();
    if (msLeft <= 0) { logout(); return; }
    autoLogoutTimer = setTimeout(() => { alert('Session expired after 2 hours — please log in again.'); logout(); }, msLeft);
  } catch {}
}

// A request that gets no reply (weak signal) gives up after timeoutMs instead of hanging, and
// says so in plain words. err.network marks "we don't know whether the server got it" — as
// opposed to a real answer from the server — so callers can tell those two cases apart.
// If a button's request takes longer than a moment, a small "Working…" pill says so — so a slow signal never looks like "nothing happened".
// Background checks (link polling, the sell-screen load, which have their own indicators) stay quiet.
const QUIET_ACTIONS = new Set(['checkout_status', 'my_open_links', 'log_link_shared', 'retention_flags', 'list_recent_payments', 'list_incomplete_payments', 'sell_screen']);
let workCount = 0, workTimer = null;
function workStart() {
  workCount++;
  if (workCount === 1) workTimer = setTimeout(() => {
    let el = document.getElementById('working');
    if (!el) { el = document.createElement('div'); el.id = 'working'; el.setAttribute('role', 'status'); el.textContent = '⏳ Working…'; el.style.cssText = 'position:fixed;top:calc(10px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:95;background:#1D2B22;color:#fff;border-radius:999px;padding:7px 16px;font-size:14px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.3)'; document.body.appendChild(el); }
    el.hidden = false;
  }, 400);
}
function workEnd() {
  workCount = Math.max(0, workCount - 1);
  if (!workCount) { clearTimeout(workTimer); const el = document.getElementById('working'); if (el) el.hidden = true; }
}
async function call(action, body = {}, timeoutMs = 20000) {
  const quiet = QUIET_ACTIONS.has(action); if (!quiet) workStart();
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), timeoutMs);
  let res, data;
  try {
    res = await fetch(API + action, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session: state.session, ...body }),
      signal: ctl.signal,
    });
    data = await res.json().catch(() => ({}));
  } catch (e) {
    const err = new Error(e && e.name === 'AbortError' ? 'No reply from the server — the signal may be weak.' : "Can't reach the server — check your signal.");
    err.network = true;
    throw err;
  } finally { clearTimeout(timer); if (!quiet) workEnd(); }
  // The server ends a session when the account is disabled or its password is reset. Go back to
  // the login screen straight away instead of leaving a screen that can't do anything.
  if (res.status === 401 && state.session && action !== 'login') { logout(); throw new Error('Your session has ended — please log in again.'); }
  if (!res.ok) { const err = new Error(data.error || 'Something went wrong'); if (data.code) err.code = data.code; throw err; }
  return data;
}

// Every button that changes something says so, in words, where the person is looking — not only by the screen quietly redrawing.
let toastTimer = null;
function toast(text, kind) {
  let el = document.getElementById('toast');
  if (!el) { el = document.createElement('div'); el.id = 'toast'; el.setAttribute('role', 'status'); el.setAttribute('aria-live', 'polite'); document.body.appendChild(el); }
  el.style.cssText = 'position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:100;max-width:min(92vw,460px);padding:11px 16px;border-radius:12px;font-size:15px;font-weight:600;line-height:1.35;text-align:center;box-shadow:0 8px 28px rgba(0,0,0,.35);color:#fff;background:' + (kind === 'error' ? '#8A2F22' : '#2F6F4A');
  el.textContent = text; el.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, 4500);
}
function h(strings, ...vals) { return strings.reduce((a, s, i) => a + s + (vals[i] ?? ''), ''); }
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

// Admin and SuperAdmin can sell too (they must — anyone who can sell has to show up in
// Cash Recon and every other reconciliation screen, same as a Seller). viewMode is how
// they switch between their Admin dashboard and the same Sell screen a Seller uses.
let viewMode = 'sell'; // Sell is everyone's landing page; admins reach the Admin area via a button there
function render() {
  for (const id of ['sheet', 'feedSheet', 'numbersSheet']) { const stale = document.getElementById(id); if (stale) stale.remove(); }
  closeLinksPanel();
  document.getElementById('app').className = '';
  if (!state.session) { renderLogin(); return; }
  if (state.user.needsConsent) { document.getElementById('headerRight').innerHTML = ''; renderConsentGate(); return; }
  const staffOnly = state.user.role === 'finance' || state.user.role === 'priest';   // these two never sell
  if (staffOnly) viewMode = 'admin';
  const toAdmin = state.user.role !== 'seller' && state.user.role !== 'platform_owner' && !staffOnly && viewMode === 'sell'
    ? `<button onclick="viewMode='admin'; render();">← Admin</button>` : '';
  const sellingNow = state.user.role === 'seller' || (state.user.role !== 'platform_owner' && !staffOnly && viewMode === 'sell');
  const linksBtn = sellingNow ? `<button onclick="openLinksPanel()" aria-label="Payment links I have sent">🔗 Links</button>` : '';
  document.getElementById('headerRight').innerHTML = `${toAdmin}${linksBtn}<button onclick="logout()">${toAdmin ? 'Log out' : `Log out (${esc(state.user.name)})`}</button>`;
  if (state.user.role === 'platform_owner') renderPlatformOwner();
  else if (state.user.role === 'seller') renderSeller();
  else if (viewMode === 'sell') renderSeller();
  else renderAdmin();
}

// ================= LOGIN / BOOTSTRAP =================
function renderLogin(err) {
  document.getElementById('headerRight').innerHTML = '';
  document.getElementById('app').innerHTML = h`
    <div class="card">
      <h2 style="margin-top:0">Log in</h2>
      ${err ? `<div class="error">${esc(err)}</div>` : ''}
      <label>Mobile number</label>
      <input id="mobile" type="tel" placeholder="07xxxxxxxxx" inputmode="numeric">
      <label>Password</label>
      <input id="password" type="password">
      <button class="primary" onclick="doLogin()">Log in</button>
    </div>
    <div class="card">
      <p class="muted">First time setting this up? Only works once, before any Platform Owner exists.</p>
      <button class="secondary" onclick="showBootstrap()">First-time Platform Owner setup</button>
    </div>
  `;
}
async function doLogin() {
  const mobile = document.getElementById('mobile').value.trim();
  const password = document.getElementById('password').value;
  try {
    const data = await call('login', { mobile, password });
    state.session = data.session; state.user = data.user; state.user.needsConsent = !!data.needs_consent; viewMode = 'sell';
    saveState(); scheduleAutoLogout(); render();
  } catch (e) { renderLogin(e.message); }
}

// A Seller must accept this once — before anything else — the first time they log in, and again
// if the wording ever changes (CURRENT_CONSENT_VERSION on the server). Declining just logs them out;
// nothing is recorded for a decline, they can try again whenever they're ready.
function renderConsentGate() {
  document.getElementById('app').innerHTML = h`
    <div class="card">
      <h2 style="margin-top:0">Before you start selling</h2>
      <p>Please confirm both of these:</p>
      <ul style="padding-left:20px;line-height:1.7;margin:0 0 14px">
        <li>You are <b>18 years old or older</b>.</li>
        <li>When you send a payment link by text, WhatsApp or email, it goes out from <b>your own phone</b> — your own number or email address, not the church's. The buyer will see it come from you, not from ${esc(churchName())}. We only record that a link was sent, and when — never the message itself.</li>
      </ul>
      <button class="primary" onclick="doAcceptConsent()">✅ Yes — I'm 18+ and I understand</button>
      <button class="secondary" style="margin-top:8px" onclick="logout()">I don't agree — log me out</button>
      <div id="consentResult"></div>
    </div>
  `;
}
async function doAcceptConsent() {
  const el = document.getElementById('consentResult');
  try {
    await call('accept_consent');
    state.user.needsConsent = false; saveState(); render(); toast('✓ Thank you — you can start selling');
  } catch (e) { el.innerHTML = `<div class="error">${esc(e.message)}</div>`; }
}
function showBootstrap() {
  document.getElementById('app').innerHTML = h`
    <div class="card">
      <h2 style="margin-top:0">First-time Platform Owner Setup</h2>
      <p class="muted">Creates the very first Platform Owner account — the global role that creates each church (Organization) and its first Admin. Only works if no Platform Owner exists yet.</p>
      <label>Your name</label><input id="bName">
      <label>Mobile number</label><input id="bMobile" type="tel">
      <label>Password (8+ characters, yours alone)</label><input id="bPassword" type="password">
      <button class="primary" onclick="doBootstrap()">Create Platform Owner</button>
      <button class="secondary" onclick="renderLogin()">Back to login</button>
      <div id="bootstrapResult"></div>
    </div>`;
}
async function doBootstrap() {
  const resEl = document.getElementById('bootstrapResult');
  try {
    await call('bootstrap_platform_owner', {
      name: document.getElementById('bName').value.trim(),
      mobile: document.getElementById('bMobile').value.trim(),
      password: document.getElementById('bPassword').value,
    });
    toast('✓ Platform Owner created');
    renderLogin('Platform Owner created — please log in.');

// The contact is pre-filled as the recipient, so the seller just taps send in their own

  const d = String(v).replace(/[^\d+]/g, '');

// SumUp tells the server the moment a link is paid; this just keeps the seller's screen current.
function startLinkPoller() {
  if (linkPollHandle) return;
  linkPollHandle = setInterval(async () => {
    const waiting = activity.filter(a => a.method === 'link' && a.status === 'linkpending');
    if (!waiting.length) { clearInterval(linkPollHandle); linkPollHandle = null; return; }
    let changed = false;
    for (const a of waiting) {
      try {
        const { status } = await call('checkout_status', { payment_id: a.paymentId });
        if (status === 'paid') { a.status = 'linkpaid'; changed = true; }
        else if (status === 'failed' || status === 'void') { a.status = 'linkfailed'; changed = true; }
      } catch {}
    }
    if (changed) renderFeed();
  }, 8000);
}

function regenerateTicketNumbers() {
  const camp = currentCampaign();
  const block = camp.blocks.find(b => b.id === selectedBlockId);
  const order = camp.tiers.map(t => ({ id: t.id, count: sellCounts[t.id] || 0 }));
  const total = order.reduce((s, o) => s + o.count, 0);
  const seq = []; order.forEach(o => { for (let i=0;i<o.count;i++) seq.push(o.id); });

  if (block && block.type === 'digital') {
    ticketNumbers = total ? seq.map(tierId => ({ tierId, auto: true })) : [];
  } else {
    // Nothing is looked up until the first number has all its digits (a 10001–15000 series
    // means 5) — typing "1", "10", "100"… must not fire a request per keystroke per ticket.
    const startEl = document.getElementById('startNum');
    const raw = startEl ? startEl.value.trim() : '';
    const start = Number(raw);
    const complete = raw !== '' && !isNaN(start) && raw.length >= minDigits(block);
    startHint = (total && raw && !complete) ? `Type all ${minDigits(block)} digits and the numbers will be checked.` : '';
    ticketNumbers = (!total || !complete) ? [] : seq.map((tierId, i) => ({ value: String(start+i), tierId }));
  }
  ticketNumbers.__campaignId = camp.id;
  renderTicketRows(); updateTotal();
}

// How many digits a ticket number in this series has (its first number's length, e.g. 10001 → 5).
let startHint = '';
function minDigits(block) { return block ? String(block.range_start).length : 1; }

// keepStatus: just re-draw (e.g. opening the editor) without asking the server again.
function renderTicketRows(keepStatus) {
  const wrap = document.getElementById('ticketRows'); if (!wrap) return;
  const camp = currentCampaign();
  const block = camp.blocks.find(b => b.id === selectedBlockId);
  if (block && block.type === 'digital') {
    const byTier = {};
    ticketNumbers.forEach(tn => byTier[tn.tierId] = (byTier[tn.tierId]||0)+1);
    const chips = camp.tiers.filter(t => byTier[t.id]).map((t) => {
      const idx = camp.tiers.findIndex(x=>x.id===t.id);
      return `<span class="badge tier${idx%4}">${esc(t.name)} × ${byTier[t.id]}</span>`;
    }).join('');
    wrap.innerHTML = chips
      ? `<div class="chips">${chips}<span class="muted">any available online number</span></div>`
      : `<div class="muted" style="margin-top:8px">Online numbers are assigned automatically.</div>`;
    return;
  }
  // Physical: the numbers show as a compact row of chips (with live availability). The full
  // per-ticket editor stays one tap away for tickets that aren't in sequence, and a problem
  // number is called out in red right under the chips.
  if (!keepStatus) ticketStatus = {};
  const rows = numbersOpen ? ticketNumbers.map((tn, i) => {
    const tierIdx = camp.tiers.findIndex(t => t.id === tn.tierId);
    const tier = camp.tiers[tierIdx];
    return `<div class="ticket-row">
        <span class="badge tier${tierIdx%4}">${esc(tier.name)}</span>
        <input value="${esc(tn.value)}" inputmode="numeric" aria-label="Ticket number ${i + 1}" oninput="setTicketValue(${i}, this.value)">
      </div>
      <div id="tnStatus-${i}" style="font-size:12px;margin:-4px 0 8px 4px;color:var(--slate)"></div>`;
  }).join('') : '';
  wrap.innerHTML = `${startHint ? `<div class="muted" style="margin-top:8px">${esc(startHint)}</div>` : ''}<div class="chips" id="ticketChips"></div><div id="ticketErr"></div>`;
  drawNumbersSheet(rows);
  if (keepStatus) {
    ticketNumbers.forEach((_, i) => {
      const st = ticketStatus[i], el = document.getElementById(`tnStatus-${i}`);
      if (st && el) { el.textContent = st.text; el.style.color = st.kind === 'ok' ? 'var(--good)' : st.kind === 'bad' ? 'var(--bad)' : 'var(--slate)'; }
    });
    renderChips();
  } else {
    renderChips();
    checkAllTickets();
  }
}

// The per-ticket number editor opens as a sheet over the bottom of the screen with its own scrolling
// (ten tickets is ten rows — inline, that would push the whole page into a scroll).
function drawNumbersSheet(rowsHtml) {
  let el = document.getElementById('numbersSheet');
  if (!numbersOpen || !ticketNumbers.length) { if (el) el.remove(); return; }
  const keep = el ? (el.querySelector('.sheetscroll') || {}).scrollTop || 0 : 0;
  if (!el) { el = document.createElement('div'); el.id = 'numbersSheet'; el.className = 'sheet sheetbig'; el.style.zIndex = '19'; document.body.appendChild(el); }
  el.innerHTML = `<div class="sheethead"><b>Edit ticket numbers</b><button type="button" class="small" onclick="toggleNumbers()">Done</button></div>
    <div class="muted" id="cascadeHint" style="font-size:12.5px;margin:0 0 8px">${ticketNumbers.length > 1 ? 'Change a number and the ones below it follow on from it — handy for two separate books of tickets.' : ''}</div>
    <div class="sheetscroll">${rowsHtml}</div>`;
  const sc = el.querySelector('.sheetscroll'); if (sc) sc.scrollTop = keep;
}

// One request for the whole run of numbers (not one per ticket). Only numbers that already have
// all their digits are asked about; anything edited meanwhile is left alone when the answer lands.
async function checkAllTickets() {
  const camp = currentCampaign();
  const need = minDigits(camp.blocks.find(b => b.id === selectedBlockId));
  const snapshot = ticketNumbers.map(t => String(t.value));
  const idxs = snapshot.map((_, i) => i).filter(i => snapshot[i].trim().length >= need && /^\d+$/.test(snapshot[i].trim()));
  if (!idxs.length) return;
  idxs.forEach(i => setTicketNumberStatus(i, '⋯ checking', 'var(--slate)'));
  const stillSame = (i) => ticketNumbers[i] && String(ticketNumbers[i].value) === snapshot[i];
  try {
    const { results } = await call('check_tickets', { campaign_id: camp.id, ticket_numbers: idxs.map(i => Number(snapshot[i])) });
    idxs.forEach((i, k) => {
      if (!stillSame(i)) return;
      const r = results[k];
      if (r && r.ok) setTicketNumberStatus(i, '✓ available', 'var(--good)');
      else setTicketNumberStatus(i, (r && r.error) || 'Could not check this number', 'var(--bad)');
    });
  } catch (e) {
    idxs.forEach(i => { if (stillSame(i)) setTicketNumberStatus(i, e.message, 'var(--bad)'); });
  }
}

function renderChips() {
  const el = document.getElementById('ticketChips'); if (!el) return;
  const camp = currentCampaign();
  const kindOf = (i) => (ticketStatus[i] && ticketStatus[i].kind) || '';
  const mark = (k) => k === 'ok' ? ' ✓' : k === 'bad' ? ' ✗' : '';
  let chips;
  if (ticketNumbers.length > 6) {
    // A long run collapses to "first … last (N)", coloured by its worst status.
    const kinds = ticketNumbers.map((_, i) => kindOf(i));
    const worst = kinds.includes('bad') ? 'bad' : (kinds.every(k => k === 'ok') ? 'ok' : '');
    chips = `<span class="chip ${worst}">${esc(ticketNumbers[0].value)} … ${esc(ticketNumbers[ticketNumbers.length - 1].value)} (${ticketNumbers.length})${mark(worst)}</span>`;
  } else {
    chips = ticketNumbers.map((tn, i) => `<span class="chip ${kindOf(i)}">${esc(tn.value)}${mark(kindOf(i))}</span>`).join('');
  }
  el.innerHTML = chips + (ticketNumbers.length ? `<button type="button" class="link" onclick="toggleNumbers()">${numbersOpen ? 'Hide editor' : 'Edit numbers'}</button>` : '');
  if (numbersOpen) { const hintEl = document.getElementById('cascadeHint'); if (hintEl) hintEl.textContent = ticketNumbers.length > 1 ? 'Change a number and the ones below it follow on from it — handy for two separate books of tickets.' : ''; }
  const badIdx = ticketNumbers.findIndex((_, i) => kindOf(i) === 'bad');
  const errEl = document.getElementById('ticketErr');
  if (errEl) errEl.innerHTML = badIdx >= 0 ? `<div class="error" style="margin:6px 0 0;padding:8px 10px;font-size:13px">${esc(ticketStatus[badIdx].text)}${numbersOpen ? '' : ' — tap “Edit numbers” to fix it.'}</div>` : '';
}

const ticketCheckTimers = {};
// Editing one box mid-run cascades forward: every box after it renumbers to follow straight on from
// the new value. That's for a seller working through two (or more) separate books of tickets in one
// sale — edit the box where the second book starts, and the rest of it fills in on its own instead of
// retyping every remaining box by hand. Boxes before the edited one are never touched.
function setTicketValue(i, v) {
  ticketNumbers[i].value = v;
  setTicketNumberStatus(i, '');
  clearTimeout(ticketCheckTimers[i]);
  const need = minDigits(currentCampaign().blocks.find(b => b.id === selectedBlockId));
  // Only act once the box has all its digits — an edit in progress isn't checked or cascaded.
  if (String(v).trim().length < need || !/^\d+$/.test(String(v).trim())) return;
  ticketCheckTimers[i] = setTimeout(() => cascadeAndCheck(i, v), 350);
}
function cascadeAndCheck(i, v) {
  if (String(ticketNumbers[i] && ticketNumbers[i].value) !== String(v)) return; // superseded by a further edit
  const base = Number(v);
  for (let j = i + 1; j < ticketNumbers.length; j++) {
    ticketNumbers[j].value = String(base + (j - i));
    setTicketNumberStatus(j, '');
  }
  renderTicketRows(true);
  checkAllTickets();
}
function setTicketNumberStatus(i, text, color) {
  const kind = color === 'var(--good)' ? 'ok' : color === 'var(--bad)' ? 'bad' : '';
  ticketStatus[i] = { text, kind };
  const el = document.getElementById(`tnStatus-${i}`);
  if (el) { el.textContent = text; el.style.color = color || 'var(--slate)'; }
  renderChips();
}

function updateTotal() {
  const camp = currentCampaign();
  const el = document.getElementById('totalDisplay'); if (!el) return;
  const total = camp.tiers.reduce((s, t) => s + (sellCounts[t.id]||0) * Number(t.price), 0);
  el.textContent = `£${total.toFixed(2)}`;
}

// Three ways to pay, for physical AND online tickets alike: Cash, Pay at Machine (tapped on
// the POS machine, seller logs it), Pay by Link (a per-sale SumUp link sent to the buyer).
// Cash/Machine work the same for an online lucky number as for a physical ticket — the seller
// is standing there vouching for it either way. Link-only would be a rule for an unattended
// sale with no seller present (e.g. a future public buyer page), not for "online" as such.
// Undo lives on whichever of Cash/Machine was just tapped — a link, once created, can't be undone.
function paymentButtonsHtml() {
  const camp = currentCampaign();
  const scoped = pendingUndo && camp && pendingUndo.campaignId === camp.id;
  const a = scoped ? activity.find(x => x.id === pendingUndo.activityId) : null;
  const remaining = a ? a.remaining : 0;
  const cashPending = scoped && pendingUndo.method === 'cash';
  const machinePending = scoped && pendingUndo.method === 'machine';
  const busy = saleInFlight; // a sale is being recorded right now — lock all of them so nothing double-fires
  const allowed = allowedPayMethods(camp);
  const linkBtn = `<button style="background:var(--tier-c)" title="Pay by Link — a payment link is sent to the buyer" ${scoped || busy ? 'disabled' : ''} onclick="submitSale('link')">Link</button>`;
  const cashBtn = `
    <button style="${cashPending?'background:var(--ink)':'background:var(--good)'}" title="Cash taken" ${(scoped && !cashPending) || busy ? 'disabled' : ''} onclick="${cashPending?`doUndo(${pendingUndo.activityId})`:`submitSale('cash')`}">
      ${cashPending ? `Undo (${remaining}s)` : 'Cash'}
    </button>`;
  const machineBtn = `
    <button style="${machinePending?'background:var(--ink)':'background:var(--slate)'}" title="Pay at Machine — paid on the card machine, you're logging it" ${(scoped && !machinePending) || busy ? 'disabled' : ''} onclick="${machinePending?`doUndo(${pendingUndo.activityId})`:`submitSale('machine')`}">
      ${machinePending ? `Undo (${remaining}s)` : 'Machine'}
    </button>`;
  // Only the buttons the Admin has switched on for this kind of ticket (physical or online).
  return (allowed.includes('cash') ? cashBtn : '') + (allowed.includes('machine') ? machineBtn : '') + (allowed.includes('link') ? linkBtn : '');
}
// Which payment buttons the Admin allows for the series being sold from right now (set per campaign,
// separately for physical and online tickets). Falls back to all three if nothing is configured.
function allowedPayMethods(camp) {
  const block = camp && camp.blocks.find(b => b.id === selectedBlockId);
  const list = camp && (block && block.type === 'digital' ? camp.online_payment_methods : camp.physical_payment_methods);
  return Array.isArray(list) && list.length ? list : ['cash', 'machine', 'link'];
}
function updatePaymentButtons() { const el = document.getElementById('paymentButtons'); if (el) el.innerHTML = paymentButtonsHtml(); }

let saleInFlight = false, saleAttempt = null;
function newClientRef() {
  return (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 12);
}
async function submitSale(method) {
  const camp = currentCampaign();
  const block = camp.blocks.find(b => b.id === selectedBlockId);
  const autoMode = block && block.type === 'digital';
  const errEl = document.getElementById('submitError');
  if (!allowedPayMethods(camp).includes(method)) { errEl.innerHTML = `<div class="error">That payment option isn't switched on for this campaign.</div>`; return; }
  if (!ticketNumbers.length) { errEl.innerHTML = `<div class="error">Enter at least one ticket count first.</div>`; return; }
  if (!autoMode) {
    const need = minDigits(block);
    if (ticketNumbers.some(tn => String(tn.value).trim().length < need)) {
      errEl.innerHTML = `<div class="error">Ticket numbers in this series have ${need} digits — one of them looks incomplete.</div>`; return;
    }
    const statuses = ticketNumbers.map((tn,i)=>(ticketStatus[i] && ticketStatus[i].text) || '');
    if (statuses.some(s => s.includes('already') || s.includes("doesn't exist"))) {
      errEl.innerHTML = `<div class="error">Fix the flagged ticket number(s) before recording this sale.</div>`; return;
    }
  }
  // Every sale needs the buyer's name and a mobile number or email.
  const needsDetails = true;
  if (!buyerNameValue.trim() || !contactValue.trim()) {
    const missing = !buyerNameValue.trim() && !contactValue.trim() ? "name and mobile number or email" : !buyerNameValue.trim() ? 'name' : 'mobile number or email';
    errEl.innerHTML = `<div class="error">Enter the buyer's ${missing} first — ${method === 'link' ? "that's where the payment link goes" : autoMode ? "an online ticket lives on their phone, so we need to be able to send it" : "we need to be able to reach the buyer, for example if they win"}.</div>`; return;
  }
  if (saleInFlight) return; // a second tap while the first is still going must do nothing
  errEl.innerHTML = '';
  const tier_counts = Object.fromEntries(camp.tiers.map(t => [t.id, sellCounts[t.id]||0]));
  const draft = { sellCounts: {...sellCounts}, startNumValue, buyerNameValue, contactValue, selectedBlockId, ticketNumbers: ticketNumbers.map(t=>({...t})) };

  // Retry-safe: the same sale details reuse the same reference, so if a reply was lost on a weak
  // signal and the seller taps again, the server hands back the ORIGINAL sale instead of making
  // a second one. Changing anything about the sale starts a fresh reference.
  const sig = JSON.stringify([camp.id, tier_counts, autoMode ? selectedBlockId : ticketNumbers.map(t => t.value), method, buyerNameValue, needsDetails ? contactValue : '']);
  if (!saleAttempt || saleAttempt.sig !== sig) saleAttempt = { sig, ref: newClientRef() };
  saleInFlight = true; updatePaymentButtons();
  errEl.innerHTML = `<div class="hint">Recording the sale…</div>`;

  try {
    const data = await call('record_sale', {
      campaign_id: camp.id, tier_counts,
      ticket_numbers: autoMode ? undefined : ticketNumbers.map(t => t.value),
      auto_assign_block_id: autoMode ? selectedBlockId : undefined,
      method, payer_name: buyerNameValue.trim() || undefined, contact_value: needsDetails ? contactValue : undefined,
      client_ref: saleAttempt.ref, build: APP_BUILD,
    });
    saleAttempt = null;
    errEl.innerHTML = '';
    const newId = Date.now();
    const entry = {
      id: newId, paymentId: data.payment_id, campaignId: camp.id, method, amount: data.amount,
      buyerName: buyerNameValue, tickets: data.tickets, soldAt: new Date().toISOString(),
      status: 'undo', remaining: 8, draft, contact: data.contact_value,
    };
    if (method === 'link') {
      // Not undoable: the link exists now. Track it until SumUp says it's paid.
      Object.assign(entry, { status: 'linkpending', payUrl: data.pay_url, contact: data.contact_value, sharedVia: null });
      sheetId = newId; // pop the send buttons up over the form
    } else if (data.replayed) {
      // An earlier tap already recorded this sale (its reply just never arrived). The 15-second
      // undo window has long since passed, so don't offer an Undo that would be refused.
      entry.status = 'final';
    } else {
      pendingUndo = { activityId: newId, method, campaignId: camp.id };
    }
    activity.unshift(entry);

    sellCounts = freshCounts(camp);   // back to the campaign's starting quantity for the next sale
    startNumValue = ''; buyerNameValue = ''; contactValue = '';
    ticketNumbers = []; ticketNumbers.__campaignId = camp.id;
    saleInFlight = false;
    renderSeller();
    if (method === 'link') startLinkPoller(); else if (entry.status === 'undo') startTicker();
  } catch (e) {
    saleInFlight = false; updatePaymentButtons();
    if (e.network) {
      // We don't know whether the server got it — keep the same reference so a retry can't double-sell.
      errEl.innerHTML = `<div class="error">${esc(e.message)} Nothing is lost — tap the same button again to retry; it can't sell twice.</div>`;
    } else {
      saleAttempt = null; // a real answer from the server: this attempt is finished, the next one is new
      errEl.innerHTML = `<div class="error">${esc(e.message)}</div>`;
      if (e.code === 'app_outdated') checkForUpdate(true);   // the server says this screen is old: show the Update now bar straight away
    }
  }
}

async function doUndo(activityId) {
  const a = activity.find(x => x.id === activityId); if (!a) return;
  try {
    await call('undo_sale', { payment_id: a.paymentId });
  } catch (e) {
    // window closed server-side, or something else changed — surface it, keep the entry as-is
    document.getElementById('submitError').innerHTML = `<div class="error">${esc(e.message)}</div>`;
    return;
  }
  toast('✓ Sale undone');
  activity = activity.filter(x => x.id !== activityId);
  if (pendingUndo && pendingUndo.activityId === activityId) pendingUndo = null;

  if (a.campaignId === state.lastCampaignId && a.draft) {
    sellCounts = {...a.draft.sellCounts};
    startNumValue = a.draft.startNumValue;
    buyerNameValue = a.draft.buyerNameValue;
    contactValue = a.draft.contactValue || '';
    selectedBlockId = a.draft.selectedBlockId;
    ticketNumbers = a.draft.ticketNumbers.map(t=>({...t}));
    ticketNumbers.__campaignId = a.campaignId;
    renderSeller();
    const errEl = document.getElementById('submitError');
    if (errEl) errEl.innerHTML = `<div class="info">Sale restored — tap the correct payment method below.</div>`;
  } else {
    renderFeed(); updatePaymentButtons();
  }
}

function startTicker() {
  if (tickHandle) return;
  tickHandle = setInterval(() => {
    let anyPending = false;
    activity.forEach(a => { if (a.status === 'undo') { a.remaining -= 1; if (a.remaining <= 0) { a.status='final'; if (pendingUndo && pendingUndo.activityId===a.id) pendingUndo=null; } else anyPending = true; } });
    renderFeed(); updatePaymentButtons();
    if (!anyPending) { clearInterval(tickHandle); tickHandle = null; }
  }, 1000);
}

// Recent sales sit behind one slim bar so they never push the sale form off the screen. The
// bar itself flags anything that needs the seller (a link awaiting payment, or one expired).
function renderFeed() {
  const el = document.getElementById('feed'); if (!el) return;
  const camp = currentCampaign();
  const mine = activity.filter(a => a.campaignId === camp.id);
  if (!mine.length) { el.innerHTML = ''; drawFeedSheet(null); renderSheet(); return; }
  const awaiting = mine.filter(a => a.method === 'link' && a.status === 'linkpending').length;
  const expired = mine.filter(a => a.method === 'link' && a.status === 'linkfailed').length;
  const bits = [`${mine.length} sale${mine.length === 1 ? '' : 's'} this session`];
  if (awaiting) bits.push(`⏳ ${awaiting} awaiting payment`);
  if (expired) bits.push(`⚠ ${expired} link expired`);
  el.innerHTML = `<button type="button" class="feedbar ${expired ? 'attn' : ''}" onclick="toggleFeed()"><span>${bits.join(' · ')}</span><span>${feedOpen ? '▴' : '▾'}</span></button>`;
  drawFeedSheet(feedOpen ? mine : null);
  renderSheet();
}
// The list of recent sales opens as a sheet over the bottom of the screen with its own scrolling —
// never inline, where it would push the sale form up and make the whole page scroll.
function drawFeedSheet(mine) {
  let el = document.getElementById('feedSheet');
  if (!mine) { if (el) el.remove(); return; }
  const keep = el ? (el.querySelector('.sheetscroll') || {}).scrollTop || 0 : 0;   // stay where you were scrolled to
  if (!el) { el = document.createElement('div'); el.id = 'feedSheet'; el.className = 'sheet sheetbig'; el.style.zIndex = '18'; document.body.appendChild(el); }
  el.innerHTML = `<div class="sheethead"><b>Recent sales</b><button type="button" class="small" onclick="toggleFeed()">Close</button></div><div class="sheetscroll">${feedCardsHtml(mine)}</div>`;
  const sc = el.querySelector('.sheetscroll'); if (sc) sc.scrollTop = keep;
}

// After a Pay-by-Link sale the send buttons pop up over the form, so the seller can send the
// link straight away without scrolling to find it in the list.
function renderSheet() {
  let el = document.getElementById('sheet');
  const a = sheetId && activity.find(x => x.id === sheetId && x.status === 'linkpending');
  if (!a || !document.getElementById('feed')) { if (el) el.remove(); if (!a) sheetId = null; return; }
  const camp = state.campaigns.find(c => c.id === a.campaignId) || currentCampaign();
  const isOnline = (camp.blocks.find(b => b.id === (a.draft && a.draft.selectedBlockId)) || {}).type === 'digital';
  const nums = a.tickets.map(t => t.display_number || t.ticket_number);
  const sent = a.sharedVia ? `✓ Sent by ${{sms:'SMS',whatsapp:'WhatsApp',email:'Email'}[a.sharedVia]}` : `Not sent yet`;
  if (!el) { el = document.createElement('div'); el.id = 'sheet'; el.className = 'sheet'; document.body.appendChild(el); }
  el.innerHTML = `<div style="font-weight:700;font-size:16px">Send the payment link to ${esc(a.buyerName)}</div>
    <div class="muted" style="margin:2px 0 12px">£${a.amount.toFixed(2)} · ${nums.length} ticket${nums.length>1?'s':''} · ${esc(a.contact)} · ${sent}</div>
    ${linkShareHtml(a.paymentId, a.contact, linkMessage(camp.name, a.amount, nums, a.payUrl, isOnline), camp.name + ' — payment link')}
    <div style="margin:10px 0 2px;text-align:center"><button type="button" class="link" onclick="doChangeContact('${a.paymentId}')">✏️ Wrong number or email? Change it</button></div>
    <button type="button" class="secondary" onclick="closeSheet()">Done</button>`;
}

function feedCardsHtml(mine) {
  return mine.map(a => {
    const label = `${a.tickets.length} ticket${a.tickets.length>1?'s':''} (${a.tickets.map(t=>t.display_number||t.ticket_number).join(', ')})`;
    const when = new Date(a.soldAt).toLocaleString('en-GB', {day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
    if (a.method === 'link') {
      const nums = a.tickets.map(t => t.display_number || t.ticket_number);
      const sentLine = a.sharedVia
        ? `Sent by ${{sms:'SMS',whatsapp:'WhatsApp',email:'Email'}[a.sharedVia]} to ${esc(a.contact)} at ${new Date(a.sharedAt).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}`
        : `Not sent yet — tap a button below to send it to ${esc(a.contact)}`;
      if (a.status === 'linkpaid') return `<div class="card">
        <div class="info">✓ Paid — £${a.amount.toFixed(2)} for ${label} (${esc(a.buyerName)}, ${esc(a.contact)}). SumUp confirmed it.</div>
        <div style="font-size:11px;color:var(--slate);margin-top:4px">${sentLine} · Sold ${when}</div>
        ${isOnlineSale(a) ? `<div style="margin-top:9px"><button class="link" onclick="toggleShareMenu(${a.id})">📤 Share ticket</button></div>
        ${shareMenuOpenFor===a.id ? shareMenuHtml(a) : ''}` : ''}
      </div>`;
      const failed = a.status === 'linkfailed';
      return `<div class="card">
        <div class="${failed ? 'error' : 'hint'}" style="margin-top:0">${failed ? 'Link expired or failed' : '⏳ Awaiting payment'} — £${a.amount.toFixed(2)} for ${label}, ${esc(a.buyerName)}</div>
        <div style="font-size:12px;color:var(--slate);margin:6px 0">${sentLine}</div>
        <div style="margin:0 0 6px"><button class="link" onclick="doChangeContact('${a.paymentId}')">✏️ Wrong number or email? Change it</button></div>
        ${failed ? (((currentCampaign().blocks.find(b => b.id === (a.draft && a.draft.selectedBlockId)) || {}).type === 'digital')

             ${a.resendError ? `<div class="error" style="margin-top:8px">${esc(a.resendError)}</div>` : ''}`) : `

      </div>`;
    }
    if (a.status === 'undo') return `<div class="card">${label} for ${esc(a.buyerName||'(no name given)')} — ${a.method==='cash'?'Cash':'Machine'} £${a.amount.toFixed(2)} — logging… <span class="muted">(Undo is on the button above)</span></div>`;

}

// A seller may issue a fresh link for their own PHYSICAL sale once the old link is dead. The
// server re-checks with SumUp first and refuses if it was actually paid or is still live, so
// this can never leave two payable links behind.
async function doSellerResend(activityId) {
  const a = activity.find(x => x.id === activityId); if (!a || a.resending) return;
  a.resending = true; a.resendError = null; renderFeed();
  try {
    const r = await call('resend_payment', { payment_id: a.paymentId });
    Object.assign(a, { status: 'linkpending', payUrl: r.pay_url, sharedVia: null, sharedAt: null });
    sheetId = a.id;
    startLinkPoller();
    toast('✓ New payment link created');
  } catch (e) { a.resendError = e.message; }
  a.resending = false; renderFeed();
}

// "Share ticket" only makes sense for an ONLINE ticket, which exists only on the buyer's phone. A physical
// ticket is handed over on paper, so nothing is shared after the sale; the only thing a seller ever sends
// for a physical sale is the payment link, and only when Link was the way to pay.
function isOnlineSale(a) {
  const camp = state.campaigns.find(c => c.id === a.campaignId);
  return !!camp && (camp.blocks.find(b => b.id === (a.draft && a.draft.selectedBlockId)) || {}).type === 'digital';
}
function toggleShareMenu(id) { shareMenuOpenFor = shareMenuOpenFor === id ? null : id; renderFeed(); }
// Replicates the physical ticket's own content — church name/address, campaign-specific
// details (prizes, draw date, tagline, whatever the SuperAdmin wrote for THIS campaign — see
// campaigns.details_text), tier breakdown, ticket number(s), price, buyer, sale date/time.
function shareMessageFor(a) {
  const camp = state.campaigns.find(c => c.id === a.campaignId);
  const byTier = {};
  a.tickets.forEach(t => byTier[t.tier_name] = (byTier[t.tier_name]||0)+1);
  const denom = Object.entries(byTier).map(([name,n]) => `${n} x ${name}`).join(', ');
  const numbers = a.tickets.map(t => t.display_number || t.ticket_number).join(', ');
  const when = new Date(a.soldAt).toLocaleString('en-GB', {day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
  const lines = [];
  if (state.org && state.org.name) lines.push(state.org.name);
  if (state.org && state.org.address) lines.push(state.org.address);
  lines.push('', `🎟️ ${camp.name} — Ticket No. ${numbers}`, '');
  if (camp.details_text) { lines.push(camp.details_text, ''); }
  lines.push(`${a.tickets.length} ticket${a.tickets.length>1?'s':''}: ${denom}`, `Total: £${a.amount.toFixed(2)}`, `Buyer: ${a.buyerName||'—'}`, `Sold: ${when}`, '');
  // A permanent link to view/save the ticket (or a digital receipt for a physical ticket) on any device.
  const online = (camp.blocks.find(b => b.id === (a.draft && a.draft.selectedBlockId)) || {}).type === 'digital';
  if (a.paymentId) lines.push(`${online ? 'View or save your ticket any time' : 'Digital receipt (keep your physical ticket too)'}:`, `${location.origin}/ticket.html?payment_id=${a.paymentId}`, '');
  lines.push(thankYou());
  return lines.join('\n');
}
// Reused for both a Cash/Machine sale (no known contact — three generic buttons) and a paid
// Pay by Link sale (contact already on file, so it's pre-filled — but not tracked via
// logShared, which is specifically for the payment-request send, not this confirmation).
function shareMenuHtml(a) {
  const body = encodeURIComponent(shareMessageFor(a));
  const camp = state.campaigns.find(c => c.id === a.campaignId);
  const subject = encodeURIComponent(`${camp.name} — your ticket`);
  if (a.contact) {
    return `<div style="background:var(--brass-dim);border:1px dashed var(--line);border-radius:10px;padding:10px;margin-top:8px">
      <div style="font-size:11.5px;color:var(--slate);margin-bottom:8px">Send this ticket by:</div>
      ${contactKind(a.contact)==='email'
        ? `<div class="share-row"><a class="share-link" href="mailto:${encodeURIComponent(a.contact)}?subject=${subject}&body=${body}">✉️ Email ${esc(a.contact)}</a></div>`
        : `<div class="share-row">
            <a class="share-link" href="sms:${esc(a.contact)}?body=${body}">📱 SMS</a>
            <a class="share-link" href="https://wa.me/${waNumber(a.contact)}?text=${body}" target="_blank" rel="noopener">💬 WhatsApp</a>
          </div>`}
    </div>`;
  }
  return `<div style="background:var(--brass-dim);border:1px dashed var(--line);border-radius:10px;padding:10px;margin-top:8px">
    <div style="font-size:11.5px;color:var(--slate);margin-bottom:8px">Send this ticket by:</div>
    <div class="share-row">
      <a class="share-link" href="sms:?body=${body}">📱 SMS</a>

      <a class="share-link" href="mailto:?subject=${subject}&body=${body}">✉️ Email</a>
    </div>
  </div>`;
}

// Where a campaign stands today (UK calendar days) — the same rule the server uses for who may buy.
function campaignState(c) {
  if (c.is_draft) return 'draft';
  if (!c.active) return 'inactive';
  const today = ukTodayISO();
  if (c.opens_on && today < c.opens_on) return 'not_open';
  if (c.closes_on && today > c.closes_on) return 'closed';
  return 'open';
}
function campaignStatusBadge(c) {
  const s = campaignState(c);
  const [cls, text] = { draft: ['warn', 'Draft'], inactive: ['bad', 'Inactive'], not_open: ['warn', 'Opens ' + (c.opens_on ? fmtDay(c.opens_on) : '')], closed: ['bad', 'Closed ' + (c.closes_on ? fmtDay(c.closes_on) : '')], open: ['ok', 'Active'] }[s];
  return `<span class="badge ${cls}">${esc(text)}</span>`;
}

function regSummaryHtml() {
  const R = wiz.reg, n = esc(wiz.name.trim() || 'This form');
  const open = wiz.opens_on ? `People can register from ${fmtDay(wiz.opens_on)}` : 'People can register as soon as you open it';
  const close = wiz.closes_on ? ` until ${fmtDay(wiz.closes_on)}.` : ', with no closing date.';
  const places = wiz.places ? ` ${esc(wiz.places)} place${Number(wiz.places) === 1 ? '' : 's'}${wiz.waitingList ? ', then a waiting list.' : '.'}` : ' There is no limit on places.';
  const money = R.payEnabled ? ` They pay at least £${Number(R.payMin || 0).toFixed(2)} (up to £${Number(R.payMax || 0).toFixed(2)}) as part of registering.` : ' There is no payment.';
  const appr = R.approval ? ' Each application is checked and marked Accepted or Declined.' : '';
  const keep = wiz.keep_until ? ` Names, contact details, answers and any uploaded files are kept until ${fmtDay(wiz.keep_until)} and removed 90 days later, on ${fmtDay(addDaysISO(wiz.keep_until, RETENTION_DAYS_SHOWN))}.` : '';
  return `<b>${n}</b> is a registration form. ${open}${close}${places}${money}${appr} Only SuperAdmin, Finance and Priest can read the answers.${keep}`;
}
function regBuildFormDef() {
  const R = wiz.reg;
  return {
    intro: R.intro, contact_mode: R.contactMode, approval: !!R.approval,
    fields: R.fields.map(f => ({ type: f.type, label: f.label, help: f.help, required: !!f.required, sensitive: !!f.sensitive, options: f.type === 'dropdown' ? String(f.options || '').split('\n').map(x => x.trim()).filter(Boolean) : [] })),
    agreements: R.agreements.map(a => ({ kind: a.kind, text: a.text })),
    payment: R.payEnabled ? { min: Number(R.payMin), max: Number(R.payMax || 500), label: R.payLabel } : null,
  };
}
function regValidateStep(step) {
  const R = wiz.reg;
  if (step === 4) {
    if (wiz.places !== '' && !(Number.isInteger(Number(wiz.places)) && Number(wiz.places) >= 1 && Number(wiz.places) <= 2000)) return 'Places must be a whole number from 1 to 2,000 — or leave it blank for no limit.';
  }
  if (step === 5) {
    for (let i = 0; i < R.fields.length; i++) {
      const f = R.fields[i];
      if (!f.label.trim()) return `Question ${i + 1} needs its wording.`;
      if (f.type === 'dropdown' && String(f.options || '').split('\n').map(x => x.trim()).filter(Boolean).length < 2) return `Question ${i + 1} (${f.label.trim()}): a dropdown needs at least two choices, one per line.`;
    }
  }
  if (step === 6) {
    for (let i = 0; i < R.agreements.length; i++) if (!R.agreements[i].text.trim()) return `Agreement ${i + 1} needs its wording (or remove it).`;
    if (R.payEnabled) {
      const mn = Number(R.payMin), mx = Number(R.payMax || 500);
      if (!(mn >= 1)) return 'The minimum payment must be at least £1 — or choose No payment.';
      if (!(mx >= mn) || mx > 5000) return 'The maximum payment must be at least the minimum, and no more than £5,000.';
    }
  }
  return '';
}

  }
  try {

      <label>Keep the details until <b>*</b></label><input id="rfKeep" type="date" value="${esc(f.keep_until || '')}">
      <button class="primary" style="margin-top:8px" onclick="doRegDates(false)">Save dates</button><div id="rfDatesMsg"></div></div>
    <div class="card"><b>Places</b>
      <div class="muted" style="margin:2px 0 6px">${f.total} taken. Leave blank for no limit.</div>
      <input id="rfPlaces" type="number" min="1" max="2000" inputmode="numeric" value="${esc(f.places == null ? '' : f.places)}">
      <button class="primary" style="margin-top:8px" onclick="doRegPlaces()">Save places</button><div id="rfPlacesMsg"></div></div>
    ${f.places ? '<div class="card" id="wlCard"><b>Waiting list</b><div class="muted" style="margin-top:4px">Loading…</div></div>' : ''}
    <div class="card"><b>More</b>
      <div class="tiny-actions" style="margin-top:8px">
        <button class="small" onclick="doDownloadRegistrations('${f.id}')">⬇ Download all answers (CSV)</button>
        <button class="small" onclick="doRegBin()">Move to Recycle Bin</button>
      </div>
      <p class="muted" style="margin:8px 0 0">Closing a form just pauses it — the link keeps working and says it isn't taking registrations. The Recycle Bin removes it from the lists and the link stops working; the SuperAdmin can restore it. Either way, people's details are removed automatically 90 days after “keep until”.</p></div>
    <div class="card"><b>The form</b>
      <div class="muted" style="margin:2px 0 6px">${(def.fields || []).length} question${(def.fields || []).length === 1 ? '' : 's'} · ${(def.agreements || []).length} agreement${(def.agreements || []).length === 1 ? '' : 's'} · ${def.payment ? `payment £${def.payment.min}–£${def.payment.max}` : 'no payment'} · ${def.approval ? 'each one is checked' : 'no approval step'}</div>
      <ol style="margin:6px 0 0;padding-left:20px;line-height:1.6">${(def.fields || []).map(q => `<li>${q.sensitive ? '🔒 ' : ''}${esc(q.label)}${q.required ? ' *' : ''} <span class="muted">(${esc(REG_TYPE_LABELS[q.type] || q.type)})</span></li>`).join('') || '<li class="muted">No questions of its own — just name and contact.</li>'}</ol>
      <p class="muted" style="margin:8px 0 0">${f.total ? 'People have registered, so the questions can no longer be changed.' : 'To change the questions, make a new form (New form → “Or copy an earlier campaign”) and move this one to the Recycle Bin.'}</p></div>
  </div>`;
  if (f.places) loadWaitingCard();
}
async function doRegBin() {
  if (!confirm(`Move "${regPanel.form.name}" to the Recycle Bin? The link stops working and it leaves the lists. The SuperAdmin can restore it.`)) return;
  try { await call('bin_campaign', { campaign_id: regPanel.id }); toast('✓ Moved to the Recycle Bin'); closeRegForm(); } catch (e) { alert(e.message); }
}
async function regPanelRefresh() { await openRegForm(regPanel.id); }
async function doRegOpen() {
  if (!confirm('Open this form now? It becomes visible to the public and people can start registering.')) return;
  try { await call('open_campaign', { campaign_id: regPanel.id }); toast('✓ Form opened — it is now live'); await regPanelRefresh(); } catch (e) { alert(e.message); }
}
async function doRegActive(active) {
  try { await call('set_campaign_active', { campaign_id: regPanel.id, active }); toast(active ? '✓ Form re-opened' : '✓ Form closed — nobody can register until you re-open it'); await regPanelRefresh(); } catch (e) { alert(e.message); }
}
async function doRegPreview() {
  const w = window.open('', '_blank');
  try {
    const { token } = await call('campaign_preview_link', { campaign_id: regPanel.id });
    const url = `${location.origin}/register.html?campaign_id=${regPanel.id}&preview=${encodeURIComponent(token)}`;
    if (w) { w.location.href = url; toast('✓ Preview opened in a new tab'); } else prompt('Copy this private preview link (it works for 24 hours):', url);
  } catch (e) { if (w) w.close(); alert(e.message); }
}
async function doRegDates(confirmed) {
  const msg = document.getElementById('rfDatesMsg');
  try {
    const r = await call('set_campaign_dates', { campaign_id: regPanel.id, opens_on: document.getElementById('rfOpens').value, closes_on: document.getElementById('rfCloses').value, keep_until: document.getElementById('rfKeep').value, confirm: !!confirmed });
    toast(`✓ Dates saved — details will be removed on ${fmtDay(r.delete_on)}`);
    await regPanelRefresh();
  } catch (e) {
    if (/confirm to remove them/.test(e.message) && !confirmed) { if (confirm(e.message)) return doRegDates(true); return; }
    msg.innerHTML = `<div class="error">${esc(e.message)}</div>`;
  }
}
async function doRegPlaces() {
  const msg = document.getElementById('rfPlacesMsg');
  try { await call('set_registration_places', { campaign_id: regPanel.id, places: document.getElementById('rfPlaces').value }); toast('✓ Places saved'); await regPanelRefresh(); }
  catch (e) { msg.innerHTML = `<div class="error">${esc(e.message)}</div>`; }
}

function wizIsRaffle() { return wiz.kind === 'raffle'; }
// The campaign-specific content, back to a blank slate for the chosen kind (the name is kept).
function wizResetContent() {
  wiz.type = 'physical'; wiz.audience = 'sellers'; wiz.detailsText = ''; wiz.waitingList = false; wiz.reg = newRegState(); wiz.places = '';
  wiz.defaultQty = wizIsRaffle() ? 5 : 0;
  wiz.physPay = ['cash', 'machine']; wiz.onlPay = ['cash', 'machine', 'link'];
  draftTiers = [{ name: '', price: '' }, { name: '', price: '' }];
  draftBlocks = [{ type: 'physical', label: '', range_start: '', range_end: '', number_prefix: '' }];
  wiz.copiedFrom = '';
}
async function openCampaignWizard(startKind) {
  wiz = { kind: startKind || (state.user.role === 'superadmin' ? 'raffle' : 'registration'), template: 'blank', name: '', opens_on: '', closes_on: '', keep_until: '', copiedFrom: '' };
  wizResetContent();
  wizStep = 1;
  wizCampaigns = [];
  drawWizard();
  try { wizCampaigns = (await call('list_campaigns', { include_inactive: true })).campaigns.filter(c => state.user.role === 'superadmin' || c.kind === 'registration'); if (wiz && wizStep === 1) drawWizard(); } catch { /* copying simply isn't offered */ }
  try { if (!wizOrg) wizOrg = (await call('get_org_settings')).organization; } catch { /* the lottery date check is simply skipped */ }
}
function closeCampaignWizard() { const el = document.getElementById('wizardPanel'); if (el) el.remove(); wiz = null; }
function wizCanGoPublic() { return wiz.type !== 'physical'; }   // a public page only ever lists ONLINE tickets
// Keeps the ticket rows in step 5 consistent with whatever ticket type was chosen in step 4 — a row of a
// now-disallowed type is dropped rather than silently kept and rejected later by the server.
function syncWizBlocksToType() {
  const allowed = wiz.type === 'both' ? ['physical', 'digital'] : [wiz.type];
  draftBlocks = draftBlocks.filter(b => allowed.includes(b.type));
  if (!draftBlocks.length) draftBlocks = [{ type: allowed[0], label: '', range_start: '', range_end: '', number_prefix: '' }];
}
function setWizKind(k) { if (wiz.kind === k) return; wiz.kind = k; wiz.template = 'blank'; wizResetContent(); drawWizard(); }
function wizApplyTemplate(id) {
  const t = (WIZ_TEMPLATES[wiz.kind] || []).find(x => x.id === id);
  wizResetContent(); wiz.template = id;
  if (t && t.apply) t.apply();
  drawWizard();
}
// Copy last year's (or any existing campaign): everything except the dates, which must be chosen afresh.
function wizCopyCampaign(id) {
  const c = wizCampaigns.find(x => x.id === id); if (!c) return;
  if (c.kind === 'registration') {   // a registration form: copy the whole form, with the dates left to choose afresh
    const d = c.form_def || {};
    wiz.kind = 'registration'; wiz.template = 'blank'; wizResetContent();
    wiz.name = c.name + ' (copy)'; wiz.detailsText = c.details_text || '';
    wiz.places = c.places == null ? '' : String(c.places); wiz.waitingList = !!c.waiting_list && c.places != null;
    wiz.reg = Object.assign(newRegState(), { intro: d.intro || '', contactMode: d.contact_mode || 'either', approval: !!d.approval,
      fields: (d.fields || []).map(f => regClone({ type: f.type, label: f.label, help: f.help || '', required: !!f.required, sensitive: !!f.sensitive, options: (f.options || []).join('\n') })),
      agreements: (d.agreements || []).map(a => ({ kind: a.kind, text: a.text })),
      payEnabled: !!d.payment, payMin: d.payment ? String(d.payment.min) : '', payMax: d.payment ? String(d.payment.max) : '500', payLabel: d.payment ? (d.payment.label || '') : '' });
    wiz.opens_on = ''; wiz.closes_on = ''; wiz.keep_until = ''; wiz.copiedFrom = c.name;
    drawWizard(); return;
  }
  wiz.kind = c.kind === 'raffle' ? 'raffle' : 'event'; wiz.template = 'blank';
  wiz.name = c.name + ' (copy)'; wiz.detailsText = c.details_text || '';
  const hasP = c.blocks.some(b => b.type === 'physical'), hasD = c.blocks.some(b => b.type === 'digital');
  wiz.type = hasP && hasD ? 'both' : hasD ? 'digital' : 'physical';
  wiz.audience = !hasD ? 'sellers' : c.public_only ? 'public' : c.public_page_enabled ? 'both' : 'sellers';
  draftTiers = c.tiers.map(t => ({ name: t.name, price: String(t.price) }));
  draftBlocks = c.blocks.map(b => ({ type: b.type, label: b.label, range_start: String(b.range_start), range_end: String(b.range_end), number_prefix: b.number_prefix || '' }));
  wiz.defaultQty = c.default_ticket_qty || 0;
  wiz.physPay = c.physical_payment_methods || ['cash', 'machine']; wiz.onlPay = c.online_payment_methods || ['cash', 'machine', 'link'];
  wiz.opens_on = ''; wiz.closes_on = ''; wiz.keep_until = '';
  wiz.waitingList = !!c.waiting_list && wizWaitingApplicable();
  wiz.copiedFrom = c.name;
  drawWizard();
}
function setWizType(t) {
  wiz.type = t;
  if (!wizCanGoPublic() && wiz.audience !== 'sellers') wiz.audience = 'sellers';
  if (!wizWaitingApplicable()) wiz.waitingList = false;
  syncWizBlocksToType();
  drawWizard();
}
function setWizAudience(a) { wiz.audience = a; if (!wizWaitingApplicable()) wiz.waitingList = false; drawWizard(); }
function goToWizStep(n) { wizStep = n; drawWizard(); }

// The same ordering rules the server applies, so a mistake shows up here in plain words first.
function wizDateProblem() {
  const { opens_on: o, closes_on: c, keep_until: k } = wiz;
  if (!k) return 'Pick the date to keep the details until. Names and contact details are removed 90 days after it, so they are never kept for ever.';
  if (o && c && c < o) return "The closing date can't be before the opening date.";
  if (c && k < c) return 'Keep the details until a date on or after the closing date.';
  if (o && k < o) return 'Keep the details until a date on or after the opening date.';
  return '';
}
function wizValidate(step) {
  if (wiz.kind === 'registration') { const e = regValidateStep(step); if (e) return e; }
  if (step === 2) return wiz.name.trim() ? '' : 'Give the campaign a name.';
  if (step === 3) return wizDateProblem();
  if (step === 5 && wiz.kind !== 'registration') {
    if (!draftTiers.some(t => t.name.trim() !== '' && t.price !== '')) return 'Add at least one price.';
    const usable = draftBlocks.filter(b => b.range_start !== '' && b.range_end !== '');
    if (!usable.length) return 'Add at least one set of tickets with a first and last number.';
    if (wizCanGoPublic() && wiz.audience !== 'sellers' && !usable.some(b => b.type === 'digital')) return 'A public buy page needs at least one online set of tickets.';
  }
  return '';
}
function wizNext() {
  const err = wizValidate(wizStep);
  const errEl = document.getElementById('wizErr');
  if (err) { if (errEl) errEl.innerHTML = `<div class="error">${esc(err)}</div>`; return; }
  wizStep = Math.min(wizSteps().length, wizStep + 1);
  drawWizard();
}
function wizBack() { wizStep = Math.max(1, wizStep - 1); drawWizard(); }
function wizKeepSameAsClose() { if (!wiz.closes_on) return; wiz.keep_until = wiz.closes_on; const el = document.getElementById('wKeep'); if (el) el.value = wiz.keep_until; wizDatesNote(); }
// Live note under the dates: when the details will actually be removed. Updates in place (no redraw) so typing isn't interrupted.
function wizDatesNote() {
  const el = document.getElementById('wizDelNote'); if (!el) return;
  el.textContent = wiz.keep_until ? `Names, mobile numbers, emails and IP addresses will be removed on ${fmtDay(addDaysISO(wiz.keep_until, RETENTION_DAYS_SHOWN))}, ${RETENTION_DAYS_SHOWN} days after that. Amounts and ticket numbers are kept for the accounts.` : '';
}

function wizSummaryHtml() {
  const n = esc(wiz.name.trim() || 'This campaign');
  const kind = wizIsRaffle() ? 'raffle' : 'ticket event';
  const who = { public: 'on the public page only', sellers: 'by Sellers only', both: 'by Sellers and on the public page' }[wiz.audience];
  const tiers = draftTiers.filter(t => t.name.trim() && t.price !== '');
  const blocks = draftBlocks.filter(b => b.range_start !== '' && b.range_end !== '');
  const places = blocks.reduce((s, b) => s + (Number(b.range_end) - Number(b.range_start) + 1), 0);
  const prices = tiers.map(t => `${esc(t.name)} £${Number(t.price).toFixed(2)}`).join(', ');
  const open = wiz.opens_on ? `Sales open on ${fmtDay(wiz.opens_on)}.` : 'Sales open as soon as you open it.';
  const close = wiz.closes_on ? `They close on ${fmtDay(wiz.closes_on)}.` : 'There is no closing date.';
  const lot = lotteryWarning(wiz.kind, wiz.closes_on, wizOrg);
  const keep = wiz.keep_until ? `Names and contact details are kept until ${fmtDay(wiz.keep_until)} and removed 90 days later, on ${fmtDay(addDaysISO(wiz.keep_until, RETENTION_DAYS_SHOWN))}.` : '';
  return `<b>${n}</b> is a ${kind}, sold ${who}. ${open} ${close} ${prices || 'No prices yet'}; ${places} ticket${places === 1 ? '' : 's'} in total. ${wizWaitingApplicable() ? (wiz.waitingList ? 'When every place is taken, a waiting list opens. ' : 'When every place is taken, sales stop. ') : ''}${keep}${lot ? ` <b class="warnText">${lot}</b>` : ''}`;
}

function wizStepHtml() {

    <button type="button" class="kindcard ${wiz.kind === 'registration' ? 'on' : ''}" onclick="setWizKind('registration')"><b>📝 Registration</b><span>People fill in a form you design — details first, then an optional payment. A sacrament application, a children's film night, a seniors' evening.</span></button>

  }

    <label style="margin-top:14px">What should people know? <span class="muted">(optional — ${wizIsRaffle() ? 'prizes, draw date, tagline' : 'what it is, when, where'}; ${wiz.kind === 'registration' ? 'shown under ℹ️ Details on the form' : 'shown on the public page and in every ticket message'})</span></label>

  if (wizStep === 3) return `
    <label style="margin-top:0">Opens <span class="muted">(optional — blank means as soon as you open it)</span></label>
    <input type="date" id="wOpens" value="${esc(wiz.opens_on)}" oninput="wiz.opens_on=this.value">
    <label>Closes <span class="muted">(optional — the last day people can buy)</span></label>
    <input type="date" id="wCloses" value="${esc(wiz.closes_on)}" oninput="wiz.closes_on=this.value">
    <label>Keep the details until <b>*</b> <span class="muted">${wiz.kind === 'registration' ? '(usually the end of the programme)' : wizIsRaffle() ? '(for a raffle, usually the draw date)' : '(usually the date of the event)'}</span></label>
    <input type="date" id="wKeep" value="${esc(wiz.keep_until)}" oninput="wiz.keep_until=this.value; wizDatesNote()">
    <button type="button" class="link" style="margin-top:6px" onclick="wizKeepSameAsClose()">Same as the closing date</button>
    <p class="muted" id="wizDelNote" style="margin-top:8px">${wiz.keep_until ? `Names, mobile numbers, emails and IP addresses will be removed on ${fmtDay(addDaysISO(wiz.keep_until, RETENTION_DAYS_SHOWN))}, ${RETENTION_DAYS_SHOWN} days after that. Amounts and ticket numbers are kept for the accounts.` : ''}</p>`;
  if (wizStep === 4) { const canPublic = wizCanGoPublic(); return `
    <label style="margin-top:0">What kind of tickets?</label>
    <div class="toggle" style="width:100%;flex-wrap:wrap">
      <button type="button" style="flex:1 1 110px" class="${wiz.type==='physical'?'active':''}" onclick="setWizType('physical')">🎫 Printed</button>
      <button type="button" style="flex:1 1 110px" class="${wiz.type==='digital'?'active alt':''}" onclick="setWizType('digital')">💻 Online</button>
      <button type="button" style="flex:1 1 110px" class="${wiz.type==='both'?'active alt':''}" onclick="setWizType('both')">🔀 Both</button>
    </div>
    <p class="muted" style="margin-top:8px">${({ physical: 'Printed tickets, handed over by a Seller.', digital: 'No printed tickets. Each buyer gets theirs on their phone.', both: 'A mix of printed and online tickets in the same campaign.' })[wiz.type]}</p>

      ${canPublic ? `<button type="button" style="flex:1 1 110px" class="${wiz.audience==='both'?'active alt':''}" onclick="setWizAudience('both')">🔀 Both</button>` : ''}
    </div>

    <div id="blockRows">${draftBlocks.map((b,i)=>blockRowHtml(b,i,locked)).join('')}</div>

  // step 6: review

  const blockList = draftBlocks.filter(b=>b.range_start!==''&&b.range_end!=='').map(b=>`${b.type==='digital'?'Online':'Printed'} ${b.range_start}–${b.range_end}`).join(', ') || '—';
  return `
    <div class="card" style="background:var(--brass-dim);margin:0 0 12px"><p style="margin:0;line-height:1.5">${wizSummaryHtml()}</p></div>

    <div class="stat"><span>Dates <button type="button" class="link" onclick="goToWizStep(3)">Edit</button></span><b>${wiz.opens_on ? fmtDay(wiz.opens_on) : 'any time'} to ${wiz.closes_on ? fmtDay(wiz.closes_on) : 'no end'}</b></div>
    <div class="stat"><span>Tickets <button type="button" class="link" onclick="goToWizStep(4)">Edit</button></span><b>${({physical:'Printed',digital:'Online',both:'Printed and online'})[wiz.type]} · ${audienceLabel}</b></div>

async function doSaveSeriesEnd(blockId, rangeStart, oldEnd) {

  if (input.value === '' || !Number.isInteger(newEnd)) { seriesEdit.msgs[blockId] = '<div class="error">Enter the last number as a whole number.</div>'; drawSeriesEditor(); return; }

  try {

// The books check: does every payment that says it is paid hold its tickets, is any ticket paid for twice, do tickets and payments agree.
function booksCardHtml(b) {
  if (b.error) return `<div class="card"><div class="hint">The books check could not run: ${esc(b.error)}</div></div>`;
  if (b.ok) return `<div class="card" style="border-left:5px solid var(--good)"><b style="color:var(--good)">✓ The books add up</b><div class="muted">Checked ${b.checked.payments} payments and ${b.checked.tickets} sold tickets: every paid payment holds its tickets, no ticket is paid for twice, and tickets and payments agree.</div></div>`;
  const fixable = ['paid_without_tickets', 'ticket_sold_twice', 'paid_without_code', 'amount_mismatch'];
  return `<div class="card" style="border:2px solid var(--bad)"><h3 style="margin-top:0;color:var(--bad)">The books need a look</h3>
    ${b.problems.map(p => `<div style="border-top:1px solid var(--line);padding:10px 0">${esc(p.message)}${p.payment_id && fixable.includes(p.code) ? `<div style="margin-top:6px"><button class="small" onclick="doBooksSorted('${p.payment_id}')">I've dealt with this</button></div>` : ''}</div>`).join('')}
    <div class="muted">Fix what it describes (refund in SumUp, or give new numbers), then press “I've dealt with this”. It stays on record.</div></div>`;
}

  try { await call('payment_attention_done', { payment_id: paymentId }); toast('✓ Marked as dealt with'); renderOverviewTab(); }
