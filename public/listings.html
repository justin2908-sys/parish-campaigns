    var ae = document.activeElement && document.activeElement.id, sy = window.scrollY;
    $('app').innerHTML = html; window.scrollTo(0, sy);
    if (ae && $(ae) && /^f(Title|Desc|Price|Email|Email2|Name|Other)$/.test(ae)) { var el = $(ae); el.focus(); try { el.setSelectionRange(el.value.length, el.value.length); } catch (e) { /* not for every type */ } }
  }
  function drawFormBar() { var b = $('sendBtn'); if (!b) return; var amt = chosenAmount(); b.textContent = busy ? 'Sending…' : (amt > 0 ? 'Pay ' + gbp(amt) + ' and send for approval' : 'Send for approval'); b.disabled = busy || form.working > 0; }
  // A phone photo is several megabytes. This makes two small copies in the phone before anything is sent: a thumbnail for the list and a bigger one to look at.
  function shrink(bmp, max, type, q, limit) {
    var scale = Math.min(1, max / Math.max(bmp.width, bmp.height)), w = Math.max(1, Math.round(bmp.width * scale)), h = Math.max(1, Math.round(bmp.height * scale));
    var attempt = function (w2, h2, qq) {
      var c = document.createElement('canvas'); c.width = w2; c.height = h2; var g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, w2, h2); g.drawImage(bmp, 0, 0, w2, h2);
      return new Promise(function (res) { c.toBlob(res, type, qq); }).then(function (b) { if ((!b || b.type !== type) && type === 'image/webp') return new Promise(function (res) { c.toBlob(res, 'image/jpeg', qq); }); return b; });
    };
    var go = function (w2, h2, qq, tries) { return attempt(w2, h2, qq).then(function (b) { if (!b) throw new Error('x'); if (b.size <= limit || tries > 6) return b; return qq > 0.3 ? go(w2, h2, qq - 0.1, tries + 1) : go(Math.round(w2 * 0.8), Math.round(h2 * 0.8), 0.5, tries + 1); }); };
    return go(w, h, q, 0);
  }
  function b64(blob) { return new Promise(function (ok, no) { var rd = new FileReader(); rd.onload = function () { ok(String(rd.result).split(',')[1]); }; rd.onerror = no; rd.readAsDataURL(blob); }); }
  function addPhotos(files) {
    var room = data.new_listing.max_images - form.photos.length, list = Array.prototype.slice.call(files, 0, room);
    if (!list.length) return;
    form.working += list.length; drawFormBar();
    list.reduce(function (chain, file) {
      return chain.then(function () {
        return createImageBitmap(file).then(function (bmp) {
          return Promise.all([shrink(bmp, 240, 'image/webp', 0.6, 38000), shrink(bmp, 900, 'image/webp', 0.62, 145000)]).then(function (bl) { if (bmp.close) bmp.close(); return Promise.all([b64(bl[0]), b64(bl[1])]).then(function (x) { form.photos.push({ t: x[0], f: x[1], preview: URL.createObjectURL(bl[0]) }); }); });
        }).catch(function () { say('That picture could not be read. Please try a different one.'); }).then(function () { form.working--; });
      });
    }, Promise.resolve()).then(function () { renderNew(); });
  }
  function submit() {
    if (busy) return;
    var f = form; badField = ''; errMsg = '';
    if (!f.kind) { badField = 'kind'; errMsg = 'Please say whether it is for sale, free, or a service.'; }
    else if (!f.category) { badField = 'category'; errMsg = 'Please choose a group.'; }
    else if (f.title.trim().length < 5) { badField = 'title'; errMsg = 'Please give it a title (at least 5 characters).'; }
    else if (f.description.trim().length < 20) { badField = 'description'; errMsg = 'Please describe it (at least 20 characters).'; }
    else if (hasContact(f.title + ' ' + f.description + ' ' + f.price + ' ' + f.name)) { errMsg = 'Please take out phone numbers, email addresses and web links. People contact you through the “Copy email address” button.'; }
    else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(f.email.trim())) { badField = 'email'; errMsg = 'Please give your email address.'; }
    else if (f.email2.trim().toLowerCase() !== f.email.trim().toLowerCase()) { badField = 'email2'; errMsg = 'The two email addresses do not match. Please check them.'; }
    else if (isNaN(chosenAmount()) || chosenAmount() < 0) { badField = 'amount'; errMsg = 'Please type an amount (0 is fine).'; }
    else if (!f.agree) { badField = 'agree'; errMsg = 'Please tick the box to say you understand.'; }
    if (errMsg) { renderNew(); var e = document.querySelector('.err'); if (e) e.scrollIntoView({ block: 'nearest' }); var bad = document.querySelector('.bad'); if (bad && bad.scrollIntoView) bad.scrollIntoView({ block: 'center' }); return; }
    busy = true; renderNew();
    if (!attemptRef) attemptRef = 'a' + Math.random().toString(36).slice(2, 12) + Date.now().toString(36);
    var body = { slug: slug, kind: f.kind, category: f.category, title: f.title, description: f.description, price_text: f.kind === 'free' ? '' : f.price, display_name: f.name, email: f.email.trim(), email_confirm: f.email2.trim(), days: f.days, amount: chosenAmount(), agree: true,
      images: f.photos.map(function (p) { return { t: p.t, f: p.f }; }), client_ref: attemptRef, website: '' };
    fetch('/api/public_listing_create', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (r) {
        if (r.ok && r.d.token) { form = null; var pay = /^https:\/\/[^\s]+$/i.test(r.d.pay_url || '') ? r.d.pay_url : ''; if (pay) { location.href = pay; return; } location.href = '/listings.html?manage=' + r.d.token; return; }
        busy = false; attemptRef = ''; errMsg = (r.d && r.d.error) || W.failed; renderNew();
      })
      .catch(function () { busy = false; errMsg = W.failedHelp; renderNew(); });
  }

  // ---- the lister's own page
  var polls = 0, pollTimer = null;
  function managePage(m) {
    var back = m.org_slug ? '/listings/' + m.org_slug : '';
    var head = { awaiting_payment: 'Waiting for your payment…', pending_review: 'Thank you. The office will look at it soon.', live: 'Your listing is live', rejected: 'Your listing was not accepted', withdrawn: 'You took this listing down', removed: 'This listing was taken down', expired: 'Your listing has ended', cancelled: 'This listing was not completed' }[m.status] || m.status;
    var html = mast(m.title, m.org_name || W.title, back) + '<main class="gutter"><div class="wrap"><div class="status"><h1>' + esc(head) + '</h1>';
    if (m.status === 'pending_review') html += '<p>Nothing is shown to anyone until it is approved. Your ' + (m.days === 30 ? 'month' : m.days / 7 + ' week' + (m.days > 7 ? 's' : '')) + ' start when it is approved.</p>';
    if (m.status === 'live') html += '<p>Live until <b style="color:var(--fg)">' + esc(m.ends) + '</b> (' + esc(W.daysLeft(m.days_left)) + '). People write to you at the email address you gave.</p><div class="stats" style="width:100%"><div class="stat"><b>' + m.views + '</b>people have looked</div><div class="stat"><b>' + m.contacts + '</b>asked for your email</div></div>';
    if (m.status === 'awaiting_payment') html += '<p>We are checking with the card payment. This page updates by itself.</p>' + (/^https:\/\//.test(m.pay_url || '') ? '<a class="btn solid" href="' + esc(m.pay_url) + '">Go to the payment page</a>' : '');
    if (m.status === 'rejected' || m.status === 'removed') html += '<p class="note" style="width:100%">' + esc(m.review_note || 'The office decided it was not suitable.') + '</p><p>If you paid a fee and would like it returned, please ask at the parish office' + (m.org_contact_email ? '' : '') + '.</p>';
    if (m.status === 'cancelled') html += '<p>The payment was not completed, so nothing was listed.</p>' + (back ? '<a class="btn solid" href="' + esc(back) + '#new">Start again</a>' : '');
    if (m.thumbs && m.thumbs.length && m.status !== 'cancelled') html += '<div class="photos">' + m.thumbs.map(function (p) { return '<div class="ph"><img src="' + esc((m.img_base || '') + p) + '" alt="" loading="lazy" width="88" height="88"></div>'; }).join('') + '</div>';
    html += '<div class="acts" style="width:100%">' + '<button class="btn" type="button" data-copylink>' + ico(I.link, 20) + 'Copy the link to this page</button>' + (m.can_withdraw ? '<button class="btn danger" type="button" data-withdraw>Take it down</button>' : '') + '</div>';
    html += '<p class="small">Keep this page’s link. It is the only way back to your listing. The church does not check or guarantee listings and takes no part in any deal.</p></div></div></main>';
    $('app').innerHTML = html; document.title = m.title + ' · ' + W.title;
    clearTimeout(pollTimer);
    if (m.status === 'awaiting_payment' && polls++ < 40) pollTimer = setTimeout(function () { fetch('/api/public_listing_manage', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token: manageToken }) }).then(function (r) { return r.json(); }).then(function (d) { if (d && d.status) managePage(d); }).catch(function () { /* next beat */ }); }, 4000);
  }

  // ---- events
  document.addEventListener('click', function (e) {
    var t = e.target, b;
    if ((b = t.closest('[data-open]'))) { openSheet(b.getAttribute('data-open')); return; }
    if (t.closest('[data-invite-add]')) { closeInvite(true); return; }
    if (t.closest('[data-invite-close]') || t.id === 'invite') { closeInvite(false); return; }
    if (t.closest('[data-close]') || t.id === 'sheet') { closeSheet(); return; }
    if (t.closest('[data-copyemail]')) { copyEmail(); return; }
    if (t.closest('[data-mailto]')) { writeEmail(); return; }
    if (t.closest('[data-report]')) { reporting = true; $('sheetHost').innerHTML = sheetHtml(detail); var rw = $('rpWhy'); if (rw) rw.focus(); return; }
    if (t.closest('[data-cancelreport]')) { reporting = false; $('sheetHost').innerHTML = sheetHtml(detail); return; }
    if (t.closest('[data-sendreport]')) { sendReport(); return; }
    if (t.closest('[data-notice]')) { noticeOpen = !noticeOpen; var n = document.querySelector('.notice'); if (n) n.outerHTML = noticeHtml(); return; }
    if ((b = t.closest('[data-chip]'))) { kindSel = ''; catSel = ''; q = ''; var s0 = $('fSearch'); if (s0) s0.value = ''; drawList(); return; }
    if ((b = t.closest('[data-kind]'))) { kindSel = kindSel === b.getAttribute('data-kind') ? '' : b.getAttribute('data-kind'); drawList(); return; }
    if ((b = t.closest('[data-catsel]'))) { catSel = catSel === b.getAttribute('data-catsel') ? '' : b.getAttribute('data-catsel'); drawList(); return; }
    if (t.closest('[data-clear]')) { q = ''; var s1 = $('fSearch'); if (s1) { s1.value = ''; s1.focus(); } drawList(); return; }
    if ((b = t.closest('[data-say]'))) { q = b.getAttribute('data-say'); var s2 = $('fSearch'); if (s2) s2.value = q; drawList(); return; }
    if ((b = t.closest('[data-fkind]'))) { form.kind = b.getAttribute('data-fkind'); badField = ''; errMsg = ''; renderNew(); return; }
    if ((b = t.closest('[data-fcat]'))) { form.category = b.getAttribute('data-fcat'); badField = ''; errMsg = ''; renderNew(); return; }
    if ((b = t.closest('[data-fdays]'))) { form.days = Number(b.getAttribute('data-fdays')); renderNew(); return; }
    if ((b = t.closest('[data-pay]'))) { form.payMode = b.getAttribute('data-pay'); badField = ''; errMsg = ''; renderNew(); if (form.payMode === 'other' && $('fOther')) $('fOther').focus(); return; }
    if ((b = t.closest('[data-rmphoto]'))) { form.photos.splice(Number(b.getAttribute('data-rmphoto')), 1); renderNew(); return; }
    if (t.closest('#sendBtn')) { submit(); return; }
    if (t.closest('#retry')) { start(); return; }
    if (t.closest('[data-copylink]')) { var u = location.href; try { navigator.clipboard.writeText(u).then(function () { say('Link copied'); }, function () { say('Link: ' + u); }); } catch (x) { say('Link: ' + u); } return; }
    if (t.closest('[data-withdraw]')) { var w = t.closest('[data-withdraw]'); if (!w.getAttribute('data-sure')) { w.setAttribute('data-sure', '1'); w.textContent = 'Yes, take it down'; return; } fetch('/api/public_listing_withdraw', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token: manageToken }) }).then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); }).then(function (r) { if (r.ok) { say('Your listing has been taken down'); startManage(); } else say(r.d.error || W.failed); }).catch(function () { say(W.failedHelp); }); return; }
  });
  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t && t.id === 'fPhoto') { addPhotos(t.files); return; }
    if (t && t.id === 'fAgree') { form.agree = t.checked; if (t.checked) { badField = ''; errMsg = ''; var a = document.querySelector('.agree'); if (a) a.classList.remove('bad'); var er = document.querySelector('.err'); if (er) er.remove(); } return; }
  });
  document.addEventListener('input', function (e) {
    var t = e.target; if (!t) return;
    if (t.id === 'fSearch') { var v = t.value; clearTimeout(searchTimer); searchTimer = setTimeout(function () { q = v; drawList(); }, 120); return; }
    if (!form) return;
    var map = { fTitle: 'title', fDesc: 'description', fPrice: 'price', fName: 'name', fEmail: 'email', fEmail2: 'email2', fOther: 'other' };
    if (map[t.id]) {
      form[map[t.id]] = t.value; if (t.id === 'fOther') drawFormBar();
      if (t.id === 'fEmail' || t.id === 'fEmail2') { var em = $('emailMatch'), mt = emailMatchText(); if (em) { em.textContent = mt || 'To be sure we have it right.'; em.style.color = mt.indexOf('✓') === 0 ? 'var(--brand-text)' : (mt ? 'var(--bad)' : ''); } }
      if (t.id === 'fTitle' || t.id === 'fDesc' || t.id === 'fPrice') { var f = t.closest('.f'); if (f) { var h = f.querySelector('.warnline'); if (hasContact(t.value)) { if (!h) { var sp = document.createElement('span'); sp.className = 'warnline'; sp.textContent = 'Please take out phone numbers, email addresses and web links. People contact you through a button that hands them your email.'; f.appendChild(sp); } } else if (h) h.remove(); var help = f.querySelector('.help'); if (help && t.id === 'fTitle') help.textContent = t.value.length + ' of 70'; } }
    }
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { if ($('invite')) closeInvite(false); else if (detail) closeSheet(); else if (e.target && e.target.id === 'fSearch' && q) { q = ''; e.target.value = ''; drawList(); } } });
  function route() {
    if (!data) return;
    closeSheet();
    if (location.hash === '#new') { if (!form) form = newForm(); busy = false; renderNew(); window.scrollTo(0, 0); }
    else { form = null; renderBrowse(); if (shouldInvite()) showInvite(); }
  }
  window.addEventListener('hashchange', route);

  function take(r) {
    if (manageToken) {
      if (r && r.ok && r.d && r.d.status) { managePage(r.d); return; }
      if (r && r.status === 404) { status('We could not find that listing.', 'Please check the link, or ask at the parish office.', false, ''); return; }
      status(W.failed, W.failedHelp, true, ''); return;
    }
    if (!r) { status(W.failed, W.failedHelp, true, slug ? '/go/' + slug : ''); return; }
    if (r.status === 404) { status(W.closed, W.closedHelp, false, slug ? '/go/' + slug : ''); return; }
    if (r.ok && r.d && r.d.listings) { data = r.d; prep(); route(); return; }
    status(W.failed, W.failedHelp, true, slug ? '/go/' + slug : '');
  }
  function fetchJson(url, body) { return fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }).then(function (r) { return r.json().catch(function () { return {}; }).then(function (d) { return { ok: r.ok, status: r.status, d: d }; }); }).catch(function () { return null; }); }
  function startManage() { fetchJson('/api/public_listing_manage', { token: manageToken }).then(take); }
  function load() { fetchJson('/api/public_listings', { slug: slug }).then(function (r) { if (r && r.ok && r.d && r.d.listings) { data = r.d; prep(); if (!detail && location.hash !== '#new') renderBrowse(); } }); }
  function start() {
    if (!manageToken && !slug) { status(W.closed, W.closedHelp, false, ''); return; }
    var p = P.p; P.p = null;
    if (!p) p = fetchJson(manageToken ? '/api/public_listing_manage' : '/api/public_listings', manageToken ? { token: manageToken } : { slug: slug });
    p.then(take);
  }
  status(W.loading, '', false, '');
  start();
})();
</script>
