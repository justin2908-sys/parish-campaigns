<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#225840">
<title>Make a donation</title>
<script>
// Ask for the page's data (or the donation's status) at once, while the styles and fonts are still downloading.
window.__donP = (function () {
  var qs = new URLSearchParams(location.search), donation = qs.get('donation');
  var m = /^\/donate\/([^\/?#]+)\/?$/.exec(location.pathname), slug = m ? decodeURIComponent(m[1]).toLowerCase() : '';
  if (!window.fetch || (!donation && !slug)) return { slug: slug, donation: donation, p: null };
  var ctl = window.AbortController ? new AbortController() : null;
  if (ctl) setTimeout(function () { ctl.abort(); }, 25000);
  var p = fetch(donation ? '/api/public_donation_status' : '/api/public_donation_info', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(donation ? { donation_id: donation } : { slug: slug }), signal: ctl ? ctl.signal : undefined })
    .then(function (r) { return r.json().catch(function () { return {}; }).then(function (d) { return { ok: r.ok, status: r.status, d: d }; }); })
    .catch(function () { return null; });
  return { slug: slug, donation: donation, p: p };
})();
</script>
<style>
@font-face { font-family:'Hanken Grotesk'; font-style:normal; font-weight:400 700; font-display:swap; src:url('/fonts/HankenGrotesk-400-700.woff2') format('woff2'); }
@font-face { font-family:'Spectral'; font-style:normal; font-weight:500; font-display:swap; src:url('/fonts/Spectral-500.woff2') format('woff2'); }
@font-face { font-family:'Spectral'; font-style:normal; font-weight:600; font-display:swap; src:url('/fonts/Spectral-600.woff2') format('woff2'); }
:root {
  --bg:#f3f4f1; --surface:#ffffff; --fg:#151c18; --muted:#3d4843; --line:#c9d0cb;
  --brand:#225840; --brand-text:#225840; --brand-tint:#e0eee6;
  --warn:#7a3f00; --warn-tint:#fbeccd; --bad:#a31f1f; --bad-tint:#fbe3e3;
  --font-display:"Spectral", Georgia, "Times New Roman", serif;
  --font-body:"Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#101512; --surface:#1b2220; --fg:#f1f4f0; --muted:#c0cbc4; --line:#3a4640;
    --brand:#2f7a58; --brand-text:#9fdcbd; --brand-tint:#1f3329;
    --warn:#f5c070; --warn-tint:#3a2a10; --bad:#ff9a9a; --bad-tint:#3a1c1c;
    color-scheme:dark;
  }
}
:root[data-theme="dark"] {
  --bg:#101512; --surface:#1b2220; --fg:#f1f4f0; --muted:#c0cbc4; --line:#3a4640;
  --brand:#2f7a58; --brand-text:#9fdcbd; --brand-tint:#1f3329;
  --warn:#f5c070; --warn-tint:#3a2a10; --bad:#ff9a9a; --bad-tint:#3a1c1c;
  color-scheme:dark;
}
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html { -webkit-text-size-adjust:100%; }
body { margin:0; background:var(--bg); color:var(--fg); font-family:var(--font-body); font-size:1.0625rem; line-height:1.4; overflow-wrap:break-word; }
a { color:inherit; text-decoration:none; }
button, input { font:inherit; color:inherit; }
button { cursor:pointer; }
:focus-visible { outline:4px solid var(--brand-text); outline-offset:2px; border-radius:6px; }
.gutter { padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width:560px; margin:0 auto; min-width:0; }
[hidden] { display:none !important; }
.mast { background:var(--brand); color:#fff; padding-top:max(12px, env(safe-area-inset-top, 0px)); padding-bottom:12px; }
.mast .id { display:flex; align-items:center; gap:12px; }
.back { flex:none; width:48px; height:48px; border-radius:50%; border:2px solid rgba(255,255,255,.55); display:grid; place-items:center; color:#fff; }
.mast h1 { margin:0; font-family:var(--font-display); font-weight:600; font-size:1.5rem; line-height:1.1; text-wrap:balance; }
.mast small { display:block; font-family:var(--font-body); font-weight:500; font-size:.9375rem; opacity:.9; margin-bottom:2px; }
main { padding-top:14px; padding-bottom:150px; display:grid; grid-template-columns:minmax(0,1fr); gap:14px; }
.panel { background:var(--surface); border:2px solid var(--line); border-radius:16px; padding:14px; display:grid; grid-template-columns:minmax(0,1fr); gap:10px; }
.panel h2 { margin:0; font-family:var(--font-display); font-weight:600; font-size:1.3rem; }
.intro { margin:0; color:var(--muted); }
.hero { display:flex; gap:12px; align-items:center; }
.heart { flex:none; width:56px; height:56px; border-radius:50%; background:var(--brand-tint); color:var(--brand-text); display:grid; place-items:center; }
.quick { display:grid; grid-template-columns:repeat(4, minmax(0, 1fr)); gap:8px; }
.q { min-height:56px; border-radius:12px; border:2px solid var(--line); background:var(--surface); font-weight:700; font-size:1.1rem; font-variant-numeric:tabular-nums; }
.q[aria-pressed="true"] { border-color:var(--brand-text); background:var(--brand-tint); color:var(--brand-text); }
.amt { display:flex; align-items:center; gap:8px; border:2px solid var(--line); border-radius:14px; background:var(--surface); padding:0 14px; }
.amt:focus-within { border-color:var(--brand-text); box-shadow:0 0 0 3px var(--brand-tint); }
.amt span { font-family:var(--font-display); font-size:2rem; font-weight:600; }
.f .amt input { flex:1; min-width:0; width:auto; border:0; border-radius:0; padding:0; box-shadow:none; background:transparent; min-height:64px; font-family:var(--font-display); font-size:2rem; font-weight:600; font-variant-numeric:tabular-nums; outline:none; }
.f .amt input:focus { border:0; box-shadow:none; }
.f { display:grid; grid-template-columns:minmax(0,1fr); gap:4px; }
.f label { font-weight:700; }
.f input { width:100%; min-height:52px; padding:10px 12px; border:2px solid var(--line); border-radius:12px; background:var(--surface); font-size:1.0625rem; }
.f input:focus { border-color:var(--brand-text); outline:none; box-shadow:0 0 0 3px var(--brand-tint); }
.f .help { color:var(--muted); font-size:.9375rem; }
.f.bad input, .amt.bad { border-color:var(--bad); }
.chips { display:flex; flex-wrap:wrap; gap:8px; }
.chip { min-height:44px; padding:0 14px; border-radius:999px; border:2px solid var(--line); background:var(--surface); font-weight:600; font-size:.9375rem; }
.chip[aria-pressed="true"] { background:var(--brand); border-color:var(--brand); color:#fff; }
.privacy { margin:0; padding:10px 12px; border-radius:12px; background:var(--brand-tint); color:var(--fg); font-size:.9375rem; line-height:1.4; }
.privacy a { display:flex; align-items:center; min-height:44px; color:var(--brand-text); font-weight:700; text-decoration:underline; text-underline-offset:3px; }
.trap { position:absolute; left:-9999px; width:1px; height:1px; overflow:hidden; }
.bar { position:fixed; left:0; right:0; bottom:0; z-index:20; background:var(--surface); border-top:2px solid var(--line); padding-top:10px; padding-bottom:calc(10px + env(safe-area-inset-bottom, 0px)); }
.bar .wrap { display:grid; grid-template-columns:minmax(0,1fr); gap:8px; }
.err { margin:0; padding:10px 12px; border-radius:12px; background:var(--bad-tint); color:var(--bad); font-weight:600; }
.pay { display:flex; align-items:center; justify-content:center; gap:8px; width:100%; min-height:56px; padding:0 18px; border:0; border-radius:14px; background:var(--brand); color:#fff; font-weight:700; font-size:1.1rem; }
.pay:disabled { background:var(--line); color:var(--muted); cursor:default; }
.note { margin:0; color:var(--muted); font-size:.9375rem; text-align:center; }
.btn { min-height:48px; padding:0 16px; border-radius:12px; border:2px solid var(--brand-text); background:transparent; color:var(--brand-text); font-weight:700; display:inline-flex; align-items:center; }
.btn.solid { background:var(--brand); border-color:var(--brand); color:#fff; }
.status { padding:28px 0 24px; display:grid; gap:14px; justify-items:start; }
.status h1 { margin:0; font-family:var(--font-display); font-size:1.6rem; line-height:1.15; }
.status p { margin:0; color:var(--muted); }
.ref { display:flex; align-items:center; justify-content:space-between; gap:12px; width:100%; padding:14px 16px; border:2px solid var(--brand-text); border-radius:16px; background:var(--brand-tint); }
.ref b { font-family:var(--font-display); font-size:2.2rem; letter-spacing:.04em; line-height:1; }
.ref .k { display:block; font-size:.9375rem; color:var(--muted); font-weight:600; }
.toast { position:fixed; left:50%; bottom:calc(90px + env(safe-area-inset-bottom, 0px)); transform:translate(-50%,20px); opacity:0; pointer-events:none; background:var(--fg); color:var(--bg); padding:14px 20px; border-radius:12px; max-width:calc(100% - 32px); transition:opacity .2s, transform .2s; z-index:40; }
.toast.on { opacity:1; transform:translate(-50%,0); }
@media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast" role="status"></div>
<script>
(function () {
  'use strict';
  var W = { title: 'Make a donation', loading: 'Loading…', failed: 'We could not load this page.', failedHelp: 'Please check your connection and try again.', retry: 'Try again',
    closed: 'Donations are not open right now.', closedHelp: 'Please ask at the parish office, or look again later.' };
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function gbp(n) { return '£' + (Math.round(Number(n) * 100) / 100).toFixed(2); }
  function ico(d, s) { return '<svg width="' + (s || 24) + '" height="' + (s || 24) + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + d + '</svg>'; }
  var I = { back: '<path d="M15 6l-6 6 6 6"/>', copy: '<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>',
    heart: '<path d="M12 20.5C5 15.6 3 12.2 3 9a4.6 4.6 0 0 1 9-1.3A4.6 4.6 0 0 1 21 9c0 3.2-2 6.6-9 11.5Z"/>' };
  var toastEl = $('toast'), tt;
  function say(msg) { toastEl.textContent = msg; toastEl.classList.add('on'); clearTimeout(tt); tt = setTimeout(function () { toastEl.classList.remove('on'); }, 2800); }
  function mast(name, sub, slug) { return '<header class="mast gutter"><div class="wrap"><div class="id">' + (slug ? '<a class="back" href="/go/' + esc(slug) + '" aria-label="Back to the parish page" title="Back to the parish page">' + ico(I.back) + '</a>' : '') + '<h1>' + (sub ? '<small>' + esc(sub) + '</small>' : '') + esc(name) + '</h1></div></div></header>'; }
  function status(title, help, retry, slug) { $('app').innerHTML = mast(W.title, '', slug) + '<main class="gutter"><div class="wrap"><div class="status"><h1>' + esc(title) + '</h1><p>' + esc(help) + '</p>' + (retry ? '<button class="btn solid" type="button" id="retry">' + esc(W.retry) + '</button>' : '') + '</div></div></main>'; }

  var P = window.__donP, slug = P.slug, donationId = P.donation;
  var data = null, f = { amount: '10', purpose: '', name: '', contact: '' }, busy = false, errMsg = '', badField = '', attemptRef = '';

  // The note shown wherever a name or contact is asked for: they are told, before they go on, that the church stores what they enter, and where the privacy notice is.
  function privacyText() {
    var o = data.org || {}, link = /^https:\/\/[^\s]+$/i.test(o.privacy_url || '') ? '<a class="plink" href="' + esc(o.privacy_url) + '" target="_blank" rel="noopener">How we use your details, and your rights: Privacy Notice</a>' : '';
    return 'By continuing, you confirm you are happy to share the details you enter here with ' + esc(o.name || 'the parish') + ', and you understand they are stored by the church.' + link;
  }
  function amountValue() { var s = String(f.amount).replace(/[£,\s]/g, ''); if (s === '') return NaN; var v = Math.round(Number(s) * 100) / 100; return isFinite(v) ? v : NaN; }
  function render() {
    var a = data.amount, v = amountValue();
    var html = mast(W.title, data.org.name, slug) + '<main class="gutter"><div class="wrap" style="display:grid;grid-template-columns:minmax(0,1fr);gap:14px">' +
      '<section class="panel"><div class="hero"><span class="heart">' + ico(I.heart, 30) + '</span><p class="intro">' + esc(data.intro || 'Thank you for supporting the life and work of our parish. Give whatever you wish, by card.') + '</p></div></section>' +
      '<section class="panel" aria-labelledby="h1"><h2 id="h1">How much would you like to give?</h2><div class="quick" role="group" aria-labelledby="h1">' +
      a.quick.map(function (q) { return '<button type="button" class="q" data-quick="' + q + '" aria-pressed="' + (v === q) + '">£' + q + '</button>'; }).join('') + '</div>' +
      '<div class="f"><label for="fAmount">Or type any amount</label><div class="amt' + (badField === 'amount' ? ' bad' : '') + '"><span aria-hidden="true">£</span><input id="fAmount" inputmode="decimal" autocomplete="off" value="' + esc(f.amount) + '" aria-describedby="amtHelp"></div><span class="help" id="amtHelp" style="color:var(--muted);font-size:.9375rem">From £' + a.min.toFixed(2) + ' to £' + a.max.toLocaleString('en-GB') + '.</span></div></section>' +
      '<section class="panel" aria-labelledby="hp"><h2 id="hp">What is your gift for? (optional)</h2>' +
      (data.purposes && data.purposes.length ? '<div class="chips" role="group" aria-labelledby="hp">' + data.purposes.map(function (p, i) { return '<button type="button" class="chip" data-purpose="' + i + '" aria-pressed="' + (f.purpose.trim().toLowerCase() === p.toLowerCase()) + '">' + esc(p) + '</button>'; }).join('') + '</div>' : '') +
      '<div class="f"><label for="fPurpose">' + (data.purposes && data.purposes.length ? 'Or write your own' : 'If you would like your gift to go to something in particular') + '</label><input id="fPurpose" maxlength="100" autocomplete="off" value="' + esc(f.purpose) + '" placeholder="e.g. Altar flowers"><span class="help">Please do not put anyone\u2019s personal details here.</span></div></section>' +
      '<section class="panel" aria-labelledby="h2"><h2 id="h2">Your details (optional)</h2>' +
      '<div class="f"><label for="fName">Your name</label><input id="fName" autocomplete="name" maxlength="80" value="' + esc(f.name) + '"></div>' +
      '<div class="f' + (badField === 'contact' ? ' bad' : '') + '"><label for="fContact">Email address or mobile number</label><input id="fContact" autocomplete="email" maxlength="254" value="' + esc(f.contact) + '"><span class="help">Only if you would like the parish to be able to contact you about your gift. You can leave both empty.</span></div>' +
      '<p class="privacy" id="privacyNote">' + privacyText() + '</p>' +
      '<div class="trap" aria-hidden="true"><label>Leave this empty<input id="fWebsite" tabindex="-1" autocomplete="off"></label></div></section></div></main>' +
      '<div class="bar gutter"><div class="wrap">' + (errMsg ? '<p class="err" role="alert">' + esc(errMsg) + '</p>' : '') + '<button class="pay" type="button" id="payBtn"' + (busy ? ' disabled' : '') + '><span id="payLabel">' + esc(busy ? 'Opening the payment…' : 'Give by card') + '</span><span id="payAmt">' + (!busy && isFinite(v) ? gbp(v) : '') + '</span></button><p class="note">You will pay on SumUp’s secure card page.</p></div></div>';
    var sy = window.scrollY, ae = document.activeElement && document.activeElement.id;
    $('app').innerHTML = html; window.scrollTo(0, sy);
    if (ae && $(ae) && /^f(Amount|Purpose|Name|Contact)$/.test(ae)) { var el = $(ae); el.focus(); try { el.setSelectionRange(el.value.length, el.value.length); } catch (e) { /* not for every type */ } }
  }
  function submit() {
    if (busy) return;
    f.name = $('fName').value.trim(); f.contact = $('fContact').value.trim(); f.amount = $('fAmount').value.trim(); f.purpose = $('fPurpose').value.trim();
    badField = ''; errMsg = '';
    var v = amountValue(), a = data.amount;
    if (!isFinite(v)) { badField = 'amount'; errMsg = 'Please enter the amount you would like to give.'; }
    else if (v < a.min || v > a.max) { badField = 'amount'; errMsg = 'A donation can be from £' + a.min.toFixed(2) + ' to £' + a.max.toLocaleString('en-GB') + '.00. For a larger gift, please contact the parish office.'; }
    if (errMsg) { render(); var er = document.querySelector('.err'); if (er && er.scrollIntoView) er.scrollIntoView({ block: 'nearest' }); var bad = document.querySelector('.bad'); if (bad && bad.scrollIntoView) bad.scrollIntoView({ block: 'center' }); return; }
    busy = true; render();
    if (!attemptRef) attemptRef = 'd' + Math.random().toString(36).slice(2, 12) + Date.now().toString(36);
    fetch('/api/public_donation_create', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ slug: slug, amount: v, purpose: f.purpose, name: f.name, contact: f.contact, client_ref: attemptRef, website: ($('fWebsite') || {}).value || '' }) })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (r) {
        if (r.ok && r.d.donation_id) { var pay = /^https:\/\/[^\s]+$/i.test(r.d.pay_url || '') ? r.d.pay_url : ''; if (pay) { location.href = pay; return; } location.href = '/donate.html?donation=' + encodeURIComponent(r.d.donation_id); return; }
        busy = false; attemptRef = ''; errMsg = (r.d && r.d.error) || W.failed;
        if (/email|mobile|phone/i.test(errMsg)) badField = 'contact';
        render();
      })
      .catch(function () { busy = false; errMsg = W.failedHelp; render(); });
  }

  // ---- a donation's own page
  var polls = 0, pollTimer = null;
  function donationPage(r) {
    var paid = r.status === 'paid';
    var html = mast(W.title, r.org_name, r.org_slug ? r.org_slug : '') + '<main class="gutter"><div class="wrap"><div class="status">';
    if (paid) html += '<h1>Thank you for your gift of ' + gbp(r.amount) + (r.purpose ? ' for ' + esc(r.purpose) : '') + '.</h1><div class="ref"><div><span class="k">Your reference</span><b>' + esc(r.ref) + '</b></div><button class="btn" type="button" data-copy="' + esc(r.ref) + '" aria-label="Copy the reference" title="Copy the reference">' + ico(I.copy, 22) + '</button></div>' +
      '<p>We are very grateful for your generosity. God bless you.</p>' + (r.org_slug ? '<a class="btn solid" href="/go/' + esc(r.org_slug) + '">Back to the parish page</a>' : '');
    else if (r.status === 'cancelled') html += '<h1>This donation was not completed.</h1><p>' + esc(r.ref) + ' was cancelled, so nothing was taken. If you were charged, please contact the parish office.</p>' + (r.org_slug ? '<a class="btn solid" href="/donate/' + esc(r.org_slug) + '">Try again</a>' : '');
    else html += '<h1>Waiting for your payment…</h1><div class="ref"><div><span class="k">Your reference</span><b>' + esc(r.ref) + '</b></div></div><p>We are checking with the card payment. This page updates by itself. If you have not paid yet:</p>' + (/^https:\/\//.test(r.pay_url || '') ? '<a class="btn solid" href="' + esc(r.pay_url) + '">Go to the payment page</a>' : '');
    html += '</div></div></main>';
    $('app').innerHTML = html; document.title = r.ref + ' · ' + W.title;
    clearTimeout(pollTimer);
    if (r.status === 'awaiting_payment' && polls++ < 40) pollTimer = setTimeout(function () { fetch('/api/public_donation_status', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ donation_id: donationId }) }).then(function (x) { return x.json(); }).then(function (d) { if (d && d.ref) donationPage(d); }).catch(function () { /* next beat */ }); }, 4000);
  }

  document.addEventListener('click', function (e) {
    var t = e.target, b;
    if ((b = t.closest('[data-purpose]'))) { var pv = data.purposes[Number(b.getAttribute('data-purpose'))] || ''; f.purpose = f.purpose.trim().toLowerCase() === pv.toLowerCase() ? '' : pv; errMsg = ''; render(); return; }
    if ((b = t.closest('[data-quick]'))) { f.amount = b.getAttribute('data-quick'); errMsg = ''; badField = ''; render(); return; }
    if (t.closest('#payBtn')) { submit(); return; }
    if (t.closest('#retry')) { start(); return; }
    if ((b = t.closest('[data-copy]'))) { var v = b.getAttribute('data-copy'); try { navigator.clipboard.writeText(v).then(function () { say('Reference copied: ' + v); }, function () { say(v); }); } catch (x) { say(v); } return; }
  });
  document.addEventListener('input', function (e) {
    var t = e.target; if (!t) return;
    if (t.id === 'fAmount') {
      f.amount = t.value; var v = amountValue(), pa = $('payAmt'); if (pa && !busy) pa.textContent = isFinite(v) ? gbp(v) : '';
      Array.prototype.forEach.call(document.querySelectorAll('[data-quick]'), function (q) { q.setAttribute('aria-pressed', String(Number(q.getAttribute('data-quick')) === v)); });
    } else if (t.id === 'fPurpose') { f.purpose = t.value; Array.prototype.forEach.call(document.querySelectorAll('[data-purpose]'), function (c) { c.setAttribute('aria-pressed', String(f.purpose.trim().toLowerCase() === data.purposes[Number(c.getAttribute('data-purpose'))].toLowerCase())); }); }
    else if (t.id === 'fName') f.name = t.value; else if (t.id === 'fContact') f.contact = t.value;
  });
  function take(r) {
    if (donationId) {
      if (r && r.ok && r.d && r.d.ref) { donationPage(r.d); return; }
      if (r && r.status === 404) { status('We could not find that donation.', 'Please check the link, or ask at the parish office.', false, ''); return; }
      status(W.failed, W.failedHelp, true, ''); return;
    }
    if (!r) { status(W.failed, W.failedHelp, true, slug); return; }
    if (r.status === 404) { status(W.closed, W.closedHelp, false, slug); return; }
    if (r.ok && r.d && r.d.amount) { data = r.d; f.amount = String(data.amount.suggested); document.title = W.title + ' · ' + data.org.name; render(); return; }
    status(W.failed, W.failedHelp, true, slug);
  }
  function start() {
    if (!donationId && !slug) { status(W.closed, W.closedHelp, false, ''); return; }
    var p = P.p; P.p = null;
