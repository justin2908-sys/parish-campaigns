[build]
  functions = "netlify/functions"
  publish = "public"

# CREDIT GUARD. Every production deploy costs Netlify credits (deploy previews and branch deploys
# are free). Production therefore only builds when the commit message contains PUBLISH-NOW;
# any other push to main is skipped. Day-to-day work goes on the `dev` branch and is tested on
# its free deploy-preview address. Netlify skips the build when this command exits 0.
[context.production]
  ignore = "! git log -1 --pretty=%B | grep -qF 'PUBLISH-NOW'"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200

# Browser-side protections on every page. The pages use inline scripts and styles, so the
# policy allows those but nothing from other sites: no outside scripts, no requests to anywhere
# but this site, no framing by other sites, no plugins.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://images.sumup.com; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

# The fonts never change, so browsers may keep them for a year (no re-download on every visit).
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The Parish Gateway: one page for every organisation, at /go/<address>. A real file (such as /go/sw.js) is served as itself;
# only an address that is not a file is answered with the page, which then reads its address from the URL.
[[redirects]]
  from = "/go/*"
  to = "/go.html"
  status = 200

# The Repository (parish shop) online, at /shop/<address>. The same page also shows an order's own page at /shop.html?order=<id>.
[[redirects]]
  from = "/shop/*"
  to = "/shop.html"
  status = 200

# Listings (the parish classifieds), at /listings/<address>. A lister's own page is /listings.html?manage=<private link>.
[[redirects]]
  from = "/listings/*"
  to = "/listings.html"
  status = 200

# The Thursday email to the parish office (candle requests for the coming week, Repository orders for the coming weekend). 07:00, 08:00 and 09:00 UTC on Thursdays:
# the function itself waits for 8 o'clock in the parish's own time and sends once a week, so summer time and a failed first attempt both take care of themselves.
[functions."thursday-digest"]
  schedule = "0 7,8,9 * * 4"

# Light a Candle, at /candles/<address>. A request's own page is /candles.html?request=<id>.
[[redirects]]
  from = "/candles/*"
  to = "/candles.html"
  status = 200
